# NP960XMA: two woofers only, -30 dB digital / -3 dB PA kernel ceiling.
# A deliberately quiet diagnostic, not calibrated speaker protection.
Syntax 4

SectionUseCase."HiFi" {
	File "/Qualcomm/x1e80100/NP960XMA-Quiet-HiFi.conf"
	Comment "HiFi quality Music."
}

BootSequence [
	cset "name='WSA WSA_RX0 Digital Volume' 54"
	cset "name='WSA WSA_RX1 Digital Volume' 54"
	cset "name='WSA2 WSA_RX0 Digital Volume' 54"
	cset "name='WSA2 WSA_RX1 Digital Volume' 54"
	cset "name='SpkrLeft PA Volume' 6"
	cset "name='SpkrRight PA Volume' 6"
	cset "name='HPHL Volume' 20"
	cset "name='HPHR Volume' 20"
	cset "name='ADC2 Volume' 10"
]

Include.card-init.File "/lib/card-init.conf"
Include.ctl-remap.File "/lib/ctl-remap.conf"
Include.wcd-init.File "/codecs/wcd938x/init.conf"
Include.rxm-init.File "/codecs/qcom-lpass/rx-macro/init.conf"

Include.wsa-init.File "/codecs/wsa883x/init.conf"
