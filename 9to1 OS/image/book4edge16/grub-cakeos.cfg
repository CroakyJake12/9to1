# CakeOS Book4 Edge 16" boot entries (Snapdragon X Elite X1E80100).
# Sourced from the live ISO grub.cfg. The devicetree line loads the X1E80100
# Book4 Edge DTB shipped in the image at:
# /casper/dtbs/qcom/x1e80100-samsung-galaxy-book4-edge.dtb
# NOTE: GRUB lockdown (Secure Boot) forbids the devicetree command:
# disable Secure Boot (F2) before booting this image.

menuentry "CakeOS Emergency (Book4 Edge 16\" ARM64)" {
    set gfxpayload=keep
    linux /casper/vmlinuz clk_ignore_unused pd_ignore_unused quiet splash ---
    devicetree /casper/dtbs/qcom/x1e80100-samsung-galaxy-book4-edge.dtb
    initrd /casper/initrd
}

menuentry "CakeOS Emergency (Book4 Edge 16\" ARM64, no DTB override)" {
    set gfxpayload=keep
    linux /casper/vmlinuz clk_ignore_unused pd_ignore_unused quiet splash ---
    initrd /casper/initrd
}

menuentry "CakeOS Rescue (Book4 Edge 16\" ARM64, text + SSH)" {
    set gfxpayload=text
    linux /casper/vmlinuz clk_ignore_unused pd_ignore_unused systemd.unit=multi-user.target console=tty0 ---
    devicetree /casper/dtbs/qcom/x1e80100-samsung-galaxy-book4-edge.dtb
    initrd /casper/initrd
}

menuentry "CakeOS Rescue (no GPU/display drivers, text + SSH)" {
    set gfxpayload=text
    linux /casper/vmlinuz clk_ignore_unused pd_ignore_unused systemd.unit=multi-user.target console=tty0 nomodeset modprobe.blacklist=msm ---
    devicetree /casper/dtbs/qcom/x1e80100-samsung-galaxy-book4-edge.dtb
    initrd /casper/initrd
}
