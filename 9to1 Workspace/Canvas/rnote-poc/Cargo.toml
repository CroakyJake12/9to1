[package]
name = "cakeos-canvas-rnote-poc"
version = "0.1.0"
edition = "2024"
rust-version = "1.92"
publish = false
license = "GPL-3.0-or-later"

[lib]
crate-type = ["rlib", "cdylib"]

[dependencies]
serde_json = { version = "1.0", features = ["float_roundtrip"] }
anyhow = "1.0"
slotmap = { version = "1.0", features = ["serde"] }
futures = { version = "0.3", features = ["executor"] }
parry2d-f64 = { version = "0.26.0", features = ["serde-serialize"] }
rnote-compose = { path = "../Source/Rnote/crates/rnote-compose", default-features = false }
rnote-engine = { path = "../Source/Rnote/crates/rnote-engine", default-features = false }

[dev-dependencies]
flate2 = "1.1"
serde_json = "1.0"
