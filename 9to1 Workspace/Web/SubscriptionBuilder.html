<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Configure your 9to1 subscription</title><style>body{font:1rem system-ui;max-width:60rem;margin:auto;padding:2rem}fieldset{margin:1rem 0;border-radius:1rem}label{display:inline-block;padding:.8rem}button,input{font:inherit}output{white-space:pre-line;display:block;padding:1rem;background:#eee;border-radius:.5rem}:focus-visible{outline:3px solid #165dcc}small{display:block}</style><h1>Configure your subscription</h1><p>Choose monthly AI usage, then storage. Option prices include your other current selection. Your final quote uses the same server calculation.</p><form id="builder"><fieldset><legend>Monthly AI usage</legend><div id="ai"></div><label>Custom AI Dust <input id="custom-dust" type="number" min="0" step="1" disabled></label></fieldset><fieldset><legend>Storage</legend><div id="storage"></div><label>Custom storage in GB <input id="custom-storage" type="number" min="0" step=".001" disabled></label></fieldset><output id="summary" aria-live="polite">Sign in with CAKE ID to see your server quote.</output><button type="submit">Continue to trusted checkout</button></form><script>
'use strict';
const multipliers=[.5,1,3,5,15,25,50,100], sizes=[20,100,250,500,1000,3000,5000,15000];let currentQuote=null,revision=0;
function choices(container,name,values,label){for(const value of [...values,'Custom']){const wrapper=document.createElement('label'),input=document.createElement('input');input.type='radio';input.name=name;input.value=value;input.checked=value===values[1];wrapper.append(input,document.createTextNode(' '+label(value)));const dust=document.createElement('span');dust.dataset.dust=value;wrapper.append(dust);const price=document.createElement('small');price.textContent=value==='Custom'?'Enter a custom quantity for its monthly price':'Monthly price unavailable';price.dataset.option=value;wrapper.append(price);container.append(wrapper);}}
choices(document.querySelector('#ai'),'ai',multipliers,v=>v==='Custom'?v:v+'x');choices(document.querySelector('#storage'),'storage',sizes,v=>v==='Custom'?v:v>=1000?v/1000+' TB':v+' GB');
function selection(){const ai=document.querySelector('[name=ai]:checked').value,storage=document.querySelector('[name=storage]:checked').value;document.querySelector('#custom-dust').disabled=ai!=='Custom';document.querySelector('#custom-storage').disabled=storage!=='Custom';const dustInput=document.querySelector('#custom-dust').value,storageInput=document.querySelector('#custom-storage').value;const dust=ai==='Custom'?Number(dustInput):null,bytes=Math.round((storage==='Custom'?Number(storageInput):Number(storage))*1e9);if(ai==='Custom'&&(!dustInput||!Number.isSafeInteger(dust)||dust<0))throw Error('Enter a nonnegative whole monthly AI Dust quantity within the supported safe range.');if(storage==='Custom'&&(!storageInput||!Number.isFinite(Number(storageInput))||Number(storageInput)<0))throw Error('Enter a nonnegative custom storage amount in GB.');if(!Number.isSafeInteger(bytes)||bytes<0)throw Error('Storage exceeds the supported safe input range.');return {aiMultiplier:ai==='Custom'?null:Number(ai),customDust:dust,storageBytes:bytes};}
// The CAKE login composition supplies a short-lived access token in memory. Never store bearer tokens in localStorage.
async function request(path,body){const token=window.cakeAccessToken;if(!token)throw Error('Sign in with CAKE ID to calculate your subscription.');const response=await fetch(path,{method:'POST',headers:{'Content-Type':'application/json',Authorization:'Bearer '+token},body:JSON.stringify(body)});const result=await response.json();if(!response.ok)throw Error(result.error||result.detail||'The request could not be completed.');return result;}
function money(value,currency){return new Intl.NumberFormat(undefined,{style:'currency',currency}).format(value);}
async function refresh(){const requestRevision=++revision;currentQuote=null;document.querySelector('button[type=submit]').disabled=true;try{const chosen=selection(),[result,options]=await Promise.all([request('/api/subscription/preview',chosen),request('/api/subscription/options',chosen)]);if(requestRevision!==revision)return;for(const [id,results,values]of [['ai',options.ai,multipliers],['storage',options.storage,sizes]])results.forEach((r,i)=>{const element=document.querySelector('#'+id+' small[data-option="'+values[i]+'"]');element.textContent=r.quote?money(r.quote.breakdown.finalMonthlyCharge,r.quote.currency)+' / month with current other selection':'Price unavailable: '+r.blockers.map(b=>b.field).join(', ');if(id==='ai')document.querySelector('#ai span[data-dust="'+values[i]+'"]').textContent=r.quote?' · '+r.quote.actualMonthlyDust.toLocaleString()+' AI Dust':'';});if(!result.quote){document.querySelector('#summary').textContent=result.blockers.map(b=>b.field+': '+b.reason).join('\n');return;}currentQuote=result.quote;document.querySelector('button[type=submit]').disabled=false;for(const id of ['ai','storage']){const element=document.querySelector('#'+id+' small[data-option="Custom"]');const isCustom=(id==='ai'?chosen.aiMultiplier===null:document.querySelector('[name=storage]:checked').value==='Custom');element.textContent=isCustom?money(currentQuote.breakdown.finalMonthlyCharge,currentQuote.currency)+' / month with current other selection':'Enter a custom quantity to calculate its monthly price';}const b=currentQuote.breakdown;document.querySelector('#summary').textContent=currentQuote.actualMonthlyDust.toLocaleString()+' AI Dust/month · '+(currentQuote.selection.storageBytes/1e9)+' GB\nMonthly price: '+money(b.taxExclusiveMonthlyPrice,currentQuote.currency)+' before tax\nTax: '+money(b.tax,currentQuote.currency)+'\nTotal: '+money(b.finalMonthlyCharge,currentQuote.currency)+' / month\n\nApproved full-allowance cost breakdown (costs, not extra charges):\nAI allowance: '+money(b.aiAllowanceCost,currentQuote.currency)+'\nStorage: '+money(b.storageCost,currentQuote.currency)+'\nAttributable infrastructure: '+money(b.infrastructureCost,currentQuote.currency)+'\nShared operating cost (once): '+money(b.sharedOperatingCost,currentQuote.currency)+'\nPayment fees: '+money(b.paymentFees,currentQuote.currency)+'\nBilling fees: '+money(b.billingFees,currentQuote.currency)+'\nMargin on tax-exclusive revenue: '+money(b.margin,currentQuote.currency);}catch(error){if(requestRevision===revision)document.querySelector('#summary').textContent=error.message;}}
let debounceTimer;
const form=document.querySelector('#builder'),checkoutButton=document.querySelector('button[type=submit]');
function invalidate(){++revision;currentQuote=null;checkoutButton.disabled=true;document.querySelector('#summary').textContent='Updating your monthly quote…';}
form.addEventListener('input',()=>{invalidate();clearTimeout(debounceTimer);debounceTimer=setTimeout(refresh,250);});
form.addEventListener('change',()=>{clearTimeout(debounceTimer);refresh();});
function sameSelection(a,b){return a.aiMultiplier===b.aiMultiplier&&a.customDust===b.customDust&&a.storageBytes===b.storageBytes;}
form.addEventListener('submit',async event=>{event.preventDefault();clearTimeout(debounceTimer);try{const chosen=selection();if(!currentQuote||!sameSelection(chosen,currentQuote.selection))await refresh();if(!currentQuote||!sameSelection(selection(),currentQuote.selection))return;const submittedRevision=revision,quoteID=currentQuote.quoteID;checkoutButton.disabled=true;const result=await request('/api/subscription/checkout/'+quoteID,{});if(submittedRevision!==revision||!currentQuote||currentQuote.quoteID!==quoteID)return;location.assign(result.url);}catch(error){document.querySelector('#summary').textContent=error.message;}finally{checkoutButton.disabled=!currentQuote;}});refresh();
</script>
