[package]
name = "cakeos-images-backend"
version = "0.1.0"
edition = "2024"
rust-version = "1.92"
publish = false
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]
name = "cakeos_images_backend"

[dependencies]
glycin = { version = ">=2.0", features = ["all-formats", "metadata", "color-management"] }
anyhow = "1.0"
thiserror = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
image = { version = "0.25", features = ["jpeg", "png", "webp", "avif", "heic", "tiff", "bmp", "ico"] }
lcms2 = "0.5"
cairo-rs = { version = "0.18", features = ["cairo-1-16", "png", "svg"] }
glib = "0.20"
gio = "0.20"

[dev-dependencies]
tempfile = "3.0"