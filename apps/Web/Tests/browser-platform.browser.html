<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Browser platform adapter tests</title></head>
<body>
<div id="browser-status" role="status"></div>
<pre id="results"></pre>
<script type="module">
import { createBrowserPlatform } from '../wwwroot/browser-platform.js';
const platform = createBrowserPlatform(window, document);
const records = [];
const changes = [];
let closed = 0, invalidated = 0;
const unsubscribe = platform.subscribe(fragment => changes.push(fragment), () => closed++, () => invalidated++);
const assert = (condition, message) => { if (!condition) throw new Error(message); };
const settle = () => new Promise(resolve => setTimeout(resolve, 50));
async function test(id, operation) {
    try { await operation(); records.push({ id, outcome: 'PASS' }); }
    catch (error) { records.push({ id, outcome: 'FAIL', message: error.message }); }
}
await test('B1-DOM-01-route-path-and-identity', async () => {
    const pathname = location.pathname;
    platform.writeFragment('#/home.library?entityId=opaque%2Fid&action=Reveal', false);
    assert(location.pathname === pathname, 'Route changed server pathname');
    assert(location.hash === '#/home.library?entityId=opaque%2Fid&action=Reveal', 'Canonical context lost');
    assert(history.state === null, 'Private data persisted in history state');
});
await test('B1-DOM-02-duplicate-no-history-entry', async () => {
    const length = history.length;
    platform.writeFragment(location.hash, false);
    assert(history.length === length, 'Duplicate route added history entry');
});
await test('B1-DOM-03-real-back-forward-dedup', async () => {
    const original = location.hash;
    platform.writeFragment('#/home.events', false);
    history.back();
    await settle();
    assert(changes.length === 1 && changes[0] === original, 'Back caused duplicate or incorrect destination');
    history.forward();
    await settle();
    assert(changes.length === 2 && changes[1] === '#/home.events', 'Forward caused duplicate or incorrect destination');
});
await test('B1-DOM-04-real-hashchange-dedup', async () => {
    const previous = changes.length;
    location.hash = '#/home.library?entityId=second';
    await settle();
    assert(changes.length === previous + 1, 'Direct fragment edit produced duplicate navigation');
    dispatchEvent(new PopStateEvent('popstate'));
    dispatchEvent(new HashChangeEvent('hashchange'));
    assert(changes.length === previous + 1, 'Repeated DOM events repeated navigation');
});
await test('B1-DOM-05-failure-is-text', async () => {
    platform.showStatus('PermissionDenied', '<img src=x onerror=alert(1)>');
    const status = document.getElementById('browser-status');
    assert(status.childElementCount === 0 && status.textContent === '<img src=x onerror=alert(1)>', 'Error copy interpreted as markup');
    assert(status.dataset.code === 'PermissionDenied' && !status.hidden, 'Structured failure not visible');
});
await test('B1-DOM-06-bfcache-event-fail-closed', async () => {
    dispatchEvent(new PageTransitionEvent('pagehide', { persisted: true }));
    dispatchEvent(new PageTransitionEvent('pageshow', { persisted: true }));
    assert(invalidated === 2 && closed === 0, 'Cached document resumed without invalidation');
    dispatchEvent(new PageTransitionEvent('pagehide', { persisted: false }));
    assert(closed === 1, 'Uncached page did not release shell');
});
await test('B1-DOM-07-disposal-removes-handlers', async () => {
    const previous = changes.length;
    unsubscribe();
    location.hash = '#/home.dashboard';
    await settle();
    dispatchEvent(new PageTransitionEvent('pageshow', { persisted: true }));
    assert(changes.length === previous && invalidated === 2, 'Disposed handlers retained callbacks');
});
window.browserPlatformResults = { records, discovered: 7, executed: records.length, failed: records.filter(record => record.outcome === 'FAIL').length, userAgent: navigator.userAgent,
    limit: 'Real Chromium DOM/history adapter validation. BFCache lifecycle dispatch is controlled event coverage, not real suspended authenticated runtime acceptance.' };
document.getElementById('results').textContent = JSON.stringify(window.browserPlatformResults, null, 2);
</script>
</body>
</html>
