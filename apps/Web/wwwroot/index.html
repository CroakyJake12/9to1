<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <link rel="icon" href="data:,">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>9to1</title>
  <link rel="stylesheet" href="./cui-bootstrap.css">
  <script>
    performance.mark('9to1:host');
    try {
      const palette = JSON.parse(localStorage.getItem('9to1.cui.host-palette.v1'));
      if (Array.isArray(palette) && palette.length === 3 && palette.every(value => /^#[0-9a-f]{6}$/i.test(value)))
        ['background', 'foreground', 'panel'].forEach((name, index) => document.documentElement.style.setProperty('--cui-boot-' + name, palette[index]));
    } catch { /* Unavailable presentation cache cannot block application startup. */ }
  </script>
</head>
<body>
  <div id="browser-status" role="status" aria-live="polite" data-code="Loading">Opening 9to1…</div>
  <button id="browser-retry" type="button" hidden onclick="location.reload()">Retry opening 9to1</button>
  <main id="nine-to-one-root" aria-label="9to1 application"></main>
  <noscript>JavaScript is required to run 9to1 in this browser.</noscript>
  <script type="module" src="./main.js" onerror="document.getElementById('browser-status').textContent='9to1 could not load its resources. Check your connection and try again.'; document.getElementById('browser-status').dataset.code='BrowserResourceUnavailable'; document.getElementById('browser-retry').hidden=false;"></script>
</body>
</html>
