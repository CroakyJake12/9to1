<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>9to1 relay</title>
<style>body{margin:0;background:#10151f;color:#e9edf6;font:16px system-ui}main{max-width:1050px;margin:auto;padding:32px}h1{margin:0 0 8px}p{line-height:1.5}.muted{color:#a8b5ce}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px;margin:24px 0}article{padding:18px;background:#1b2537;border:1px solid #34435b;border-radius:12px}strong{display:block;font-size:20px;margin-top:8px}button{font:inherit;cursor:pointer;padding:10px 16px;background:#244875;color:white;border:1px solid #739acf;border-radius:7px;margin:4px}button:focus-visible{outline:3px solid #ffd079}button:disabled{opacity:.5}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#182234;padding:16px;border-radius:8px}#error{color:#ffd079}.controls{padding:12px 0}table{border-collapse:collapse;width:100%}th,td{text-align:left;padding:9px;border-bottom:1px solid #34435b}h2{font-size:20px;margin-top:30px}</style>
<main><h1>9to1 development relay</h1><p class="muted" id="time">Connecting to the local runner…</p><p id="error" role="status"></p>
<div class="cards"><article>Scheduled shift<strong id="shift">—</strong><span id="window"></span></article><article>Ownership<strong id="owner">—</strong><span id="worker"></span></article><article>Strata<strong id="strata">—</strong><span id="model"></span></article><article>Cloud<strong id="cloud">—</strong><span id="coordinator"></span></article></div>
<div class="controls" aria-label="Relay controls"><button data-action="home">Home</button><button data-action="away">Away</button><button data-action="pause">Pause</button><button data-action="resume">Resume</button><button data-action="checkpoint">Force checkpoint</button><button data-action="handover">Safe handover</button></div>
<p id="result" role="status" aria-live="polite"></p><p id="availability"></p><p><b>Unattended switching:</b> <span id="verified">NOT VERIFIED</span></p>
<h2>Tasks and evidence</h2><table><thead><tr><th>Task</th><th>Worker</th><th>Status</th><th>Acceptance</th></tr></thead><tbody id="tasks"></tbody></table>
<h2>Latest handover</h2><pre id="handover">No handover</pre><h2>Recent operations</h2><pre id="events"></pre></main>
<script>const csrf=__CSRF__;const text=(id,s)=>document.getElementById(id).textContent=s??'—';async function refresh(){try{const s=await(await fetch('/status')).json();text('time',new Intl.DateTimeFormat('en-GB',{timeZone:'Europe/London',dateStyle:'medium',timeStyle:'medium'}).format(new Date(s.at))+' · Europe/London');text('shift',s.planned_shift.shift.toUpperCase());text('window',s.planned_shift.window+' · next boundary '+s.planned_shift.next_boundary);text('owner',s.active_shift);text('worker',s.active_worker+' · OpenCode '+s.opencode);text('strata',s.strata?.ready?'READY':s.strata?.status??'UNREACHABLE');text('model',s.strata?.model??'Model unavailable');text('cloud',s.cloud.status);text('coordinator',s.coordinator+' coordinator');text('availability',(s.presence.home?'Home':'Away')+' · '+(s.presence.paused?'Paused':'Resumed'));text('error',s.error);text('verified',s.unattended_switching.replaceAll('_',' '));const body=document.getElementById('tasks');body.replaceChildren();for(const t of s.tasks){const row=document.createElement('tr');for(const v of[t.id,t.owner??'Unclaimed',t.status,t.acceptance]){const cell=document.createElement('td');cell.textContent=v;row.append(cell)}body.append(row)}const h=s.latest_handover;text('handover',h?JSON.stringify({direction:h.from+' to '+h.to,status:h.status,branch:h.source.branch,sha:h.source.sha,revision:h.revision,acknowledgement:h.ack??null,tests:h.tests.map(t=>({status:t.status,passed:t.passed,failed:t.failed,exit_code:t.exit_code})),blockers:h.blockers},null,2):'No remotely validated handover');text('events',s.events.map(e=>e.at+' '+e.event+' '+JSON.stringify(e.value)).join('\n'))}catch(e){text('error','Local runner unreachable: '+e.message)}}for(const b of document.querySelectorAll('button[data-action]'))b.onclick=async()=>{b.disabled=true;try{const r=await fetch('/control/'+b.dataset.action,{method:'POST',headers:{'x-relay-csrf':csrf}});const d=await r.json();text('result',d.message??d.error)}catch(e){text('result',e.message)}finally{b.disabled=false;await refresh()}};refresh();setInterval(refresh,5000);</script></html>
