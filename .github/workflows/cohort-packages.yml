name: HavenOS standalone package admission

on:
  workflow_dispatch:
  push:
    paths:
      - "9to1 Workspace/Data/**"
      - "9to1 Workspace/Present/present-engine/**"
      - "9to1 OS/compatibility/wine/**"
      - "9to1 OS/packaging/cohort/**"
      - "9to1 OS/packaging/llamacpp/cohort-artifact.lock.json"
      - "9to1 OS/release/package-preload-manifest.json"
      - ".github/workflows/cohort-packages.yml"

permissions:
  contents: read

jobs:
  package:
    name: Standalone admission metadata (no package build)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Install package build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y dpkg-dev python3 python3-uno libreoffice-calc-nogui libreoffice-impress-nogui libreofficekit-dev nlohmann-json3-dev bubblewrap systemd
      - name: Build Data release source
        run: dotnet build "9to1 Workspace/Data/App/HavenOS.Data.App.csproj" -c Release --nologo
      - name: Build Present worker
        run: cmake -S "9to1 Workspace/Present/present-engine" -B build/present -DCMAKE_BUILD_TYPE=Release && cmake --build build/present --parallel
      - name: Verify source-carrier builder remains retired
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/admission
          bash -n "9to1 OS/packaging/cohort/build-debs.sh" "9to1 OS/packaging/cohort/verify-debs.sh"
          status=0
          bash "9to1 OS/packaging/cohort/build-debs.sh" artifacts/rejected-source-carriers > artifacts/admission/retired-builder.log 2>&1 || status=$?
          test "$status" -eq 2
          test ! -e artifacts/rejected-source-carriers
          printf 'retired_source_carrier_exit=%s\n' "$status" > artifacts/admission/admission-record.txt
      - name: Validate immutable standalone artifact admission metadata
        shell: bash
        run: |
          set -euo pipefail
          python3 "9to1 OS/packaging/cohort/verify-admission.py" | tee artifacts/admission/metadata-validation.log
          cp "9to1 OS/packaging/llamacpp/cohort-artifact.lock.json" artifacts/admission/
          cp "9to1 OS/release/package-preload-manifest.json" artifacts/admission/
          printf 'scope=retirement and immutable admission metadata only\npackage_bytes_verified=false\npackages_built=false\nrelease_state=BLOCKED\n' >> artifacts/admission/admission-record.txt
      - name: Preserve admission metadata evidence
        uses: actions/upload-artifact@v4
        with:
          name: havenos-standalone-admission-metadata-${{ github.sha }}
          path: artifacts/admission
          if-no-files-found: error
          retention-days: 30
