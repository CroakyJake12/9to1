name: Team B real Wave responsive browser
on:
  workflow_dispatch:
  push:
    branches: [team-b/astra-browser-validation-20261003]
    paths:
      - apps/Web/Tests/WaveResponsiveBrowser/run-wave-responsive-browser.cjs
      - apps/Web/Tests/WaveResponsiveBrowser/zoom-extension/manifest.json
      - apps/Web/Tests/WaveResponsiveBrowser/zoom-extension/background.js
      - apps/Web/Tests/WaveResponsiveBrowser/source-pins.json
      - apps/Web/Tests/ci/run-wave-responsive-browser.py
      - .github/workflows/team-b-wave-responsive-browser.yml
permissions:
  contents: read
jobs:
  native-glyph-support:
    if: startsWith(github.ref, 'refs/heads/team-b/')
    strategy:
      fail-fast: false
      matrix:
        variant: [original, proposed]
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      DOTNET_NOLOGO: "1"
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_GENERATE_ASPNET_CERTIFICATE: "false"
      MSBUILDDISABLENODEREUSE: "1"
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Initialize actual native source gitlinks
        run: |
          git submodule update --init --recursive --depth 1 -- \
            framework/CUI/vendor/Avalonia/external/XamlX \
            framework/CUI/vendor/Avalonia/external/Avalonia.DBus
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.401"
      - name: Run same-source original and proposed actual native glyph geometry
        run: >-
          python3 apps/Web/Tests/ci/run-wave-responsive-native.py
          --variant '${{ matrix.variant }}'
          --expected-commit '${{ github.sha }}'
          --output "$RUNNER_TEMP/wr-native-${{ matrix.variant }}"
      - name: Retain actual original red or proposed green raw diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: team-b-wave-responsive-native-${{ matrix.variant }}-${{ github.sha }}
          path: ${{ runner.temp }}/wr-native-${{ matrix.variant }}/diagnostics
          if-no-files-found: warn
          retention-days: 7
  real-browser:
    if: startsWith(github.ref, 'refs/heads/team-b/')
    needs: native-glyph-support
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      DOTNET_NOLOGO: "1"
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_GENERATE_ASPNET_CERTIFICATE: "false"
      MSBUILDDISABLENODEREUSE: "1"
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Initialize actual native source gitlinks
        run: |
          git submodule update --init --recursive --depth 1 -- \
            framework/CUI/vendor/Avalonia/external/XamlX \
            framework/CUI/vendor/Avalonia/external/Avalonia.DBus
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.401"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Publish genuine same-source product with maintained recipe
        run: >-
          python3 apps/Web/Tests/ci/run-ordinary-web-publish.py
          --expected-commit '${{ github.sha }}'
          --output "$RUNNER_TEMP/wr-publish"
      - name: Create fresh consumer checkout of exact published source
        run: |
          test ! -e "$RUNNER_TEMP/wr-consumer"
          git worktree add --detach "$RUNNER_TEMP/wr-consumer" '${{ github.sha }}'
      - name: Install exact Playwright and real Chromium
        env:
          PLAYWRIGHT_MODULE: ${{ runner.temp }}/wr-tools/node_modules/playwright
          PLAYWRIGHT_BROWSERS_PATH: ${{ runner.temp }}/wr-tools/browsers
        run: |
          npm install --prefix "$RUNNER_TEMP/wr-tools" --ignore-scripts --no-package-lock --no-audit --no-fund playwright@1.62.0
          node "$PLAYWRIGHT_MODULE/cli.js" install --with-deps chromium
      - name: Run additional actual390 touch keyboard and genuine200% browser criteria
        working-directory: ${{ runner.temp }}/wr-consumer
        env:
          PLAYWRIGHT_MODULE: ${{ runner.temp }}/wr-tools/node_modules/playwright
          PLAYWRIGHT_BROWSERS_PATH: ${{ runner.temp }}/wr-tools/browsers
        run: >-
          python3 apps/Web/Tests/ci/run-wave-responsive-browser.py
          --expected-commit '${{ github.sha }}'
          --publication "$RUNNER_TEMP/wr-publish"
          --output "$RUNNER_TEMP/wr-run"
      - name: Retain public raw proof and rendered screenshots for visual review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: team-b-wave-responsive-browser-${{ github.sha }}
          path: |
            ${{ runner.temp }}/wr-run/diagnostics
            ${{ runner.temp }}/wr-run/original14/results.json
            ${{ runner.temp }}/wr-run/original14/wave-narrow.png
            ${{ runner.temp }}/wr-run/raw/results.json
            ${{ runner.temp }}/wr-run/raw/*.png
            ${{ runner.temp }}/wr-run/raw/responsive-stereo.wav
            ${{ runner.temp }}/wr-publish/diagnostics
          if-no-files-found: warn
          retention-days: 7
      - name: Retain successful genuine public source-built bundle
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: team-b-wave-responsive-public-${{ github.sha }}
          path: ${{ runner.temp }}/wr-publish/public-artifact
          if-no-files-found: error
          retention-days: 7
