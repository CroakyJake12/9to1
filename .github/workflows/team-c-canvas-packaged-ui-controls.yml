name: Team C Canvas PS5 public signature binding witness (setup only)
on:
  push:
    branches: [team-c/sol-happy-c3-canvas-ps51-identity-signature-20261004]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: team-c-canvas-ps51-signature-${{ github.ref }}
  cancel-in-progress: false
jobs:
  signature-witness:
    runs-on: windows-2022
    timeout-minutes: 3
    steps:
      - name: Observe actual Windows PowerShell object and typed CLR signatures
        shell: powershell
        env:
          PROBE_OUTPUT: ${{ runner.temp }}/canvas-ps51-signature-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          $ErrorActionPreference='Stop'
          Set-StrictMode -Version Latest
          $result=[ordered]@{schemaVersion=1;status='NOT_RUN';sourceCommit=$env:GITHUB_SHA;runId=$env:GITHUB_RUN_ID;powerShellVersion=$PSVersionTable.PSVersion.ToString();powerShellEdition=$PSVersionTable.PSEdition;clrVersion=[Environment]::Version.ToString();windowsVersion=[Environment]::OSVersion.VersionString;runnerImage=$env:ImageVersion;checks=@();observations=@();failure=$null;nativeApplication='NOT_RUN';actualAutomationElementMethods='NOT_RUN';registration='NOT_RUN';privateValue='NOT_READ';qualification='Controlled ordinary CLR copies of documented public object/typed method signatures only. Actual Windows PowerShell argument-binding witness; not installed UIAutomation methods, UI identity, provider or Canvas acceptance. No package, app, profile, OS input, Home request or canonical state.'}
          function Write-Witness {$result|ConvertTo-Json -Depth 8|Set-Content -LiteralPath (Join-Path $env:PROBE_OUTPUT 'result.json') -Encoding UTF8}
          function Assert-Witness([bool]$Condition,[string]$Name){$result.checks+=[ordered]@{name=$Name;passed=$Condition};if(-not $Condition){throw $Name}}
          $exitCode=1
          try{
              if(Test-Path -LiteralPath $env:PROBE_OUTPUT){throw 'Witness output must be new.'}
              [void][IO.Directory]::CreateDirectory($env:PROBE_OUTPUT)
              Assert-Witness ([Environment]::OSVersion.Platform -eq [PlatformID]::Win32NT) 'Actual Windows operating system'
              Assert-Witness ($PSVersionTable.PSVersion.Major -eq 5 -and $PSVersionTable.PSEdition -ceq 'Desktop') 'Actual Windows PowerShell5 desktop host'
              # This controlled class deliberately has a different namespace and is never
              # registered as a UIA provider or passed to a real UIA API. Equals(object)
              # follows the documented public cast/null shape. Both comparison methods
              # then use the same controlled equality operation, with no UIA substitution.
              Add-Type -TypeDefinition @'
          using System;
          namespace TeamCCanvasSignatureWitness {
              public sealed class ControlledElement {
                  public int ControlledIdentity;
                  public static ControlledElement FocusedElement {get;set;}
                  public static object LastObjectArgument;
                  public static int ObjectCalls;
                  public static int TypedCalls;
                  public override bool Equals(object obj) {
                      ObjectCalls++;LastObjectArgument=obj;
                      ControlledElement el=obj as ControlledElement;
                      if(obj==null || el==null) return false;
                      return SameControlledIdentity(this,el);
                  }
                  public override int GetHashCode(){return ControlledIdentity;}
                  public static bool Compare(ControlledElement a,ControlledElement b) {
                      TypedCalls++;
                      if(a==null)throw new ArgumentNullException("a");
                      if(b==null)throw new ArgumentNullException("b");
                      return SameControlledIdentity(a,b);
                  }
                  static bool SameControlledIdentity(ControlledElement a,ControlledElement b){return a.ControlledIdentity==b.ControlledIdentity;}
              }
          }
          '@
              $elementType=[TeamCCanvasSignatureWitness.ControlledElement]
              $objectMethod=$elementType.GetMethod('Equals',[type[]]@([object]))
              $typedMethod=$elementType.GetMethod('Compare',[type[]]@($elementType,$elementType))
              Assert-Witness ($objectMethod.IsPublic -and -not $objectMethod.IsStatic -and $objectMethod.GetParameters()[0].ParameterType -eq [object]) 'Controlled public instance object signature'
              Assert-Witness ($typedMethod.IsPublic -and $typedMethod.IsStatic -and $typedMethod.GetParameters()[0].ParameterType -eq $elementType -and $typedMethod.GetParameters()[1].ParameterType -eq $elementType) 'Controlled public static typed signature'
              function New-ControlledElement([int]$Identity){$e=[TeamCCanvasSignatureWitness.ControlledElement]::new();$e.ControlledIdentity=$Identity;return $e}
              function Observe-ControlledSignatures($Editor,[string]$Label,[bool]$Expected){
                  # Same untyped function parameter and typed static-property focus read
                  # as the preserved Canvas observation; no underlying UI is simulated.
                  $focus=[TeamCCanvasSignatureWitness.ControlledElement]::FocusedElement
                  $beforeObject=[TeamCCanvasSignatureWitness.ControlledElement]::ObjectCalls
                  $beforeTyped=[TeamCCanvasSignatureWitness.ControlledElement]::TypedCalls
                  $instance=$Editor.Equals($focus)
                  $argument=[TeamCCanvasSignatureWitness.ControlledElement]::LastObjectArgument
                  $typed=[TeamCCanvasSignatureWitness.ControlledElement]::Compare($Editor,$focus)
                  $argumentIsExactElement=$argument -is [TeamCCanvasSignatureWitness.ControlledElement]
                  $argumentIsPowerShellWrapper=$argument -is [System.Management.Automation.PSObject]
                  $result.observations+=[ordered]@{case=$Label;instanceEquals=$instance;typedCompare=$typed;argumentIsExactControlledElement=$argumentIsExactElement;argumentIsPowerShellWrapper=$argumentIsPowerShellWrapper;expectedControlledEquality=$Expected;objectCallCountDelta=([TeamCCanvasSignatureWitness.ControlledElement]::ObjectCalls-$beforeObject);typedCallCountDelta=([TeamCCanvasSignatureWitness.ControlledElement]::TypedCalls-$beforeTyped)}
                  Assert-Witness ($typed -eq $Expected) ($Label+': typed signature preserved controlled equality')
                  Assert-Witness ($instance -eq ($argumentIsExactElement -and $Expected)) ($Label+': object result matches actually observed argument cast')
                  Assert-Witness ([TeamCCanvasSignatureWitness.ControlledElement]::ObjectCalls-$beforeObject -eq 1 -and [TeamCCanvasSignatureWitness.ControlledElement]::TypedCalls-$beforeTyped -eq 1) ($Label+': one object call and one typed call')
              }
              $editor=New-ControlledElement 7
              [TeamCCanvasSignatureWitness.ControlledElement]::FocusedElement=$editor
              Observe-ControlledSignatures $editor 'same-clr-reference-untyped-function' $true
              [TeamCCanvasSignatureWitness.ControlledElement]::FocusedElement=New-ControlledElement 7
              Observe-ControlledSignatures $editor 'distinct-clr-instances-same-controlled-identity' $true
              [TeamCCanvasSignatureWitness.ControlledElement]::FocusedElement=New-ControlledElement 8
              Observe-ControlledSignatures $editor 'distinct-controlled-identity' $false
              [TeamCCanvasSignatureWitness.ControlledElement]::FocusedElement=New-ControlledElement 7
              $holder=[pscustomobject]@{Value=$editor}
              Observe-ControlledSignatures $holder.Value 'note-property-function-argument' $true
              $returned=& {$editor}
              Observe-ControlledSignatures $returned 'pipeline-returned-function-argument' $true
              Observe-ControlledSignatures ([object]$editor) 'explicit-object-function-argument' $true
              Observe-ControlledSignatures ([System.Management.Automation.PSObject]::AsPSObject($editor)) 'explicit-psobject-function-argument' $true
              $same=@($result.observations|Where-Object {$_.expectedControlledEquality})
              $result.sameControlledIdentityCases=$same.Count
              $result.observedObjectWrappingRefusals=@($same|Where-Object {-not $_.instanceEquals -and $_.typedCompare}).Count
              $originalShape=@($same|Where-Object {$_.case -in @('same-clr-reference-untyped-function','distinct-clr-instances-same-controlled-identity')})
              $result.originalShapeObjectWrappingRefusals=@($originalShape|Where-Object {-not $_.instanceEquals -and $_.typedCompare}).Count
              $result.actualCanvasFailureCause='UNESTABLISHED_BY_CONTROLLED_SIGNATURES'
              $result.status='OBSERVED_CONTROLLED_CLR_SIGNATURES_ONLY'
              $exitCode=0
          }catch{
              $result.status='FAILED_OR_BLOCKED_SETUP_ONLY'
              $result.failure=[ordered]@{type=$_.Exception.GetType().FullName;rawExceptionText='WITHHELD'}
          }finally{
              if(Test-Path -LiteralPath $env:PROBE_OUTPUT){Write-Witness}
          }
          exit $exitCode
      - name: Retain original bounded setup witness only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: canvas-ps51-signature-setup-only-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/canvas-ps51-signature-${{ github.run_id }}-${{ github.run_attempt }}/result.json
          if-no-files-found: warn
          retention-days: 7
