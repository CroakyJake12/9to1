name: Team B original and proposed real native focus scroll nine

on:
  push:
    branches: [custody/team-b-native-focus-scroll-owner9-20261005]
    paths:
      - .github/workflows/team-b-native-focus-scroll-owner9.yml
      - apps/Web/Tests/NativeFocusOwner9/run-native-focus-scroll-ci.py
      - apps/Web/Tests/NativeFocusOwner9/ProposedBrowserAccessibilityBridge.cs
      - apps/Web/Tests/BrowserFocusScrollRegression.cs
      - apps/Web/Tests/BrowserFocusScroll.Tests.csproj
  workflow_dispatch:

permissions:
  contents: read

jobs:
  actual-native-nine:
    if: github.repository == 'CroakyJake12/9to1' && github.ref == 'refs/heads/custody/team-b-native-focus-scroll-owner9-20261005'
    strategy:
      fail-fast: false
      matrix:
        variant: [original, proposed]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      DOTNET_NOLOGO: "1"
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_GENERATE_ASPNET_CERTIFICATE: "false"
      MSBUILDDISABLENODEREUSE: "1"
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Check out exact isolated source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Initialize actual native build gitlinks
        run: |
          git submodule update --init --recursive --depth 1 -- \
            framework/CUI/vendor/Avalonia/external/XamlX \
            framework/CUI/vendor/Avalonia/external/Avalonia.DBus
      - name: Set up maintained real SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.401"
      - name: Build and execute same actual native nine
        run: >-
          python3 apps/Web/Tests/NativeFocusOwner9/run-native-focus-scroll-ci.py
          --variant '${{ matrix.variant }}'
          --expected-commit '${{ github.sha }}'
          --output "$RUNNER_TEMP/native-focus-owner9-${{ matrix.variant }}"
      - name: Preserve bounded diagnostics only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-focus-owner9-${{ matrix.variant }}-${{ github.sha }}
          path: ${{ runner.temp }}/native-focus-owner9-${{ matrix.variant }}/diagnostics
          if-no-files-found: warn
          retention-days: 7
