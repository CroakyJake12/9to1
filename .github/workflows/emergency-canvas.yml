name: Emergency Canvas Package

on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Git ref to build (branch or SHA)'
        required: true
        default: 'main'

jobs:
  canvas-real-package:
    name: Build real Canvas package
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      actions: read
    steps:
      - name: Checkout emergency branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.ref }}
          fetch-depth: 1
          submodules: false

      - name: Set up .NET and Rust
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - uses: dtolnay/rust-toolchain@1.92.0

      - name: Install native build and package tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake pkg-config libglib2.0-dev libcairo2-dev \
            libpango1.0-dev librsvg2-dev dpkg-dev jq xvfb

      - name: Build and test Canvas/Rnote native boundary
        run: |
          cargo generate-lockfile --manifest-path "9to1 Workspace/Canvas/rnote-poc/Cargo.toml"
          cargo build --manifest-path "9to1 Workspace/Canvas/rnote-poc/Cargo.toml" --lib --verbose
          cargo test --manifest-path "9to1 Workspace/Canvas/rnote-poc/Cargo.toml" --all-targets --verbose

      - name: Build Canvas CakeUI host
        run: |
          command -v jq || { sudo apt-get update; sudo apt-get install -y jq; }
          bash "9to1 OS/HUI/build-linux-host.sh"
          mkdir -p artifacts/canvas-host/publish
          cp artifacts/hui-linux-host/publish/cakeos-hui-linux-preview \
            artifacts/canvas-host/publish/cakeos-canvas-rnote
          chmod 0755 artifacts/canvas-host/publish/cakeos-canvas-rnote

      - name: Build genuine Canvas .deb
        env:
          CAKEOS_CANVAS_VERSION: 0.1.0+canvas.${{ github.run_number }}
          SOURCE_DATE_EPOCH: 0
        run: |
          bash "9to1 OS/packaging/canvas-rnote/build-deb.sh"
          package="artifacts/packages/cakeos-canvas-rnote_0.1.0+canvas.${GITHUB_RUN_NUMBER}_amd64.deb"
          dpkg-deb --info "$package" | tee artifacts/packages/package-metadata.txt
          dpkg-deb --contents "$package" | tee artifacts/packages/package-files.txt
          sha256sum "$package" | tee artifacts/packages/package.sha256

      - name: Install and smoke-test Canvas package
        run: |
          package=$(find artifacts/packages -maxdepth 1 -type f -name 'cakeos-canvas-rnote_*.deb' -print -quit)
          test -n "$package"
          package_name=$(dpkg-deb --field "$package" Package)
          sudo apt-get install -y "./$package"
          test -x /usr/bin/cakeos-canvas-rnote
          dpkg-query -W -f='${Status}\n' "$package_name" | grep -q 'install ok installed'
          set +e
          xvfb-run -a timeout 5s env CAKEOS_HUI_CANVAS_PREVIEW=1 CAKEOS_HUI_PREVIEW_AUTO_EXIT_MS=1000 \
            cakeos-canvas-rnote > artifacts/packages/runtime.log 2>&1
          status=$?
          set -e
          test "$status" = 0 -o "$status" = 1 -o "$status" = 124

      - name: Upload Canvas package and metadata
        uses: actions/upload-artifact@v4
        with:
          name: cakeos-canvas-rnote-debian-${{ github.run_number }}
          path: artifacts/packages/
          if-no-files-found: error