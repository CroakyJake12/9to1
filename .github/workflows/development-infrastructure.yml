name: Development infrastructure invariants

on:
  pull_request:
    paths:
      - 'eng/development/**'
      - 'eng/release-delivery/**'
      - 'eng/donor-sources.json'
      - '.gitmodules'
      - '.github/scripts/record-donor-audit-baselines.py'
      - 'eng/cui-mirror/**'
      - '9to1 Workspace/*/CUI/DonorMirror/**'
      - 'framework/CUI/**'
      - 'docs/specification/9to1-development-specification-v2.md'
      - '9to1 Workspace/Home/Source/Dulche/llamacpp/benchmark.py'
      - '9to1 Workspace/Home/Source/Dulche/llamacpp/tests/test_benchmark.py'
      - 'AGENTS.md'
      - 'docs/development/**'
      - '.github/workflows/development-infrastructure.yml'
      - '.github/workflows/havenos-linux-package.yml'
      - '.github/workflows/canvas-rnote-poc.yml'
  push:
    paths:
      - 'eng/development/**'
      - 'eng/release-delivery/**'
      - 'eng/donor-sources.json'
      - '.gitmodules'
      - '.github/scripts/record-donor-audit-baselines.py'
      - 'eng/cui-mirror/**'
      - '9to1 Workspace/*/CUI/DonorMirror/**'
      - 'framework/CUI/**'
      - 'docs/specification/9to1-development-specification-v2.md'
      - '9to1 Workspace/Home/Source/Dulche/llamacpp/benchmark.py'
      - '9to1 Workspace/Home/Source/Dulche/llamacpp/tests/test_benchmark.py'
      - 'AGENTS.md'
      - 'docs/development/**'
      - '.github/workflows/development-infrastructure.yml'
      - '.github/workflows/havenos-linux-package.yml'
      - '.github/workflows/canvas-rnote-poc.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  workflow-invariants:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2, verified upstream 2026-10-22
      - name: Validate operational guards using actual filesystem and concurrent processes
        run: |
          mkdir -p "$RUNNER_TEMP/infrastructure-evidence"
          python3 - <<'PY'
          import json, os, pathlib, subprocess, time
          evidence = pathlib.Path(os.environ['RUNNER_TEMP']) / 'infrastructure-evidence'
          command = ['python3', '-B', '-m', 'unittest', 'discover', '-s', 'eng/development', '-p', 'test_workflow.py', '-v']
          started = time.monotonic()
          with (evidence / 'invariants.log').open('wb') as log:
              result = subprocess.run(command, stdout=log, stderr=subprocess.STDOUT)
          receipt = {'command': command, 'exit_code': result.returncode, 'duration_seconds': time.monotonic() - started,
                     'scope': 'Infrastructure invariants only; no product/native acceptance claim.'}
          (evidence / 'receipt.json').write_text(json.dumps(receipt, indent=2) + '\n')
          print((evidence / 'invariants.log').read_text())
          raise SystemExit(result.returncode)
          PY
      - name: Validate installer custody and all ARM publication guards
        if: always()
        run: |
          python3 - <<'PY'
          import json, os, pathlib, subprocess, time
          evidence = pathlib.Path(os.environ['RUNNER_TEMP']) / 'infrastructure-evidence'
          evidence.mkdir(parents=True, exist_ok=True)
          command = ['python3', '-B', '-m', 'unittest', 'discover', '-s', 'eng/release-delivery', '-p', 'test_installer_delivery.py', '-v']
          started = time.monotonic()
          with (evidence / 'installer-delivery.log').open('wb') as log:
              result = subprocess.run(command, stdout=log, stderr=subprocess.STDOUT)
          receipt = {'command': command, 'exit_code': result.returncode, 'duration_seconds': time.monotonic() - started,
                     'scope': 'Delivery protocol and CI guard fixtures only; no provider upload, native acceptance or laptop delivery.'}
          (evidence / 'installer-delivery-receipt.json').write_text(json.dumps(receipt, indent=2) + '\n')
          print((evidence / 'installer-delivery.log').read_text())
          raise SystemExit(result.returncode)
          PY
      - name: Validate committed identity, closed-index recovery and benchmark streams
        if: always()
        run: |
          python3 - <<'PY'
          import json, os, pathlib, re, subprocess, time
          evidence = pathlib.Path(os.environ['RUNNER_TEMP']) / 'infrastructure-evidence'
          evidence.mkdir(parents=True, exist_ok=True)
          suites = [
              ('native-source-identity', 17, ['python3', '-B', '-m', 'unittest', 'discover', '-s', 'eng/development', '-p', 'test_native_source_identity.py', '-v']),
              ('closed-root-index', 36, ['python3', '-B', '-m', 'unittest', 'discover', '-s', 'eng/development', '-p', 'test_closed_root_index.py', '-v']),
              ('benchmark-streams', 22, ['python3', '-B', '-m', 'unittest', 'discover', '-s', '9to1 Workspace/Home/Source/Dulche/llamacpp/tests', '-p', 'test_benchmark.py', '-v']),
              ('donor-policy-census', 18, ['python3', '-B', '-m', 'unittest', 'discover', '-s', 'eng/development', '-p', 'test_donor_policy.py', '-v']),
              ('donor-coverage-audit', 11, ['python3', '-B', '-m', 'unittest', 'discover', '-s', 'eng/development', '-p', 'test_donor_coverage.py', '-v']),
              ('donor-pin-resolution', 25, ['python3', '-B', '-m', 'unittest', 'discover', '-s', 'eng/development', '-p', 'test_check_donor_sources.py', '-v']),
              ('donor-fork-equivalence', 6, ['python3', '-B', '-m', 'unittest', 'discover', '-s', 'eng/development', '-p', 'test_donor_fork_equivalence.py', '-v']),
              ('donor-audit-ratchet', 6, ['python3', '-B', '-m', 'unittest', 'discover', '-s', 'eng/development', '-p', 'test_record_donor_audit_baselines.py', '-v']),
              ('cui-donor-mirror', 58, ['python3', '-B', '-m', 'unittest', 'discover', '-s', 'eng/cui-mirror', '-p', 'test_*.py', '-v']),
              ('cui-framework-test-ratchet', 8, ['python3', '-B', '-m', 'unittest', 'discover', '-s', 'eng/development', '-p', 'test_cui_test_ratchet.py', '-v']),
          ]
          failed = False
          for name, expected_tests, command in suites:
              started = time.monotonic()
              log_path = evidence / (name + '.log')
              with log_path.open('wb') as log:
                  result = subprocess.run(command, stdout=log, stderr=subprocess.STDOUT)
              raw = log_path.read_bytes()
              match = re.search(rb'(?m)^Ran (\d+) tests? in [0-9.]+s$', raw)
              tests_run = int(match.group(1)) if match else None
              skip_match = re.search(rb'\bskipped=(\d+)\b', raw)
              skipped = int(skip_match.group(1)) if skip_match else 0
              verified = result.returncode == 0 and tests_run == expected_tests and skipped == 0
              receipt = {'command': command, 'exit_code': result.returncode,
                         'duration_seconds': time.monotonic() - started,
                         'expected_tests': expected_tests, 'tests_run': tests_run, 'skipped': skipped,
                         'verified': verified,
                         'scope': 'Committed identity/closed-index Git fixtures and mocked benchmark streams only; no model, SDK, native or product acceptance.'}
              (evidence / (name + '-receipt.json')).write_text(json.dumps(receipt, indent=2) + '\n')
              print(raw.decode('utf-8', errors='replace'))
              if not verified:
                  print(f'{name}: expected {expected_tests} tests, zero skips and exit 0; actual tests={tests_run}, skipped={skipped}, exit={result.returncode}')
                  failed = True
          raise SystemExit(1 if failed else 0)
          PY
      - name: Hold the donor audits at their recorded ratchet
        if: always()
        run: python3 -B .github/scripts/record-donor-audit-baselines.py check
      - name: Record exact infrastructure inputs
        if: always()
        run: |
          python3 - <<'PY'
          import hashlib, json, pathlib, platform, subprocess
          files = {p for root in ('eng/development', 'eng/release-delivery', 'docs/development')
                   for p in pathlib.Path(root).rglob('*') if p.is_file()}
          files.update(pathlib.Path(p) for p in ('AGENTS.md', '.github/workflows/development-infrastructure.yml',
                                                '.github/workflows/havenos-linux-package.yml', '.github/workflows/canvas-rnote-poc.yml',
                                                '9to1 Workspace/Home/Source/Dulche/llamacpp/benchmark.py',
                                                '9to1 Workspace/Home/Source/Dulche/llamacpp/tests/test_benchmark.py'))
          result = {
              'revision': subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip(),
              'python': platform.python_version(),
              'git_version': subprocess.check_output(['git', '--version'], text=True).strip(),
              'platform': platform.platform(),
              'files': {str(p): hashlib.sha256(p.read_bytes()).hexdigest() for p in sorted(files)},
              'scope': 'Infrastructure invariants only; native/product/release acceptance remains separate.'
          }
          evidence = pathlib.Path(__import__('os').environ['RUNNER_TEMP']) / 'infrastructure-evidence'
          evidence.mkdir(exist_ok=True)
          (evidence / 'inputs.json').write_text(json.dumps(result, indent=2) + '\n')
          with open(__import__('os').environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
              summary.write('### Development infrastructure\n\nExact inputs:\n```json\n' + json.dumps(result, indent=2) + '\n```\n')
          PY
      - name: Retain actual failure logs and source identities
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2, verified upstream 2026-10-22
        with:
          name: development-infrastructure-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/infrastructure-evidence/
          if-no-files-found: error
          retention-days: 14

  # The CUI test projects are not part of Haven.sln and were not run by any workflow, which is how the
  # runtime suite stayed red-ish unnoticed. This job runs all five CUI test projects and enforces the
  # recorded failure baseline: a new failure, a vanished test count, or a suite that cannot run is a breach.
  # It is compile/test evidence only - no rendering, no native run, no packaging, no acceptance.
  cui-framework-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2, verified upstream 2026-10-22
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: '10.0.301'
      - name: Run every CUI test project against the recorded failure baseline
        run: python3 -B eng/development/cui_test_ratchet.py check
      - name: Retain the actual per-suite outcome
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/cui-framework-evidence"
          python3 -B - <<'PY'
          import json, os, pathlib, subprocess, sys
          sys.path.insert(0, "eng/development")
          import cui_test_ratchet as ratchet
          rows = []
          for project in ratchet.PROJECTS:
              done = subprocess.run(["dotnet", "test", project, "-c", "Debug", "--nologo",
                                     "--no-build", "--disable-build-servers"],
                                    capture_output=True, text=True)
              text = (done.stdout or "") + (done.stderr or "")
              match = ratchet.SUMMARY.search(text)
              rows.append({"project": project,
                           "summary": match.group(0) if match else "no summary (rebuild required)"})
          out = pathlib.Path(os.environ["RUNNER_TEMP"]) / "cui-framework-evidence" / "suites.json"
          out.parent.mkdir(parents=True, exist_ok=True)
          out.write_text(json.dumps({"source": subprocess.run(["git", "rev-parse", "HEAD"],
                                     capture_output=True, text=True).stdout.strip(), "suites": rows},
                                     indent=2) + "\n")
          print(json.dumps(rows, indent=2))
          PY
        env:
          RUNNER_TEMP: ${{ runner.temp }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886067c06451c # v4
        if: always()
        with:
          name: cui-framework-test-suites
          path: ${{ runner.temp }}/cui-framework-evidence/

  # Stage A donor-UI mirrors are committed CUI. They are compiled by the real CUI compiler here, so a
  # mirror that stops compiling cannot be merged quietly. Compile evidence only: nothing in this job
  # renders, runs natively, packages or accepts anything.
  mirror-corpus-compile:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2, verified upstream 2026-10-22
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: '10.0.301'
      - name: Compile every committed donor mirror against the CUI compiler
        run: python3 -B eng/cui-mirror/check_corpora.py
      - name: Record the corpus and mirror-tool identity
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/mirror-evidence"
          python3 -B - <<'PY'
          import hashlib, json, os, pathlib, subprocess, sys
          sys.path.insert(0, "eng/cui-mirror")
          import mirror
          data = {
              "mirror_tool_version": mirror.tool_version(),
              "baseline": json.loads(pathlib.Path("eng/cui-mirror/mirror_baselines.json").read_text()),
              "source": subprocess.run(["git", "rev-parse", "HEAD"], capture_output=True,
                                       text=True).stdout.strip(),
              "cui_registry_source_sha256": hashlib.sha256(
                  pathlib.Path("framework/CUI/Runtime/CuiControlRegistry.cs").read_bytes()).hexdigest(),
          }
          out = pathlib.Path(os.environ["RUNNER_TEMP"]) / "mirror-evidence" / "corpus-identity.json"
          out.parent.mkdir(parents=True, exist_ok=True)
          out.write_text(json.dumps(data, indent=2) + "\\n")
          print(json.dumps(data["baseline"], indent=2))
          PY
        env:
          RUNNER_TEMP: ${{ runner.temp }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886067c06451c # v4
        if: always()
        with:
          name: cui-mirror-corpus-identity
          path: ${{ runner.temp }}/mirror-evidence/
