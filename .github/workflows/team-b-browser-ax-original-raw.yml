name: Team B original caa AX13 failure evidence only

on:
  push:
    branches: [custody/team-b-browser-ax-caa6712-original-raw-20261005]
    paths:
      - .github/workflows/team-b-browser-ax-original-raw.yml
      - apps/Web/Tests/ci/export-existing-browser-ax-original-raw.py
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  original-failure-custody:
    if: github.ref == 'refs/heads/custody/team-b-browser-ax-caa6712-original-raw-20261005' && github.repository == 'CroakyJake12/9to1'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Verify whole failed original and four exact raw evidence files
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          python3 apps/Web/Tests/ci/export-existing-browser-ax-original-raw.py
          --output "$RUNNER_TEMP/team-b-ax-original-raw"
      - name: Preserve original failure evidence or honest custody refusal
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: team-b-ax-original-raw-${{ github.sha }}
          path: ${{ runner.temp }}/team-b-ax-original-raw/diagnostics
          if-no-files-found: warn
          retention-days: 7
