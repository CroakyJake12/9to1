name: Cards isolated domain validation

on:
  push:
    branches:
      - chatgpt/cards-canonical-core-20261008
    paths:
      - '9to1 Workspace/Cards/**'
      - '.github/workflows/cards-domain-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cards-domain-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-cards:
    name: Cards ${{ matrix.configuration }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        configuration: [Debug, Release]
    steps:
      - name: Checkout immutable candidate
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.401'

      - name: Restore Cards test graph
        run: dotnet restore "9to1 Workspace/Cards/Tests/HavenOS.Cards.Tests.csproj" --nologo

      - name: Run owning Cards tests
        run: |
          dotnet test "9to1 Workspace/Cards/Tests/HavenOS.Cards.Tests.csproj" \
            -c "${{ matrix.configuration }}" --no-restore \
            --nologo --logger "trx;LogFileName=Cards-${{ matrix.configuration }}.trx"

      - name: Retain available test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cards-${{ matrix.configuration }}-${{ github.sha }}
          if-no-files-found: warn
          path: |
            9to1 Workspace/Cards/Tests/TestResults/**/*.trx
          retention-days: 14

  test-home-bridge:
    # Run explicitly after the shared Application declaration blocker is repaired.
    # Preserve its historical red CI receipt; do not waste every source-only push.
    if: github.event_name == 'workflow_dispatch'
    name: Cards shared Home engine bridge
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout candidate
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.401'

      - name: Restore actual Home dependency graph
        run: dotnet restore "9to1 Workspace/Cards/HomeIntegration/Tests/HavenOS.Cards.HomeIntegration.Tests.csproj" --nologo

      - name: Build and execute shared engine bridge tests
        run: |
          dotnet test "9to1 Workspace/Cards/HomeIntegration/Tests/HavenOS.Cards.HomeIntegration.Tests.csproj" \
            -c Release --no-restore --nologo \
            --logger "trx;LogFileName=Cards-HomeIntegration-Release.trx"

      - name: Retain bridge test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cards-home-engine-${{ github.sha }}
          if-no-files-found: warn
          path: |
            9to1 Workspace/Cards/HomeIntegration/Tests/TestResults/**/*.trx
          retention-days: 14

  test-cui-scene:
    # The vendored Avalonia Build.Tasks graph currently cannot compile XamlX.
    # Run the complete CUI suite explicitly on a repaired integration baseline.
    if: github.event_name == 'workflow_dispatch'
    name: Cards authored CUI interactions
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.401'

      - name: Restore actual CUI runtime dependencies
        run: dotnet restore "9to1 Workspace/Cards/CUI/Tests/HavenOS.Cards.CUI.Tests.csproj" --nologo

      - name: Run CUI source and action workflow checks
        run: |
          dotnet test "9to1 Workspace/Cards/CUI/Tests/HavenOS.Cards.CUI.Tests.csproj" \
            -c Release --no-restore --nologo \
            --logger "trx;LogFileName=Cards-CUI-Release.trx"

      - name: Preserve CUI test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cards-cui-${{ github.sha }}
          if-no-files-found: warn
          path: |
            9to1 Workspace/Cards/CUI/Tests/TestResults/**/*.trx
          retention-days: 14

  test-cui-language:
    name: Cards CUI parser-only contract
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact Cards branch
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.401'

      - name: Restore canonical Core and Language graph
        run: dotnet restore "9to1 Workspace/Cards/CUI/MarkupTests/HavenOS.Cards.CUI.MarkupTests.csproj" --nologo

      - name: Test Cards authored markup with the real parser
        run: |
          dotnet test "9to1 Workspace/Cards/CUI/MarkupTests/HavenOS.Cards.CUI.MarkupTests.csproj" \
            -c Release --no-restore --nologo \
            --logger "trx;LogFileName=Cards-CUI-Markup-Release.trx"

      - name: Preserve parser check evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cards-cui-parser-${{ github.sha }}
          if-no-files-found: warn
          path: |
            9to1 Workspace/Cards/CUI/MarkupTests/TestResults/**/*.trx
          retention-days: 14
