name: Astra Android29 frozen branch validation
on:
  workflow_dispatch:
    inputs:
      expected_commit:
        description: Exact reviewed validation commit (40 hex)
        required: true
        type: string
      expected_manifest_sha256:
        description: Exact reviewed frozen91 manifest SHA256
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: astra-android29-validation-${{ github.ref }}
  cancel-in-progress: false
env:
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'
  DOTNET_CLI_USE_MSBUILD_SERVER: '0'
  MSBUILDDISABLENODEREUSE: '1'
  AVALONIA_TELEMETRY_OPTOUT: '1'
  EXPECTED_COMMIT: ${{ inputs.expected_commit }}
  EXPECTED_MANIFEST_SHA256: ${{ inputs.expected_manifest_sha256 }}
jobs:
  android:
    if: startsWith(github.ref, 'refs/heads/validation/astra-android29-frozen91-')
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify exact source cut before preparation
        run: python3 .github/scripts/astra-android29-verify.py source
      - name: Prepare existing pinned CUI source
        run: bash "9to1 Workspace/shared/eng/prepare-cui-source.sh"
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - name: Resolve hosted Android workload and retain toolchain evidence
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/logs
          dotnet --info | tee artifacts/logs/dotnet-info-before.txt
          dotnet workload install android --skip-manifest-update --disable-parallel 2>&1 | tee artifacts/logs/workload-install.txt
          dotnet --info > artifacts/logs/dotnet-info-after.txt
          dotnet workload list > artifacts/logs/workloads.txt
          java -version 2> artifacts/logs/java.txt
          sdkmanager_path="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          test -x "$sdkmanager_path" || { echo "Missing exact hosted SDK manager: $sdkmanager_path" >&2; exit 127; }
          printf '%s\n' "$sdkmanager_path" > artifacts/logs/android-sdkmanager-path.txt
          "$sdkmanager_path" --list_installed > artifacts/logs/android-sdk.txt
          git submodule status > artifacts/logs/submodules.txt
      - name: Ephemeral debug certificate only
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          keytool -genkeypair -keystore "$RUNNER_TEMP/android29-debug.keystore" -storepass android -keypass android -alias androiddebugkey -dname 'CN=Android Debug,O=Android,C=US' -keyalg RSA -keysize 2048 -validity 7
          keytool -exportcert -keystore "$RUNNER_TEMP/android29-debug.keystore" -storepass android -alias androiddebugkey -file "$RUNNER_TEMP/android29-cert.der"
      - name: Release Android restore build and APK publish
        shell: bash
        run: |
          set -euo pipefail
          project='9-1 OS (Android)/src/Haven.Android/Haven.Android.csproj'
          common=(--disable-build-servers -m:1 -nr:false -p:UseSharedCompilation=false -p:Configuration=Release)
          sign=(-p:AndroidKeyStore=true "-p:AndroidSigningKeyStore=$RUNNER_TEMP/android29-debug.keystore" -p:AndroidSigningKeyAlias=androiddebugkey -p:AndroidSigningKeyPass=android -p:AndroidSigningStorePass=android)
          dotnet restore "$project" "${common[@]}" 2>&1 | tee artifacts/logs/restore.txt
          dotnet build "$project" -c Release -f net10.0-android --no-restore "${common[@]}" "${sign[@]}" 2>&1 | tee artifacts/logs/build.txt
          dotnet publish "$project" -c Release -f net10.0-android --no-restore "${common[@]}" "${sign[@]}" -p:AndroidPackageFormat=apk 2>&1 | tee artifacts/logs/publish.txt
          dotnet msbuild "$project" -nologo -m:1 -nr:false -p:UseSharedCompilation=false -p:Configuration=Release -p:TargetFramework=net10.0-android -getProperty:RuntimeIdentifiers,RuntimeIdentifier,AndroidTargetSdkVersion,TargetFramework,ApplicationVersion,ApplicationDisplayVersion > artifacts/logs/evaluated-mobile-properties.json
      - name: Verify universal signed APK and bind receipt
        run: python3 .github/scripts/astra-android29-verify.py apk
      - uses: actions/upload-artifact@v7
        with:
          name: Astra-Android29-APK-${{ github.sha }}
          path: artifacts/apk/
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: Astra-Android29-build-evidence-${{ github.sha }}
          path: artifacts/logs/
  android-smoke:
    needs: android
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          name: Astra-Android29-APK-${{ github.sha }}
          path: artifacts/apk/
      - name: Enable hosted KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Verify downloaded receipt before install and run existing LAUNCHER startup smoke
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front none -no-snapshot-save
          script: |
            python3 .github/scripts/astra-android29-verify.py download
            mkdir -p artifacts/android
            cp artifacts/apk/android29-frozen91-Signed.apk artifacts/android/android29-frozen91-Signed.apk
            cmp artifacts/apk/android29-frozen91-Signed.apk artifacts/android/android29-frozen91-Signed.apk
            sh .github/scripts/haven-android-smoke.sh
            adb shell run-as com.cakemods.haven id > artifacts/smoke/run-as-status.txt 2>&1 && echo available > artifacts/smoke/run-as-availability.txt || echo unavailable > artifacts/smoke/run-as-availability.txt
      - name: Record limited acceptance and private log collection status
        if: always()
        shell: bash
        run: |
          mkdir -p artifacts/smoke
          printf '%s\n' 'LAUNCHER startup only: AndroidBootstrapActivity -> MainActivity; not HOME/Launcher readiness, widgets, inference, physical device or production authority acceptance.' > artifacts/smoke/acceptance-limits.txt
          test -f artifacts/smoke/run-as-availability.txt || echo not-attempted-smoke-did-not-complete > artifacts/smoke/run-as-availability.txt
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: Astra-Android29-startup-evidence-${{ github.sha }}
          path: artifacts/smoke/
