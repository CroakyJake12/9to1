name: Astra Android08 existing APK normalized startup validation
on:
  workflow_dispatch:
    inputs:
      expected_commit:
        description: Exact reviewed metadata-only validation commit
        required: true
        type: string
      expected_manifest_sha256:
        description: Exact external metadata/provenance manifest SHA256
        required: true
        type: string
permissions:
  contents: read
  actions: read
concurrency:
  group: astra-android08-smoke-reuse-${{ github.ref }}
  cancel-in-progress: false
env:
  EXPECTED_COMMIT: ${{ inputs.expected_commit }}
  EXPECTED_MANIFEST_SHA256: ${{ inputs.expected_manifest_sha256 }}
  AVALONIA_TELEMETRY_OPTOUT: '1'
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'
  DOTNET_CLI_USE_MSBUILD_SERVER: '0'
jobs:
  android-smoke:
    if: startsWith(github.ref, 'refs/heads/validation/astra-android29-frozen91-')
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          submodules: false
          persist-credentials: false
      - name: Pin and download ONLY existing build08 source and APK artifact
        env:
          GH_ARTIFACT_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/astra-android08-reuse.py
      - name: Enable hosted KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Verify original APK before EACH install and observe normalized closure
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        env:
          ASTRA_ANDROID_BUILD_SOURCE_ROOT: ${{ runner.temp }}/build08-source
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front none -no-snapshot-save
          script: python3 .github/scripts/astra-android32-two-launch.py
      - name: Preserve distinct startup and original-input receipts including failure
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: Astra-Android08-normalized-startup-${{ github.sha }}-${{ github.run_id }}
          path: |
            artifacts/android-launches/
            artifacts/reuse-input/
            !artifacts/reuse-input/original-apk-artifact.zip
            !artifacts/android-launches/**/artifacts/android/*.apk
          if-no-files-found: error
