name: Validate historical beta chat orchestration

# Historical patch scripts run only in this disposable checkout. Review the
# resulting source.patch through the normal integration process; no branch writes.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apply:
    if: ${{ github.event_name == 'workflow_dispatch' }}
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Prepare report folder
        if: always()
        shell: pwsh
        run: New-Item -ItemType Directory -Force artifacts/beta-chat | Out-Null

      - name: Repair exact historical anchors
        id: repair
        if: always()
        continue-on-error: true
        shell: pwsh
        run: |
          Start-Transcript -Path artifacts/beta-chat/REPAIR.log
          $tracker = "9to1 Workspace/shared/src/Haven.Application/Chat/ChatExecutionTracker.cs"
          $text = Get-Content $tracker -Raw
          $text = $text.Replace('return ValueTask.CompletedTask;', 'return default;')
          Set-Content $tracker $text -Encoding utf8

          $cache = "9to1 Workspace/shared/src/Haven.Application/Provider/ModelInventoryCache.cs"
          $text = Get-Content $cache -Raw
          $text = $text.Replace('!ReferenceEquals.Equals(_current, tracker)', '!ReferenceEquals(_current, tracker)')
          $text = $text.Replace('_current.Changed -= OnTrackerChanged;', '_current!.Changed -= OnTrackerChanged;')
          Set-Content $cache $text -Encoding utf8

          $patch = "9to1 Workspace/shared/scripts/apply_beta_chat_patch.py"
          $text = Get-Content $patch -Raw
          $text = $text.Replace(
            '    private static WorkspaceToolResult UnavailableToolResult(',
            '    private ToolAvailabilityPlan CreateAvailabilityPlan(')
          Set-Content $patch $text -Encoding utf8
          Stop-Transcript

      - name: Apply historical patch
        id: patch
        if: always()
        continue-on-error: true
        shell: pwsh
        run: |
          python "9to1 Workspace/shared/scripts/apply_beta_chat_patch.py" 2>&1 |
            Tee-Object artifacts/beta-chat/PATCH.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Restore
        id: restore
        if: always()
        continue-on-error: true
        shell: pwsh
        run: |
          dotnet restore "9to1 Workspace/shared/Haven.sln" 2>&1 |
            Tee-Object artifacts/beta-chat/RESTORE.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build
        id: build
        if: always()
        continue-on-error: true
        shell: pwsh
        run: |
          dotnet build "9to1 Workspace/shared/Haven.sln" -c Release --no-restore 2>&1 |
            Tee-Object artifacts/beta-chat/BUILD.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Test
        id: test
        if: always()
        continue-on-error: true
        shell: pwsh
        run: |
          dotnet test "9to1 Workspace/shared/Haven.sln" -c Release --no-build --logger trx --results-directory "artifacts/beta-chat/TestResults" 2>&1 |
            Tee-Object artifacts/beta-chat/TEST.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Write validation report
        if: always()
        shell: pwsh
        run: |
          @(
            '# Historical patch validation',
            '',
            '| Stage | Result |',
            '|---|---|',
            '| Repair | ${{ steps.repair.outcome }} |',
            '| Patch | ${{ steps.patch.outcome }} |',
            '| Restore | ${{ steps.restore.outcome }} |',
            '| Build | ${{ steps.build.outcome }} |',
            '| Test | ${{ steps.test.outcome }} |',
            '',
            'Classify failures from retained logs/TRX as INFRASTRUCTURE, TEST or PRODUCT; leave unresolved outcomes UNTRIAGED.',
            'Successful stages record process results, not product, native or release acceptance.',
            'Review source.patch against SOURCE.json before proposing changes through normal independent review.'
          ) | Set-Content artifacts/beta-chat/VALIDATION.md

      - name: Record reviewable source patch
        if: always()
        shell: pwsh
        run: |
          git rev-parse HEAD | Set-Content artifacts/beta-chat/source.sha
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $checkoutSha = (Get-Content artifacts/beta-chat/source.sha -Raw).Trim()
          if ($checkoutSha -ne '${{ github.sha }}') { throw 'Checkout identity differs from dispatched commit' }
          git add --intent-to-add -- "9to1 Workspace/shared/src" "9to1 Workspace/shared/tests" "9to1 Workspace/shared/scripts"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git diff --binary --output=artifacts/beta-chat/source.patch HEAD -- "9to1 Workspace/shared/src" "9to1 Workspace/shared/tests" "9to1 Workspace/shared/scripts"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          @{
            repository = '${{ github.repository }}'
            dispatched_sha = '${{ github.sha }}'
            checkout_sha = $checkoutSha
            run_id = '${{ github.run_id }}'
            run_attempt = '${{ github.run_attempt }}'
            patch_sha256 = (Get-FileHash artifacts/beta-chat/source.patch -Algorithm SHA256).Hash.ToLowerInvariant()
            scope = 'Manual patch validation; independent review required before integration. No native or release acceptance.'
          } | ConvertTo-Json | Set-Content artifacts/beta-chat/SOURCE.json

      - name: Retain patch, reports and actual validation logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: beta-chat-validation-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/beta-chat/
          if-no-files-found: error
          retention-days: 14

      - name: Fail when validation incomplete
        if: always()
        shell: pwsh
        run: |
          $outcomes = @(
            '${{ steps.repair.outcome }}',
            '${{ steps.patch.outcome }}',
            '${{ steps.restore.outcome }}',
            '${{ steps.build.outcome }}',
            '${{ steps.test.outcome }}'
          )
          $incomplete = @($outcomes | Where-Object { $_ -ne 'success' })
          if ($incomplete.Count -gt 0) { exit 1 }
