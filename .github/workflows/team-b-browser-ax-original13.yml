name: Team B unchanged caa6712 original AX unit regression

on:
  push:
    branches: [custody/team-b-browser-ax-caa6712-original-unit-20261005]
    paths:
      - .github/workflows/team-b-browser-ax-original13.yml
      - apps/Web/Tests/ci/run-browser-ax-original13.py
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unchanged-original13:
    if: github.ref == 'refs/heads/custody/team-b-browser-ax-caa6712-original-unit-20261005' && github.repository == 'CroakyJake12/9to1'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22.14.0"
      - name: Run existing unmodified mock AX unit fixture
        run: >-
          python3 apps/Web/Tests/ci/run-browser-ax-original13.py
          --expected-commit '${{ github.sha }}'
          --output "$RUNNER_TEMP/team-b-ax-original13"
      - name: Preserve raw original failure or complete result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: team-b-ax-original13-${{ github.sha }}
          path: ${{ runner.temp }}/team-b-ax-original13/diagnostics
          if-no-files-found: warn
          retention-days: 7
