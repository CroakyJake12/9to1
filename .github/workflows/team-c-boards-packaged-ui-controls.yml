name: Team C immutable Boards native rich-history controls (unaccepted)

on:
  push:
    branches: [team-c/sol-happy-c3-boards-rich-history-20261004]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: boards-rich-history-${{ github.ref }}
  cancel-in-progress: false

jobs:
  packaged-ui:
    runs-on: windows-2022
    timeout-minutes: 10
    env:
      GIT_OPTIONAL_LOCKS: '0'
    steps:
      - name: Preserve exact reviewed source bytes
        shell: powershell
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify immutable original run and artifact metadata
        shell: powershell
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ErrorActionPreference = 'Stop'
          $c = Get-Content -Raw .github/validation/boards-packaged-ui-controls.json | ConvertFrom-Json
          if ($env:GITHUB_REPOSITORY -cne $c.repository) { throw 'Wrong repository.' }
          $headers = @{ Authorization = "Bearer $env:GITHUB_TOKEN"; Accept = 'application/vnd.github+json'; 'X-GitHub-Api-Version' = '2022-11-28' }
          $base = "https://api.github.com/repos/$($c.repository)/actions"
          $run = Invoke-RestMethod -Headers $headers -Uri "$base/runs/$($c.producerRunId)"
          if ($run.head_sha -cne $c.sourceBasis) { throw 'Producer run source mismatch.' }
          foreach ($expected in $c.artifacts) {
            $a = Invoke-RestMethod -Headers $headers -Uri "$base/artifacts/$($expected.id)"
            if ($a.id -ne $expected.id -or $a.name -cne $expected.name -or $a.size_in_bytes -ne $expected.bytes -or $a.digest -cne $expected.digest -or $a.expired -or $a.workflow_run.id -ne $c.producerRunId -or $a.workflow_run.head_sha -cne $c.sourceBasis) { throw 'Immutable artifact metadata mismatch or expiry.' }
          }
      - name: Retrieve exact original package through the authorized artifact action
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: '37208129079'
          artifact-ids: '11305252552'
          path: ${{ runner.temp }}/boards-package-input
      - name: Retrieve exact original producer manifest and observations
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: '37208129079'
          artifact-ids: '11305292433'
          path: ${{ runner.temp }}/boards-observation-input
      - name: Observe actual packaged native rich formatting, Undo, Redo and reopen
        shell: powershell
        env:
          PROBE_OUTPUT: ${{ runner.temp }}/boards-rich-history-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          & .github/scripts/boards-packaged-ui-controls.ps1 -PackageInput '${{ runner.temp }}/boards-package-input' -ObservationInput '${{ runner.temp }}/boards-observation-input' -OutputDirectory $env:PROBE_OUTPUT -Scenario rich-history
          exit $LASTEXITCODE
      - name: Retain original observations and failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: boards-rich-history-unaccepted-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/boards-rich-history-${{ github.run_id }}-${{ github.run_attempt }}/result.json
            ${{ runner.temp }}/boards-rich-history-${{ github.run_id }}-${{ github.run_attempt }}/*.log
            ${{ runner.temp }}/boards-rich-history-${{ github.run_id }}-${{ github.run_attempt }}/*.png
          if-no-files-found: warn
          retention-days: 7
