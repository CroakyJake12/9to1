name: Canvas Rnote PoC

on:
  push:
    branches:
      - main
    paths:
      - "9to1 Workspace/Canvas/rnote-poc/**"
      - '.github/workflows/canvas-rnote-poc.yml'
  pull_request:
    paths:
      - "9to1 Workspace/Canvas/rnote-poc/**"
      - '.github/workflows/canvas-rnote-poc.yml'

jobs:
  headless-rnote:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check out the pinned Rnote source
        shell: bash
        run: |
          set -euo pipefail
          git submodule update --init --depth=1 -- "9to1 Workspace/Canvas/Source/Rnote"
          expected="$(git ls-tree HEAD -- "9to1 Workspace/Canvas/Source/Rnote" | awk '{print $3}')"
          test "$(git -C "9to1 Workspace/Canvas/Source/Rnote" rev-parse HEAD)" = "$expected"
          test -f "9to1 Workspace/Canvas/Source/Rnote/crates/rnote-engine/Cargo.toml"

      - name: Install Rust 1.92
        uses: dtolnay/rust-toolchain@1.92.0

      - name: Install native core dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            cmake \
            pkg-config \
            libglib2.0-dev \
            libcairo2-dev \
            libpango1.0-dev \
            librsvg2-dev

      - name: Generate lockfile
        run: cargo generate-lockfile --manifest-path "9to1 Workspace/Canvas/rnote-poc/Cargo.toml"

      - name: Reject GTK and Libadwaita in core dependency graph
        shell: bash
        run: |
          cargo tree --manifest-path "9to1 Workspace/Canvas/rnote-poc/Cargo.toml" | tee /tmp/canvas-rnote-tree.txt
          if grep -E '(^|[[:space:]])(gtk4|libadwaita)[[:space:]]' /tmp/canvas-rnote-tree.txt; then
            echo 'Headless Canvas core unexpectedly depends on GTK4 or Libadwaita.' >&2
            exit 1
          fi

      - name: Build native C ABI library
        shell: bash
        run: |
          cargo build --manifest-path "9to1 Workspace/Canvas/rnote-poc/Cargo.toml" --lib --verbose
          test -f "9to1 Workspace/Canvas/rnote-poc/target/debug/libcakeos_canvas_rnote_poc.so"

      - name: Test headless pressure/save/reload/export round trip
        shell: bash
        run: |
          set +e
          cargo test --manifest-path "9to1 Workspace/Canvas/rnote-poc/Cargo.toml" --all-targets --verbose -- --nocapture 2>&1 | tee /tmp/canvas-rnote-test.log
          status=${PIPESTATUS[0]}
          {
            echo '## Rnote boundary test diagnostics'
            echo '```text'
            tail -n 120 /tmp/canvas-rnote-test.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$status" -ne 0 ]; then
            failure_line="$(grep -E 'panicked at|assertion .* failed|assertion.*failed|error:' /tmp/canvas-rnote-test.log | tail -n 1 || true)"
            echo "::error title=Rnote boundary round-trip failed::${failure_line:-See job summary for cargo test output}"
          fi
          exit "$status"

      - name: Upload native bridge artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: canvas-rnote-native-bridge
          path: |
            9to1 Workspace/Canvas/rnote-poc/target/debug/libcakeos_canvas_rnote_poc.so
            9to1 Workspace/Canvas/rnote-poc/include/cakeos_canvas.h
          if-no-files-found: error

      - name: Upload boundary test diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: canvas-rnote-test-log
          path: |
            /tmp/canvas-rnote-test.log
            9to1 Workspace/Canvas/rnote-poc/Cargo.lock
          if-no-files-found: error
