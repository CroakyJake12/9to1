name: Book4 Edge compatibility preparation
on:
  workflow_dispatch:
    inputs:
      display_dtb:
        description: 'Prepare the separate GPU-enabled 16-inch display test DTB'
        type: boolean
        default: false
      controller_hpd:
        description: 'Use controller HPD to avoid the verified panel GPIO119 conflict'
        type: boolean
        default: false
  pull_request:
    paths:
      - '9to1 OS/compatibility/wine/**'
      - '9to1 OS/tooling/book4edge/**'
      - 'eng/9to1.ps1'
      - '.github/workflows/book4edge-compatibility.yml'
permissions:
  contents: read
  actions: read
jobs:
  package:
    strategy:
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
      - name: Validate compatibility and media selection
        shell: pwsh
        run: ./eng/9to1.ps1 verify -Component compatibility
      - name: Build architecture-independent desktop package
        shell: pwsh
        run: ./eng/9to1.ps1 package-linux -Component compatibility
      - name: Install desktop dependencies and check package
        run: |
          sudo apt-get update
          sudo apt-get install -y ./artifacts/packages/9to1-windows-compat_0.1.0_all.deb xvfb xdotool grub-common shellcheck device-tree-compiler
          9to1-compat capabilities
          python3 - <<'PY'
          import struct
          data = bytearray(88)
          data[:2] = b'MZ'
          struct.pack_into('<I', data, 60, 64)
          data[64:68] = b'PE\0\0'
          struct.pack_into('<H', data, 68, 0x8664)
          open('/tmp/chooser-fixture.exe', 'wb').write(data)
          PY
          9to1-open-exe --plan -- /tmp/chooser-fixture.exe
          xvfb-run -a bash -euc '
            9to1-open-exe -- /tmp/chooser-fixture.exe &
            chooser_pid=$!
            trap "kill $chooser_pid 2>/dev/null || true" EXIT
            timeout 15 xdotool search --sync --onlyvisible --name "Open Windows application"
          '
      - name: Validate live USB menu with GRUB's parser
        run: |
          python3 - <<'PY'
          import runpy
          from pathlib import Path
          recipe = runpy.run_path('9to1 OS/tooling/book4edge/assemble-live.py')
          for logging, display in ((False, False), (True, False), (True, True)):
              Path(f'artifacts/book4edge-grub-{logging}-{display}.cfg').write_text(recipe['grub_config'](logging, display), encoding='utf-8')
          PY
          for menu in artifacts/book4edge-grub-*.cfg; do grub-script-check "$menu"; done
          sh -n '9to1 OS/tooling/book4edge/boot-log.sh'
          shellcheck -S warning '9to1 OS/tooling/book4edge/boot-log.sh'
      - name: Retrieve the verified matching kernel DTB
        if: inputs.display_dtb && matrix.runner == 'ubuntu-24.04-arm'
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: 38726175861
          name: book4edge16-kernel-ed869653cd33078dfa92ed7e3057e1573504464a
          path: kernel-input
      - name: Prepare an isolated native display test
        if: inputs.display_dtb && matrix.runner == 'ubuntu-24.04-arm'
        env:
          CONTROLLER_HPD: ${{ inputs.controller_hpd }}
        run: |
          mkdir -p artifacts/display-test
          display_args=()
          if [ "$CONTROLLER_HPD" = true ]; then display_args+=(--controller-hpd); fi
          python3 '9to1 OS/tooling/book4edge/make-display-test.py' kernel-input/x1e80100-samsung-galaxy-book4-edge-16.dtb artifacts/display-test/book4edge16-gpu.dtb "${display_args[@]}"
          test "$(fdtget artifacts/display-test/book4edge16-gpu.dtb /sound status)" = disabled
          test "$(fdtget artifacts/display-test/book4edge16-gpu.dtb /soc@0/gpu@3d00000 status)" = okay
          if [ "$CONTROLLER_HPD" = true ]; then
            ! fdtget artifacts/display-test/book4edge16-gpu.dtb /soc@0/display-subsystem@ae00000/displayport-controller@aea0000/aux-bus/panel hpd-gpios
            test "$(fdtget artifacts/display-test/book4edge16-gpu.dtb /soc@0/pinctrl@f100000/edp0-hpd-default-state function)" = edp0_hot
          fi
      - uses: actions/upload-artifact@v4
        if: inputs.display_dtb && matrix.runner == 'ubuntu-24.04-arm'
        with:
          name: book4edge-display-test
          path: artifacts/display-test/
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: windows-compat-${{ matrix.runner }}
          path: artifacts/packages/*.deb
          if-no-files-found: error
