name: Original Planner SQLite concurrency

on:
  workflow_dispatch:
  push:
    branches: [team-b/astra-browser-validation-20261003]
    paths:
      - .github/workflows/team-b-original-planner.yml
      - apps/Web/Productivity/Planner/Tests/**

permissions:
  contents: read

jobs:
  original-planner:
    if: github.ref == 'refs/heads/team-b/astra-browser-validation-20261003'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out the selected branch commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Set up the reviewed SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.401'
      - name: Source-build and run the original SQLite Fact
        env:
          PLANNER_EXPECTED_COMMIT: ${{ github.sha }}
        run: >-
          python3 apps/Web/Productivity/Planner/Tests/ci/run-original-planner.py
          --expected-commit "$PLANNER_EXPECTED_COMMIT"
          --output "$RUNNER_TEMP/planner-original-sqlite"
      - name: Preserve bounded original evidence, including any first failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: original-planner-sqlite-${{ github.sha }}
          if-no-files-found: error
          path: |
            ${{ runner.temp }}/planner-original-sqlite/diagnostics/
            ${{ runner.temp }}/planner-original-sqlite/test-results/*.trx
          retention-days: 14
