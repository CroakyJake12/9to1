name: Original Write document formats

on:
  workflow_dispatch:
  push:
    branches: [team-b/astra-browser-validation-20261003]
    paths:
      - .github/workflows/team-b-original-write-formats.yml
      - apps/Web/Write/Tests/**
      - apps/Web/Write/Packages/**
      - apps/Web/Tests/ci/run-ordinary-native.py
      - 9to1 Workspace/shared/tests/Haven.Infrastructure.Tests/WriteDocxFidelityTests.cs
      - 9to1 Workspace/shared/tests/Haven.Infrastructure.Tests/WriteNativeDocumentPackageStoreTests.cs
      - 9to1 Workspace/shared/src/Haven.Infrastructure/Persistence/FileSystem/NotesImportExportService.cs
      - 9to1 Workspace/shared/src/Haven.Infrastructure/Persistence/FileSystem/NotesDocxFormatService.cs

permissions:
  contents: read

jobs:
  original-write-formats:
    if: github.ref == 'refs/heads/team-b/astra-browser-validation-20261003'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out the selected branch commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Set up the reviewed SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.401'
      - name: Source-build and run all seven unchanged original format Facts
        env:
          WRITE_EXPECTED_COMMIT: ${{ github.sha }}
        run: >-
          python3 apps/Web/Write/Tests/ci/run-original-write-formats.py
          --expected-commit "$WRITE_EXPECTED_COMMIT"
          --output "$RUNNER_TEMP/write-original-formats"
      - name: Preserve bounded original evidence, including any first failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: original-write-formats-${{ github.sha }}
          if-no-files-found: error
          path: |
            ${{ runner.temp }}/write-original-formats/diagnostics/
            ${{ runner.temp }}/write-original-formats/test-results/*.trx
          retention-days: 14
