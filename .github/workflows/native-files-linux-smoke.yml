# Source-only, non-deploying native x64 smoke. Never uploads private app packages,
# personal profiles, Drive credentials or generated application binaries.
name: Native Haven Files Linux x64 compile and window smoke
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/native-files-linux-smoke.yml'
permissions:
  contents: read
concurrency:
  # Serialize with the existing Files candidate's SDK-heavy CI workload.
  group: files-candidate-main
  cancel-in-progress: false
jobs:
  native-haven-files:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    env:
      DOTNET_NOLOGO: '1'
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_GENERATE_ASPNET_CERTIFICATE: 'false'
      MSBUILDDISABLENODEREUSE: '1'
      HAVEN_LINUX_RID: linux-x64
    steps:
      - name: Checkout immutable source without persistent authentication
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Install only the declared Avalonia fork gitlinks
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git submodule update --init --recursive --depth 1 -- \
            framework/CUI/vendor/Avalonia/external/XamlX \
            framework/CUI/vendor/Avalonia/external/Avalonia.DBus
      - name: Install repository-compatible official dotnet SDK
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: '10.0.401'
      - name: Check native window smoke runner using disposable fake apphosts
        shell: bash
        run: |
          set -euo pipefail
          dotnet --list-sdks
          selected_sdk="$(dotnet --version)"
          printf 'Repository-selected SDK: %s\n' "$selected_sdk"
          # global.json requests 10.0.301 with latestFeature; the runner may
          # select that installed band rather than installed 10.0.401.
          case "$selected_sdk" in
            10.0.301|10.0.401) ;;
            *) printf 'Unexpected .NET SDK: %s\n' "$selected_sdk" >&2; exit 1 ;;
          esac
          python3 -B -m unittest discover -s eng/development -p 'test_native_files_linux_smoke.py' -v
      - name: Publish the existing real Haven Desktop host for linux-x64 (no upload)
        shell: bash
        env:
          NUGET_PACKAGES: ${{ runner.temp }}/native-files-nuget
          HAVEN_ARTIFACTS_DIR: ${{ runner.temp }}/native-files-linux-candidate
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          bash '9to1 Workspace/shared/eng/publish-haven-linux.sh'
          test -x "$HAVEN_ARTIFACTS_DIR/publish/Haven"
          test -s "$HAVEN_ARTIFACTS_DIR/publish/Haven.dll"
          test -s "$HAVEN_ARTIFACTS_DIR/haven-linux-linux-x64.tar.gz"
          file "$HAVEN_ARTIFACTS_DIR/publish/Haven"
          sha256sum "$HAVEN_ARTIFACTS_DIR/haven-linux-linux-x64.tar.gz"
          printf 'Built source revision %s; native packaging only, NOT Drive acceptance.\n' "$GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
      - name: Install disposable headless X11 and window manager on CI runner
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends xvfb openbox x11-utils dbus-x11
      - name: Launch the actual published apphost in a clean private profile and observe its own X11 window
        shell: bash
        env:
          HAVEN_ARTIFACTS_DIR: ${{ runner.temp }}/native-files-linux-candidate
        run: |
          set -euo pipefail
          scratch="$RUNNER_TEMP/native-files-smoke"
          mkdir -m 700 "$scratch"
          export HAVEN_PUBLISHED="$HAVEN_ARTIFACTS_DIR/publish/Haven"
          export HAVEN_SMOKE_SCRATCH="$scratch"
          dbus-run-session -- xvfb-run -a -s '-screen 0 1280x900x24' bash -c '
            set -euo pipefail
            openbox >/dev/null 2>&1 &
            wm_pid=$!
            trap '\''kill "$wm_pid" 2>/dev/null || true'\'' EXIT
            python3 -B eng/development/native_files_linux_smoke.py \
              --executable "$HAVEN_PUBLISHED" \
              --scratch-parent "$HAVEN_SMOKE_SCRATCH" \
              --timeout-seconds 60 \
              --report "$HAVEN_SMOKE_SCRATCH/window-observation.json"
          '
          test -s "$scratch/window-observation.json"
          printf 'Native window observation only; Google OAuth, Drive listing and mutations NOT RUN.\n' >> "$GITHUB_STEP_SUMMARY"
