name: Validate historical beta patch

# Historical patch scripts run only in this disposable checkout. Review the
# resulting source.patch through the normal integration process; no branch writes.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  patch:
    if: ${{ github.event_name == 'workflow_dispatch' }}
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Prepare report folder
        if: always()
        shell: pwsh
        run: New-Item -ItemType Directory -Force artifacts/new-haven-beta | Out-Null

      - name: Apply historical patch
        id: patch
        if: always()
        continue-on-error: true
        shell: pwsh
        run: |
          $i=[IO.File]::OpenRead("9to1 Workspace/shared/scripts/apply_beta_chat_patch.py.gz")
          $g=[IO.Compression.GzipStream]::new($i,[IO.Compression.CompressionMode]::Decompress)
          $o=[IO.File]::Create("9to1 Workspace/shared/scripts/apply_beta_chat_patch.py")
          $g.CopyTo($o)
          $o.Dispose(); $g.Dispose(); $i.Dispose()
          python "9to1 Workspace/shared/scripts/apply_beta_chat_patch.py" 2>&1 |
            Tee-Object artifacts/new-haven-beta/PATCH.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Restore
        id: restore
        if: always()
        continue-on-error: true
        shell: pwsh
        run: |
          dotnet restore "9to1 Workspace/shared/Haven.sln" 2>&1 |
            Tee-Object artifacts/new-haven-beta/RESTORE.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build
        id: build
        if: always()
        continue-on-error: true
        shell: pwsh
        run: |
          dotnet build "9to1 Workspace/shared/Haven.sln" -c Release --no-restore 2>&1 |
            Tee-Object artifacts/new-haven-beta/BUILD.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Test
        id: test
        if: always()
        continue-on-error: true
        shell: pwsh
        run: |
          dotnet test "9to1 Workspace/shared/Haven.sln" -c Release --no-build --logger trx --results-directory "artifacts/new-haven-beta/TestResults" 2>&1 |
            Tee-Object artifacts/new-haven-beta/TEST.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Write validation report
        if: always()
        shell: pwsh
        run: |
          @(
            '# Historical patch validation',
            '',
            '| Stage | Result |',
            '|---|---|',
            '| Patch | ${{ steps.patch.outcome }} |',
            '| Restore | ${{ steps.restore.outcome }} |',
            '| Build | ${{ steps.build.outcome }} |',
            '| Test | ${{ steps.test.outcome }} |',
            '',
            'Classify failures from retained logs/TRX as INFRASTRUCTURE, TEST or PRODUCT; leave unresolved outcomes UNTRIAGED.',
            'Successful stages record process results, not product, native or release acceptance.',
            'Review source.patch against SOURCE.json before proposing changes through normal independent review.'
          ) | Set-Content artifacts/new-haven-beta/VALIDATION.md

      - name: Record reviewable source patch
        if: always()
        shell: pwsh
        run: |
          git rev-parse HEAD | Set-Content artifacts/new-haven-beta/source.sha
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $checkoutSha = (Get-Content artifacts/new-haven-beta/source.sha -Raw).Trim()
          if ($checkoutSha -ne '${{ github.sha }}') { throw 'Checkout identity differs from dispatched commit' }
          git add --intent-to-add -- "9to1 Workspace/shared/src" "9to1 Workspace/shared/tests" "9to1 Workspace/shared/scripts"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git diff --binary --output=artifacts/new-haven-beta/source.patch HEAD -- "9to1 Workspace/shared/src" "9to1 Workspace/shared/tests" "9to1 Workspace/shared/scripts"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          @{
            repository = '${{ github.repository }}'
            dispatched_sha = '${{ github.sha }}'
            checkout_sha = $checkoutSha
            run_id = '${{ github.run_id }}'
            run_attempt = '${{ github.run_attempt }}'
            patch_sha256 = (Get-FileHash artifacts/new-haven-beta/source.patch -Algorithm SHA256).Hash.ToLowerInvariant()
            scope = 'Manual patch validation; independent review required before integration. No native or release acceptance.'
          } | ConvertTo-Json | Set-Content artifacts/new-haven-beta/SOURCE.json

      - name: Retain patch, reports and actual validation logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: new-haven-beta-validation-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/new-haven-beta/
          if-no-files-found: error
          retention-days: 14

      - name: Fail when validation incomplete
        if: always()
        shell: pwsh
        run: |
          $outcomes = @(
            '${{ steps.patch.outcome }}',
            '${{ steps.restore.outcome }}',
            '${{ steps.build.outcome }}',
            '${{ steps.test.outcome }}'
          )
          $incomplete = @($outcomes | Where-Object { $_ -ne 'success' })
          if ($incomplete.Count -gt 0) { exit 1 }
