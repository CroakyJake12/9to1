name: 9T W6 - bounded runner unblocking
on:
  push:
    branches: [w6/9t-int-001-20261009]
    paths: [.github/workflows/9t-w6-candidate.yml]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: 9t-w6-recovery-${{ github.ref }}
  cancel-in-progress: false
jobs:
  signed-test-cache:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with:
          dotnet-version: 10.0.401
      - name: Restore exact public test dependencies normally, not product tests
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p scratch/v2 scratch/v3 artifacts/cache
          python3 - <<'PY'
          import pathlib
          for kind,xunit in [('v2','xunit'),('v3','xunit.v3')]:
              version='2.9.3' if kind=='v2' else '3.2.2'
              pathlib.Path(f'scratch/{kind}/dependencies.csproj').write_text(f'<Project Sdk="Microsoft.NET.Sdk"><PropertyGroup><TargetFramework>net10.0</TargetFramework></PropertyGroup><ItemGroup><PackageReference Include="Microsoft.NET.Test.Sdk" Version="17.14.1"/><PackageReference Include="{xunit}" Version="{version}"/><PackageReference Include="xunit.runner.visualstudio" Version="3.1.5"/><PackageReference Include="coverlet.collector" Version="6.0.4"/></ItemGroup></Project>')
          PY
          dotnet --info > artifacts/cache/dotnet-info.txt
          dotnet restore scratch/v2/dependencies.csproj --packages "$RUNNER_TEMP/w6-test-cache" 2>&1 | tee artifacts/cache/restore-v2.log
          dotnet restore scratch/v3/dependencies.csproj --packages "$RUNNER_TEMP/w6-test-cache" 2>&1 | tee artifacts/cache/restore-v3.log
      - name: Capture exact normally restored cache including genuine completion metadata
        shell: bash
        run: |
          python3 - <<'PY'
          import hashlib,json,os,pathlib,tarfile
          root=pathlib.Path(os.environ['RUNNER_TEMP'])/'w6-test-cache';out=pathlib.Path('artifacts/cache');rows=[]
          for p in sorted(root.rglob('*')):
              if p.is_symlink():raise RuntimeError('Unexpected symlink in package cache')
              if p.is_file():
                  if p.name=='.nupkg.metadata':
                      meta=json.loads(p.read_text())
                      if not meta.get('source','').startswith('https://api.nuget.org/'):raise RuntimeError('Unexpected package source')
                  rows.append({'path':p.relative_to(root).as_posix(),'sha256':hashlib.sha256(p.read_bytes()).hexdigest(),'bytes':p.stat().st_size})
          with tarfile.open(out/'signed-test-cache.tar.gz','w:gz') as archive:
              for row in rows:archive.add(root/row['path'],arcname=row['path'],recursive=False)
          payload=out/'signed-test-cache.tar.gz'
          (out/'cache-manifest.json').write_text(json.dumps({'qualification':'DEPENDENCY PREPARATION ONLY. No product or fixture test executed. Standard signature/revocation/audit settings unchanged.','archive_sha256':hashlib.sha256(payload.read_bytes()).hexdigest(),'files':rows},indent=2)+'\n')
          PY
      - name: Publish dependency provenance and original restore results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: w6-signed-test-cache-${{ github.run_id }}
          path: artifacts/cache/
          retention-days: 3
          compression-level: 0
          if-no-files-found: error
  gui-loopback-prerequisite:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 2fb3f9c317bd4a66b50009ed301513c4bf835a0c
          persist-credentials: false
          sparse-checkout: LICENSE
          sparse-checkout-cone-mode: false
      - name: Prepare isolated browser check without changing browser policies
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/gui
          command -v Xvfb | tee artifacts/gui/xvfb-path.txt
          command -v google-chrome | tee artifacts/gui/chrome-path.txt
          python3 -m venv "$RUNNER_TEMP/w6-browser"
          "$RUNNER_TEMP/w6-browser/bin/pip" install playwright==1.55.0 > artifacts/gui/python-install.log 2>&1
          "$RUNNER_TEMP/w6-browser/bin/pip" freeze > artifacts/gui/python-packages.txt
      - name: Navigate real loopback HTTP with a headed sandboxed browser
        shell: bash
        run: |
          xvfb-run -a -s '-screen 0 1280x960x24' "$RUNNER_TEMP/w6-browser/bin/python" - <<'PY'
          import functools,hashlib,http.server,json,pathlib,platform,shutil,tempfile,threading,time
          from playwright.sync_api import sync_playwright
          out=pathlib.Path('artifacts/gui');start=time.monotonic();payload=pathlib.Path('LICENSE').read_bytes()
          result={'qualification':'ENVIRONMENT TRANSPORT PROBE ONLY. Serves the real public repository license, not a mock application. No 9to1 app, account or product workflow is tested.','product_smoke':'NOT RUN','sandbox_enabled':True,'headless':False,'os':platform.platform(),'payload_sha256':hashlib.sha256(payload).hexdigest()}
          with tempfile.TemporaryDirectory() as tmp:
              pathlib.Path(tmp,'LICENSE.txt').write_bytes(payload)
              handler=functools.partial(http.server.SimpleHTTPRequestHandler,directory=tmp)
              server=http.server.ThreadingHTTPServer(('127.0.0.1',0),handler)
              thread=threading.Thread(target=server.serve_forever,daemon=True);thread.start()
              try:
                  with sync_playwright() as p:
                      browser=p.chromium.launch(executable_path=shutil.which('google-chrome'),headless=False,chromium_sandbox=True)
                      result['browser_version']=browser.version
                      page=browser.new_page(viewport={'width':1200,'height':900})
                      response=page.goto(f'http://127.0.0.1:{server.server_port}/LICENSE.txt',wait_until='networkidle')
                      if response.status!=200 or response.body()!=payload:raise RuntimeError('Loopback bytes/status mismatch')
                      result['document_visibility']=page.evaluate('document.visibilityState')
                      if result['document_visibility']!='visible':raise RuntimeError('Browser document is not visible')
                      page.screenshot(path=str(out/'environment-license-text.png'))
                      result['navigation']=page.url;result['runner_probe']='PASS';browser.close()
              except Exception as exc:
                  result['runner_probe']='FAIL';result['error']=str(exc)
              finally:
                  server.shutdown();server.server_close();thread.join()
                  result['elapsed_seconds']=time.monotonic()-start
                  (out/'runner-result.json').write_text(json.dumps(result,indent=2)+'\n');print(json.dumps(result,indent=2))
          if result['runner_probe']!='PASS':raise SystemExit(1)
          PY
      - name: Preserve environment-only GUI evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: w6-gui-loopback-${{ github.run_id }}
          path: artifacts/gui/
          retention-days: 14
          if-no-files-found: error
