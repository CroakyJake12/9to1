name: Astra immutable managed follow-up
on:
  workflow_dispatch:
    inputs:
      expected_commit:
        required: true
        type: string
      cut_manifest_sha256:
        required: true
        type: string
permissions:
  contents: read
jobs:
  validate:
    if: startsWith(github.ref, 'refs/heads/validation/astra-data21-')
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      AVALONIA_TELEMETRY_OPTOUT: '1'
      DOTNET_CLI_DO_NOT_USE_MSBUILD_SERVER: '1'
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_CLI_USE_MSBUILD_SERVER: '0'
      MSBUILDDISABLENODEREUSE: '1'
      DOTNET_SKIP_FIRST_TIME_EXPERIENCE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
          persist-credentials: false
      - name: Materialize only three pinned managed source dependencies
        shell: bash
        run: |
          set -euo pipefail
          git submodule update --init --recursive -- \
            "framework/CUI/vendor/Avalonia/external/XamlX" \
            "framework/CUI/vendor/Avalonia/external/Avalonia.DBus" \
            "9to1 Workspace/Terminal/Source/libvterm"
          bash "9to1 Workspace/shared/eng/prepare-cui-source.sh" --check
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Verify immutable source and run bounded managed suites
        env:
          EXPECTED_COMMIT: ${{ inputs.expected_commit }}
          EXPECTED_MANIFEST_SHA: ${{ inputs.cut_manifest_sha256 }}
        run: python3 .github/scripts/astra-data21-hosted-managed.py --expected-commit "$EXPECTED_COMMIT" --manifest .github/validation/astra-data21-cut.json --manifest-sha "$EXPECTED_MANIFEST_SHA"
      - name: Preserve actual results including failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: astra-data21-managed-${{ github.sha }}
          path: artifacts/data21-managed
          if-no-files-found: error
          retention-days: 14
