name: Astra full Wave Motion Play owning and regression
on:
  workflow_dispatch:
    inputs:
      expected_commit:
        required: true
        type: string
      cut_manifest_sha256:
        required: true
        type: string
permissions:
  contents: read
jobs:
  validate:
    if: startsWith(github.ref, 'refs/heads/validation/astra-media11-')
    strategy:
      fail-fast: false
      matrix:
        cohort: [owning, regression, resource]
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    env:
      AVALONIA_TELEMETRY_OPTOUT: '1'
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_CLI_USE_MSBUILD_SERVER: '0'
      DOTNET_CLI_DO_NOT_USE_MSBUILD_SERVER: '1'
      MSBUILDDISABLENODEREUSE: '1'
      DOTNET_SKIP_FIRST_TIME_EXPERIENCE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
          persist-credentials: false
      - name: Materialize only three exact source dependencies
        run: |
          set -euo pipefail
          git submodule update --init --recursive -- "framework/CUI/vendor/Avalonia/external/XamlX" "framework/CUI/vendor/Avalonia/external/Avalonia.DBus" "9to1 Workspace/Terminal/Source/libvterm"
          bash "9to1 Workspace/shared/eng/prepare-cui-source.sh" --check
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Provision official matching distro GES for actual native owning workflow
        if: matrix.cohort == 'owning'
        run: |
          set -euo pipefail
          mkdir -p artifacts/media11-owning/native-ges
          sudo apt-get update >artifacts/media11-owning/native-ges/apt-update.log 2>&1
          sudo apt-get install --no-upgrade --no-install-recommends -y ges1.0-tools gstreamer1.0-plugins-good gstreamer1.0-plugins-bad >artifacts/media11-owning/native-ges/apt-install.log 2>&1
          command -v ges-launch-1.0 >artifacts/media11-owning/native-ges/executable-path.txt
          ges-launch-1.0 --ges-version >artifacts/media11-owning/native-ges/version.txt 2>&1
          sha256sum "$(command -v ges-launch-1.0)" >artifacts/media11-owning/native-ges/executable-sha256.txt
          dpkg-query -W -f='${Package} ${Version} ${Architecture}\n' ges1.0-tools 'libges*' 'gstreamer1.0-*' >artifacts/media11-owning/native-ges/package-versions.txt
          dpkg-query -S /usr/bin/ges-launch-1.0 >artifacts/media11-owning/native-ges/executable-package-owner.txt
          cp /usr/share/doc/ges1.0-tools/copyright artifacts/media11-owning/native-ges/official-copyright.txt
          printf 'ASTRA_GES_EXECUTABLE=%s\n' "$(command -v ges-launch-1.0)" >> "$GITHUB_ENV"
          printf 'ASTRA_MOTION_FIXTURE=%s/.github/validation/motion-native-input.webm\n' "$GITHUB_WORKSPACE" >> "$GITHUB_ENV"
      - name: Validate identical joined program
        env:
          EXPECTED_COMMIT: ${{ inputs.expected_commit }}
          EXPECTED_MANIFEST_SHA: ${{ inputs.cut_manifest_sha256 }}
          COHORT: ${{ matrix.cohort }}
        run: python3 ".github/scripts/astra-media11-${COHORT}.py" --expected-commit "$EXPECTED_COMMIT" --manifest .github/validation/astra-media11-cut.json --manifest-sha "$EXPECTED_MANIFEST_SHA"
      - name: Retain actual evidence including failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: astra-media11-${{ matrix.cohort }}-${{ github.sha }}
          path: artifacts/media11-${{ matrix.cohort }}
          if-no-files-found: error
          retention-days: 14
