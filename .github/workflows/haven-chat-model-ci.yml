name: Astra Games canonical normals native and full existing regressions
on:
  workflow_dispatch:
    inputs:
      expected_commit:
        required: true
        type: string
      cut_manifest_sha256:
        required: true
        type: string
permissions:
  contents: read
jobs:
  validate:
    if: startsWith(github.ref, 'refs/heads/validation/astra-games-normals-')
    strategy:
      fail-fast: false
      matrix:
        cohort: [native, owning, regression, resource]
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    env:
      AVALONIA_TELEMETRY_OPTOUT: '1'
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_CLI_USE_MSBUILD_SERVER: '0'
      DOTNET_CLI_DO_NOT_USE_MSBUILD_SERVER: '1'
      MSBUILDDISABLENODEREUSE: '1'
      DOTNET_SKIP_FIRST_TIME_EXPERIENCE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
          persist-credentials: false
      - name: Materialize only three exact source dependencies
        run: |
          set -euo pipefail
          git submodule update --init --recursive -- "framework/CUI/vendor/Avalonia/external/XamlX" "framework/CUI/vendor/Avalonia/external/Avalonia.DBus" "9to1 Workspace/Terminal/Source/libvterm"
          bash "9to1 Workspace/shared/eng/prepare-cui-source.sh" --check
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Validate identical joined program
        env:
          EXPECTED_COMMIT: ${{ inputs.expected_commit }}
          EXPECTED_MANIFEST_SHA: ${{ inputs.cut_manifest_sha256 }}
          COHORT: ${{ matrix.cohort }}
        run: python3 ".github/scripts/astra-games-normals-${COHORT}.py" --expected-commit "$EXPECTED_COMMIT" --manifest .github/validation/astra-games-normals-cut.json --manifest-sha "$EXPECTED_MANIFEST_SHA"
      - name: Bound full original native or real owning evidence including failure
        if: always() && (matrix.cohort == 'native' || matrix.cohort == 'owning')
        run: python3 .github/scripts/astra-games-native-bundle.py "${{ matrix.cohort }}"
      - name: Retain full regression or resource original evidence
        if: always() && matrix.cohort != 'native' && matrix.cohort != 'owning'
        uses: actions/upload-artifact@v4
        with:
          name: astra-games-normals-${{ matrix.cohort }}-${{ github.sha }}
          path: artifacts/games-normals-${{ matrix.cohort }}
          if-no-files-found: error
          retention-days: 14
      - name: Retain original evidence receipt and bounded logs
        if: always() && (matrix.cohort == 'native' || matrix.cohort == 'owning')
        uses: actions/upload-artifact@v4
        with:
          name: astra-games-normals-${{ matrix.cohort }}-small-${{ github.sha }}
          path: artifacts/games-normals-${{ matrix.cohort }}-small
          if-no-files-found: error
          retention-days: 14
      - name: Retain exact complete evidence part 000
        if: always() && (matrix.cohort == 'native' || matrix.cohort == 'owning') && hashFiles(format('artifacts/games-normals-{0}-bounded/part-000.bin', matrix.cohort)) != ''
        uses: actions/upload-artifact@v4
        with:
          name: astra-games-normals-${{ matrix.cohort }}-part-000-${{ github.sha }}
          path: artifacts/games-normals-${{ matrix.cohort }}-bounded/part-000.bin
          compression-level: 0
          if-no-files-found: error
          retention-days: 14
      - name: Retain exact complete evidence part 001
