name: Astra Data Browse coherent owning regression
on:
  workflow_dispatch:
    inputs:
      expected_commit:
        required: true
        type: string
      cut_manifest_sha256:
        required: true
        type: string
permissions:
  contents: read
jobs:
  data_cohorts:
    if: startsWith(github.ref, 'refs/heads/validation/astra-data-automation-root18-')
    strategy:
      fail-fast: false
      matrix:
        cohort: [owning, resource]
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    env:
      AVALONIA_TELEMETRY_OPTOUT: '1'
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_CLI_USE_MSBUILD_SERVER: '0'
      DOTNET_CLI_DO_NOT_USE_MSBUILD_SERVER: '1'
      MSBUILDDISABLENODEREUSE: '1'
      DOTNET_SKIP_FIRST_TIME_EXPERIENCE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
          persist-credentials: false
      - name: Materialize only three exact source dependencies
        run: |
          set -euo pipefail
          git submodule update --init --recursive -- "framework/CUI/vendor/Avalonia/external/XamlX" "framework/CUI/vendor/Avalonia/external/Avalonia.DBus" "9to1 Workspace/Terminal/Source/libvterm"
          bash "9to1 Workspace/shared/eng/prepare-cui-source.sh" --check
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Validate identical joined program
        env:
          EXPECTED_COMMIT: ${{ inputs.expected_commit }}
          EXPECTED_MANIFEST_SHA: ${{ inputs.cut_manifest_sha256 }}
          COHORT: ${{ matrix.cohort }}
        run: |
          set -euo pipefail
          if [ "$COHORT" = owning ]; then
            mkdir -p artifacts/data-browse-owning
            command -v Xvfb > artifacts/data-browse-owning/actual-xvfb-path.txt
            command -v xvfb-run > artifacts/data-browse-owning/actual-xvfb-run-path.txt
            command -v xauth > artifacts/data-browse-owning/actual-xauth-path.txt
            dpkg-query -W -f='${binary:Package} ${Version} ${Status}\n' xvfb xauth > artifacts/data-browse-owning/actual-display-package-provenance.txt
            sha256sum "$(command -v Xvfb)" "$(command -v xvfb-run)" "$(command -v xauth)" > artifacts/data-browse-owning/actual-display-executable-sha256.txt
            xvfb-run --auto-servernum --server-args='-screen 0 1280x1024x24 -nolisten tcp' bash -c '
              test -n "$DISPLAY"
              printf "%s\n" "$DISPLAY" > artifacts/data-browse-owning/actual-display.txt
              python3 ".github/scripts/astra-data-browse-owning.py" --expected-commit "$EXPECTED_COMMIT" --manifest .github/validation/astra-data-automation-cut.json --manifest-sha "$EXPECTED_MANIFEST_SHA"
            '
          else
            python3 ".github/scripts/astra-data-browse-${COHORT}.py" --expected-commit "$EXPECTED_COMMIT" --manifest .github/validation/astra-data-automation-cut.json --manifest-sha "$EXPECTED_MANIFEST_SHA"
          fi
      - name: Retain actual evidence including failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: astra-data-browse-${{ matrix.cohort }}-${{ github.sha }}
          path: artifacts/data-browse-${{ matrix.cohort }}
          if-no-files-found: error
          retention-days: 14

  automation_cohorts:
    if: startsWith(github.ref, 'refs/heads/validation/astra-data-automation-root18-')
    strategy:
      fail-fast: false
      matrix:
        cohort: [owning, resource, automation]
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    env:
      AVALONIA_TELEMETRY_OPTOUT: '1'
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_CLI_USE_MSBUILD_SERVER: '0'
      DOTNET_CLI_DO_NOT_USE_MSBUILD_SERVER: '1'
      MSBUILDDISABLENODEREUSE: '1'
      DOTNET_SKIP_FIRST_TIME_EXPERIENCE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
          persist-credentials: false
      - name: Materialize only three exact source dependencies
        run: |
          set -euo pipefail
          git submodule update --init --recursive -- "framework/CUI/vendor/Avalonia/external/XamlX" "framework/CUI/vendor/Avalonia/external/Avalonia.DBus" "9to1 Workspace/Terminal/Source/libvterm"
          bash "9to1 Workspace/shared/eng/prepare-cui-source.sh" --check
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Validate identical joined program
        env:
          EXPECTED_COMMIT: ${{ inputs.expected_commit }}
          EXPECTED_MANIFEST_SHA: ${{ inputs.cut_manifest_sha256 }}
          COHORT: ${{ matrix.cohort }}
        run: python3 ".github/scripts/astra-automation-original-${COHORT}.py" --expected-commit "$EXPECTED_COMMIT" --manifest .github/validation/astra-data-automation-cut.json --manifest-sha "$EXPECTED_MANIFEST_SHA"
      - name: Retain actual evidence including failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: astra-automation-original-${{ matrix.cohort }}-${{ github.sha }}
          path: artifacts/automation-original-${{ matrix.cohort }}
          if-no-files-found: error
          retention-days: 14
