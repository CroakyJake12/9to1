name: Astra Linux signed original Home owner native whole owning regression resource
on:
  workflow_dispatch:
    inputs:
      expected_commit:
        required: true
        type: string
      cut_manifest_sha256:
        required: true
        type: string
permissions:
  contents: read
jobs:
  validate:
    if: startsWith(github.ref, 'refs/heads/validation/astra-linux-native-signed-current22-full-')
    strategy:
      fail-fast: false
      matrix:
        cohort: [owning, regression, resource]
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      AVALONIA_TELEMETRY_OPTOUT: '1'
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_CLI_USE_MSBUILD_SERVER: '0'
      DOTNET_CLI_DO_NOT_USE_MSBUILD_SERVER: '1'
      MSBUILDDISABLENODEREUSE: '1'
      DOTNET_SKIP_FIRST_TIME_EXPERIENCE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
          persist-credentials: false
      - name: Materialize only three exact source dependencies
        run: |
          set -euo pipefail
          git submodule update --init --recursive -- "framework/CUI/vendor/Avalonia/external/XamlX" "framework/CUI/vendor/Avalonia/external/Avalonia.DBus" "9to1 Workspace/Terminal/Source/libvterm"
          bash "9to1 Workspace/shared/eng/prepare-cui-source.sh" --check
      - name: Provision maintained native compiler and isolated X display prerequisites
        if: matrix.cohort == 'owning'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential util-linux libfontconfig1 libx11-6 libice6 libsm6 fonts-dejavu-core xvfb xauth
          mkdir -p artifacts/desktop-visible-owning
          dpkg-query -W > artifacts/desktop-visible-owning/native-hosted-packages.txt
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Validate identical joined program
        env:
          EXPECTED_COMMIT: ${{ inputs.expected_commit }}
          EXPECTED_MANIFEST_SHA: ${{ inputs.cut_manifest_sha256 }}
          COHORT: ${{ matrix.cohort }}
        run: |
          set -euo pipefail
          if [ "${{ matrix.cohort }}" = "owning" ]; then
            xvfb-run --auto-servernum --server-args="-screen 0 1280x1024x24 -nolisten tcp" python3 .github/scripts/astra-linux-native-whole-caller.py --expected-commit "$EXPECTED_COMMIT" --manifest .github/validation/astra-desktop-visible-cut.json --manifest-sha "$EXPECTED_MANIFEST_SHA"
          else
            python3 .github/scripts/astra-linux-native-whole-caller.py --expected-commit "$EXPECTED_COMMIT" --manifest .github/validation/astra-desktop-visible-cut.json --manifest-sha "$EXPECTED_MANIFEST_SHA"
          fi
      - name: Retain ordinary regression/resource evidence including failure
        if: ${{ always() && matrix.cohort != 'owning' }}
        uses: actions/upload-artifact@v4
        with:
          name: astra-desktop-visible-${{ matrix.cohort }}-${{ github.sha }}
          path: artifacts/desktop-visible-${{ matrix.cohort }}
          if-no-files-found: error
          retention-days: 14

      - name: Freeze bounded independently verifiable evidence bundles
        id: bundles
        if: ${{ always() && matrix.cohort == 'owning' }}
        run: |
          test ! -f native-hosted-packages.txt || cp native-hosted-packages.txt artifacts/desktop-visible-owning/
          python3 .github/scripts/astra-files-artifact-parts.py --input artifacts/desktop-visible-owning --output artifacts/files-owning-parts
      - name: Retain fullfile and independent bundle manifest
        if: ${{ always() && matrix.cohort == 'owning' }}
        uses: actions/upload-artifact@v4
        with:
          name: astra-linux-native-owning-manifest-${{ github.sha }}
          path: artifacts/files-owning-parts/manifest.json
          if-no-files-found: error
          retention-days: 14
      - name: Retain independently bounded evidence bundle 00
        if: ${{ always() && matrix.cohort == 'owning' && steps.bundles.outputs.count != '' && fromJSON(steps.bundles.outputs.count) > 0 }}
        uses: actions/upload-artifact@v4
        with:
          name: astra-linux-native-owning-bundle-00-${{ github.sha }}
          path: artifacts/files-owning-parts/bundle-00.zip
          compression-level: 0
          if-no-files-found: error
          retention-days: 14
      - name: Retain independently bounded evidence bundle 01
        if: ${{ always() && matrix.cohort == 'owning' && steps.bundles.outputs.count != '' && fromJSON(steps.bundles.outputs.count) > 1 }}
        uses: actions/upload-artifact@v4
        with:
