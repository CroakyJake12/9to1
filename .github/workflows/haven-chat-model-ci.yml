name: Astra Forms mathematics actual App native and whole owning regression resource
on:
  workflow_dispatch:
    inputs:
      expected_commit:
        required: true
        type: string
      cut_manifest_sha256:
        required: true
        type: string
permissions:
  contents: read
jobs:
  validate:
    if: startsWith(github.ref, 'refs/heads/validation/astra-forms-math01-')
    strategy:
      fail-fast: false
      matrix:
        cohort: [owning, regression, resource]
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    env:
      AVALONIA_TELEMETRY_OPTOUT: '1'
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_CLI_USE_MSBUILD_SERVER: '0'
      DOTNET_CLI_DO_NOT_USE_MSBUILD_SERVER: '1'
      MSBUILDDISABLENODEREUSE: '1'
      DOTNET_SKIP_FIRST_TIME_EXPERIENCE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
          persist-credentials: false
      - name: Materialize only three exact source dependencies
        run: |
          set -euo pipefail
          git submodule update --init --recursive -- "framework/CUI/vendor/Avalonia/external/XamlX" "framework/CUI/vendor/Avalonia/external/Avalonia.DBus" "9to1 Workspace/Terminal/Source/libvterm"
          bash "9to1 Workspace/shared/eng/prepare-cui-source.sh" --check
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Validate identical joined program
        env:
          EXPECTED_COMMIT: ${{ inputs.expected_commit }}
          EXPECTED_MANIFEST_SHA: ${{ inputs.cut_manifest_sha256 }}
          COHORT: ${{ matrix.cohort }}
        run: |
          set -euo pipefail
          if [ "$COHORT" = owning ]; then
            mkdir -p artifacts/desktop-visible-owning
            command -v Xvfb > artifacts/desktop-visible-owning/actual-xvfb-path.txt
            command -v xvfb-run > artifacts/desktop-visible-owning/actual-xvfb-run-path.txt
            command -v xauth > artifacts/desktop-visible-owning/actual-xauth-path.txt
            dpkg-query -W -f='${binary:Package} ${Version} ${Status}\n' xvfb xauth > artifacts/desktop-visible-owning/actual-display-package-provenance.txt
            sha256sum "$(command -v Xvfb)" "$(command -v xvfb-run)" "$(command -v xauth)" > artifacts/desktop-visible-owning/actual-display-executable-sha256.txt
            xvfb-run --auto-servernum --server-args='-screen 0 1280x1024x24 -nolisten tcp' bash -c '
              test -n "$DISPLAY"
              printf "%s\n" "$DISPLAY" > artifacts/desktop-visible-owning/actual-display.txt
              python3 ".github/scripts/astra-forms-sites-isolated-validation.py" --expected-commit "$EXPECTED_COMMIT" --manifest .github/validation/astra-forms-math01-cut.json --manifest-sha "$EXPECTED_MANIFEST_SHA"
            '
          else
            python3 ".github/scripts/astra-forms-math01-${COHORT}.py" --expected-commit "$EXPECTED_COMMIT" --manifest .github/validation/astra-forms-math01-cut.json --manifest-sha "$EXPECTED_MANIFEST_SHA"
          fi
      - name: Retain actual evidence including failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: astra-forms-math01-${{ matrix.cohort }}-${{ github.sha }}
          path: artifacts/desktop-visible-${{ matrix.cohort }}
          if-no-files-found: error
          retention-days: 14

  forms17-dual-original-custody:
    name: Forms17 owning/resource original evidence custody only
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/validation/sol-happy-forms17-dual-original-custody-20261004' && inputs.expected_commit == github.sha && inputs.cut_manifest_sha256 == 'aa662ab65cd25316eea8bf30efa87fa60120222b637b91c276ae66d29dcf085d'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
    steps:
      - name: Verify root-owned reader source and replay only two pinned Forms17 owning/resource original archives
        timeout-minutes: 20
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python3 -B - <<'PY'
          import base64, hashlib, json, os, re, sys, urllib.request
          class Refusal(Exception):
              pass
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, request, fp, code, message, headers, newurl):
                  return None
          def require(value, code):
              if not value:
                  raise Refusal(code)
          def add(errors, error):
              if all(error is not old for old in errors):
                  errors.append(error)
          def settle(errors):
              if len(errors) == 1:
                  raise errors[0]
              if errors:
                  raise BaseExceptionGroup('Trusted reader bootstrap and independent IO failures.', errors)
          def safe(errors):
              result=[]
              for error in errors:
                  row={'type':type(error).__name__,'code':'BOOTSTRAP_OR_FINAL_IO_FAILURE'}
                  if isinstance(error, BaseExceptionGroup):
                      row['causes']=safe(error.exceptions)
                  result.append(row)
              return result
          def unique(pairs):
              output={}
              for key,value in pairs:
                  require(key not in output,'BOOTSTRAP_DUPLICATE_JSON')
                  output[key]=value
              return output
          requests_attempted=0
          bytes_reserved=0
          def source(path, expected_bytes, expected_sha):
              global requests_attempted,bytes_reserved
              require(requests_attempted<2,'BOOTSTRAP_REQUEST_CAP')
              requests_attempted+=1
              bytes_reserved+=131072
              require(bytes_reserved<=262144,'BOOTSTRAP_ATTEMPT_BYTES_CAP')
              require(os.environ.get('GITHUB_REPOSITORY')=='CroakyJake12/9to1' and os.environ.get('GITHUB_REF')=='refs/heads/validation/sol-happy-forms17-dual-original-custody-20261004' and os.environ.get('GITHUB_EVENT_NAME')=='workflow_dispatch','BOOTSTRAP_CONTEXT_REFUSED')
              revision=os.environ['GITHUB_SHA']
              require(re.fullmatch('[0-9a-f]{40}',revision) is not None,'BOOTSTRAP_OWN_COMMIT_REFUSED')
              token=os.environ.get('GH_TOKEN','')
              require(token and '\n' not in token and '\r' not in token,'BOOTSTRAP_API_TOKEN_REFUSED')
              url='https://api.github.com/repos/CroakyJake12/9to1/contents/'+path+'?ref='+revision
              request=urllib.request.Request(url,headers={'Authorization':'Bearer '+token,'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28','User-Agent':'sol-happy-sdk08-trusted-reader-bootstrap','Accept-Encoding':'identity'})
              opener=urllib.request.build_opener(NoRedirect())
              response=None;errors=[];raw=None
              try:
                  response=opener.open(request,timeout=60)
                  require(response.status==200 and response.headers.get('Content-Encoding','identity').lower()=='identity','BOOTSTRAP_API_RESPONSE_REFUSED')
                  held=bytearray()
                  while True:
                      part=response.read(min(65536,131072-len(held)+1))
                      if not part:
                          break
                      held.extend(part)
                      require(len(held)<=131072,'BOOTSTRAP_SOURCE_JSON_CAP')
                  value=json.loads(bytes(held).decode('utf-8',errors='strict'),object_pairs_hook=unique)
                  require(value['type']=='file' and value['path']==path and value['size']==expected_bytes and value['encoding']=='base64','BOOTSTRAP_SOURCE_DESCRIPTOR_REFUSED')
                  encoded=''.join(value['content'].split())
                  raw=base64.b64decode(encoded,validate=True)
                  require(len(raw)==expected_bytes and hashlib.sha256(raw).hexdigest()==expected_sha,'BOOTSTRAP_SOURCE_WHOLE_HASH_REFUSED')
                  require(hashlib.sha1(b'blob '+str(len(raw)).encode()+b'\0'+raw).hexdigest()==value['sha'],'BOOTSTRAP_SOURCE_GIT_BLOB_REFUSED')
              except BaseException as error:
                  if response is None and isinstance(error,urllib.error.HTTPError):
                      response=error
                  add(errors,error)
              if response is not None:
                  try:
                      response.close()
                  except BaseException as error:
                      add(errors,error)
              settle(errors)
              return raw
          errors=[]
          namespace=None
          try:
              require(sys.version_info>=(3,11) and sys.flags.optimize==0,'BOOTSTRAP_PYTHON_REFUSED')
              code=source('.github/scripts/sol-happy-forms17-dual-original-custody.py',60693,'a2dcc6d0412e7cc900833193a8177e42c32348d58592bba0ca77d13ab96e7819')
              configuration=source('.github/validation/sol-happy-forms17-dual-original-custody.json',3521,'aa662ab65cd25316eea8bf30efa87fa60120222b637b91c276ae66d29dcf085d')
              namespace={'__name__':'sol_happy_owned_original_custody_reader'}
              # Only exact root-owned reader source is executed; original artifact payloads are data.
              exec(compile(code,'root-owned-forms17-dual-original-custody-reader','exec'),namespace)
              namespace['main'](json.loads(configuration.decode('utf-8',errors='strict'),object_pairs_hook=unique))
          except BaseException as error:
              add(errors,error)
          if errors:
              try:
                  project=namespace['projections'](errors) if namespace is not None and 'projections' in namespace else safe(errors)
                  print(json.dumps({'status':'FORMS17_ORIGINAL_CUSTODY_REFUSED','originalCauses':project,'bootstrapRequestsAttempted':requests_attempted,'bootstrapBytesReserved':bytes_reserved},ensure_ascii=True,sort_keys=True),flush=True)
              except BaseException as error:
                  add(errors,error)
              # Never allow Python to print raw network exceptions, tracebacks or temporary signed URLs.
              sys.exit(1)
          PY
      - name: Retain complete original causal text and replay diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: sol-happy-forms17-dual-original-custody-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/forms17-dual-original-custody-${{ github.run_id }}-${{ github.run_attempt }}/
          include-hidden-files: true
          compression-level: 6
          if-no-files-found: error
          retention-days: 14
      - name: Retain complete Forms17 owning/resource causal originals for separate admission
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: sol-happy-forms17-dual-complete-causal-originals-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/forms17-dual-original-custody-${{ github.run_id }}-${{ github.run_attempt }}/derived-forms-owning-member-inventory.json
            ${{ runner.temp }}/forms17-dual-original-custody-${{ github.run_id }}-${{ github.run_attempt }}/derived-forms-resource-member-inventory.json
            ${{ runner.temp }}/forms17-dual-original-custody-${{ github.run_id }}-${{ github.run_attempt }}/replay-report.json
            ${{ runner.temp }}/forms17-dual-original-custody-${{ github.run_id }}-${{ github.run_attempt }}/diagnostic.json
            ${{ runner.temp }}/forms17-dual-original-custody-${{ github.run_id }}-${{ github.run_attempt }}/originals/forms-owning/**/*.log
            ${{ runner.temp }}/forms17-dual-original-custody-${{ github.run_id }}-${{ github.run_attempt }}/originals/forms-owning/**/*.json
            ${{ runner.temp }}/forms17-dual-original-custody-${{ github.run_id }}-${{ github.run_attempt }}/originals/forms-owning/**/*.trx
            ${{ runner.temp }}/forms17-dual-original-custody-${{ github.run_id }}-${{ github.run_attempt }}/originals/forms-owning/**/*.stdout
            ${{ runner.temp }}/forms17-dual-original-custody-${{ github.run_id }}-${{ github.run_attempt }}/originals/forms-owning/**/*.stderr
            ${{ runner.temp }}/forms17-dual-original-custody-${{ github.run_id }}-${{ github.run_attempt }}/originals/forms-owning/**/*.txt
            ${{ runner.temp }}/forms17-dual-original-custody-${{ github.run_id }}-${{ github.run_attempt }}/originals/forms-owning/**/*.metadata
            ${{ runner.temp }}/forms17-dual-original-custody-${{ github.run_id }}-${{ github.run_attempt }}/originals/forms-resource/**/*.log
            ${{ runner.temp }}/forms17-dual-original-custody-${{ github.run_id }}-${{ github.run_attempt }}/originals/forms-resource/**/*.json
            ${{ runner.temp }}/forms17-dual-original-custody-${{ github.run_id }}-${{ github.run_attempt }}/originals/forms-resource/**/*.trx
            ${{ runner.temp }}/forms17-dual-original-custody-${{ github.run_id }}-${{ github.run_attempt }}/originals/forms-resource/**/*.stdout
            ${{ runner.temp }}/forms17-dual-original-custody-${{ github.run_id }}-${{ github.run_attempt }}/originals/forms-resource/**/*.stderr
            ${{ runner.temp }}/forms17-dual-original-custody-${{ github.run_id }}-${{ github.run_attempt }}/originals/forms-resource/**/*.txt
            ${{ runner.temp }}/forms17-dual-original-custody-${{ github.run_id }}-${{ github.run_attempt }}/originals/forms-resource/**/*.metadata
          include-hidden-files: true
          compression-level: 6
          if-no-files-found: error
          retention-days: 14
      - name: Retain complete Forms17 original control reports for bounded local admission
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: sol-happy-forms17-dual-original-control-reports-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/forms17-dual-original-custody-${{ github.run_id }}-${{ github.run_attempt }}/derived-forms-owning-member-inventory.json
            ${{ runner.temp }}/forms17-dual-original-custody-${{ github.run_id }}-${{ github.run_attempt }}/derived-forms-resource-member-inventory.json
            ${{ runner.temp }}/forms17-dual-original-custody-${{ github.run_id }}-${{ github.run_attempt }}/replay-report.json
            ${{ runner.temp }}/forms17-dual-original-custody-${{ github.run_id }}-${{ github.run_attempt }}/diagnostic.json
          include-hidden-files: true
          compression-level: 6
          if-no-files-found: error
          retention-days: 14
