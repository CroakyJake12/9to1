  agents-compiler-verification:
    if: startsWith(github.ref, 'refs/heads/validation/astra-agents-compiler09-isolated-original-20261004')
    strategy:
      fail-fast: false
      matrix:
        include:
          - { comparison: baseline, compiler_branch: v2, configuration: Debug }
          - { comparison: baseline, compiler_branch: v2, configuration: Release }
          - { comparison: corrected, compiler_branch: v3, configuration: Debug }
          - { comparison: corrected, compiler_branch: v3, configuration: Release }
          - { comparison: corrected, compiler_branch: v2, configuration: Debug }
          - { comparison: corrected, compiler_branch: v2, configuration: Release }
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      AVALONIA_TELEMETRY_OPTOUT: '1'
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_CLI_USE_MSBUILD_SERVER: '0'
      DOTNET_CLI_DO_NOT_USE_MSBUILD_SERVER: '1'
      MSBUILDDISABLENODEREUSE: '1'
      DOTNET_SKIP_FIRST_TIME_EXPERIENCE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          path: corrective
          ref: ${{ github.sha }}
          submodules: false
          persist-credentials: false
      - uses: actions/checkout@v4
        if: matrix.comparison == 'baseline'
        with:
          path: baseline
          ref: 4f600855d624ad4c9f781958bc1b39e0008e8ae1
          submodules: false
          persist-credentials: false
      - name: Materialize exactly the same three corrective source dependencies
        working-directory: corrective
        run: |
          set -euo pipefail
          git submodule update --init --recursive -- "framework/CUI/vendor/Avalonia/external/XamlX" "framework/CUI/vendor/Avalonia/external/Avalonia.DBus" "9to1 Workspace/Terminal/Source/libvterm"
          bash "9to1 Workspace/shared/eng/prepare-cui-source.sh" --check
      - name: Materialize unchanged baseline dependencies in its separate checkout
        if: matrix.comparison == 'baseline'
        working-directory: baseline
        run: |
          set -euo pipefail
          git submodule update --init --recursive -- "framework/CUI/vendor/Avalonia/external/XamlX" "framework/CUI/vendor/Avalonia/external/Avalonia.DBus" "9to1 Workspace/Terminal/Source/libvterm"
          bash "9to1 Workspace/shared/eng/prepare-cui-source.sh" --check
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: corrective/global.json
      - name: Run this original compiler lane with strict caller and command custody
        working-directory: corrective
        env:
          EXPECTED_COMMIT: ${{ inputs.expected_commit }}
          EXPECTED_MANIFEST_SHA: ${{ inputs.cut_manifest_sha256 }}
          COMPILER_CONFIGURATION: ${{ matrix.configuration }}
          COMPILER_BRANCH: ${{ matrix.compiler_branch }}
          COMPILER_COMPARISON: ${{ matrix.comparison }}
          ORIGINAL_WORKSPACE: ${{ github.workspace }}
        run: |
          set -euo pipefail
          if [ "$COMPILER_COMPARISON" = "baseline" ]; then
            comparison_root="$ORIGINAL_WORKSPACE/baseline"
          else
            comparison_root="$ORIGINAL_WORKSPACE/corrective"
          fi
          python3 .github/scripts/astra-agents-compiler09-caller.py --expected-commit "$EXPECTED_COMMIT" --manifest .github/validation/astra-desktop-visible-cut.json --manifest-sha "$EXPECTED_MANIFEST_SHA" --configuration "$COMPILER_CONFIGURATION" --compiler-branch "$COMPILER_BRANCH" --comparison "$COMPILER_COMPARISON" --comparison-root "$comparison_root"
      - name: Freeze every original compiler and caller evidence byte into bounded indexed parts
        id: compiler-bundles
        if: ${{ always() }}
        working-directory: corrective
        run: python3 .github/scripts/astra-files-artifact-parts.py --input artifacts/agents-compiler-verification --output artifacts/agents-compiler-parts
      - name: Retain complete compiler lane fullfile and piece index
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: astra-agents-compiler-${{ matrix.comparison }}-${{ matrix.compiler_branch }}-${{ matrix.configuration }}-manifest-${{ github.sha }}
          path: corrective/artifacts/agents-compiler-parts/manifest.json
          if-no-files-found: error
          retention-days: 14
      - name: Retain independent original compiler lane part 00
        if: ${{ always() && steps.compiler-bundles.outputs.count != '' && fromJSON(steps.compiler-bundles.outputs.count) > 0 }}
