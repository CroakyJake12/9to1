# FILE DOCUMENTATION
# Where: .github/workflows/haven-chat-model-ci.yml in the GitHub automation configuration used by continuous integration.
# What: This file automates or configures the repository operation described by its commands and keys.
# How: Read from top to bottom: inputs and environment first, validation/processing next, and explicit success or failure output last.
# Why: The file keeps one cohesive responsibility in a predictable location so callers can find and replace it without unrelated changes.
name: Haven Chat and Model Pass

on:
  workflow_dispatch:
    inputs:
      # Keep the original default Windows .NET job unchanged; Thunder runs ONLY when an explicit
      # owner/Root dispatches the `thunder-cuda-compile` or `thunder-artifact-audit` pipeline. The
      # choice value is never interpolated into any shell code (used only in a strict `if` comparison).
      pipeline:
        description: Pipeline to run
        required: true
        type: choice
        options:
          - validate
          - thunder-cuda-compile
          - thunder-artifact-audit
        default: validate

      # Manual artifact-audit inputs (only read by the gated `thunder-artifact-audit` job). These are
      # passed to that job via env and strictly validated inside the audit script before any GitHub API
      # use: decimal IDs and a 40-hex expected build head SHA. They are not interpolated into shell.
      audit_build_run_id:
        description: Original build workflow run ID (decimal) to audit
        required: false
        type: string
      audit_evidence_artifact_id:
        description: Evidence artifact ID (decimal) from that build run
        required: false
        type: string
      audit_install_artifact_id:
        description: Install-closure artifact ID (decimal) from that build run
        required: false
        type: string
      audit_expected_head_sha:
        description: Expected 40-hex build head SHA for the original build run
        required: false
        type: string

concurrency:
  group: haven-chat-model-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  validate:
    if: github.event.inputs.pipeline == 'validate'
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore "9to1 Workspace/shared/Haven.sln"

      - name: Build Debug
        run: dotnet build "9to1 Workspace/shared/Haven.sln" -c Debug --no-restore

      - name: Test Debug
        run: dotnet test "9to1 Workspace/shared/Haven.sln" -c Debug --no-build

      - name: Build automation worker
        run: dotnet build "9to1 Workspace/shared/src/Haven.AutomationWorker/Haven.AutomationWorker.csproj" -c Debug --no-restore

      - name: Upload source snapshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: haven-source-snapshot
          path: |
            .
            !**/bin/**
            !**/obj/**
            !.git/**
          include-hidden-files: true
          retention-days: 3

  # Compile-only CUDA build of the candidate relay engine. Explicitly gated to the owner/Root-chosen
  # pipeline; it never runs for the default `validate`. No physical GPU is required (nvcc compiles
  # SM120 + portable CPU targets). The build runs in the PINNED CUDA 13.0.2 devel ubuntu24.04 image
  # (immutable registry digest). GPU/driver/model are NOT run; evidence is bounded with short retention.
  thunder-cuda-compile:
    if: github.event.inputs.pipeline == 'thunder-cuda-compile'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      PIPELINE: thunder-cuda-compile
      # Pinned immutable registry digest (public manifest independently verified).
      CUDA_IMAGE: nvidia/cuda:13.0.2-devel-ubuntu24.04@sha256:5dc1bca23d05bd37b011be68ec470c03b403a5da07ec3a86e41af9470e9d0cc6
      CANDIDATE_LOCK: 9to1 Models/Dulche Alpha/InferenceEngines/NativeStrata/prep/strata-v0.2.2-lock.candidate.json
      # Immutable COMMIT archive (tag archives differ in gzip/root names and are not our exact pin).
      ARCHIVE_URL: https://codeload.github.com/Niko1221/Strata/tar.gz/011c9e600a93bbc9fd451c563501b5831c32bbca
      ARCHIVE_SHA256: ccfffeaabfb410b734b95d202576b98b3d2f2d28080a69ea8a3c49268d95c93a
      GGML_REPO: https://github.com/ggml-org/llama.cpp
      GGML_COMMIT: 3cf03257f219afbe7334045ff7c6a06ac68c627d
      GGML_TREE: d255198f04f9b8349f1dff24501d513f83cbfeda
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Read ACTUAL runner capacity (memory/CPU/disk) and derive conservative container bounds. Do not
      # assume public/private runners share the same resources; fail clearly before compiling if
      # inadequate. Writes preflight-runner.json (metadata, not raw env) and publishes docker bounds.
      - name: Resource preflight (runner) and bounds
        id: preflight
        run: bash .github/scripts/thunder-runner-preflight.sh

      - name: Build in pinned CUDA image (compile-only)
        run: |
          set -euo pipefail
          docker run --rm \
            --pull always \
            --workdir "${{ github.workspace }}" \
            --memory=${{ steps.preflight.outputs.memory_mb }}m \
            --cpus=${{ steps.preflight.outputs.cpus }} \
            --pids-limit=${{ steps.preflight.outputs.pids_limit }} \
            -v "${{ github.workspace }}:${{ github.workspace }}" \
            -e REPO="${{ github.workspace }}" \
            -e CANDIDATE_LOCK="$CANDIDATE_LOCK" \
            -e ARCHIVE_URL="$ARCHIVE_URL" \
            -e ARCHIVE_SHA256="$ARCHIVE_SHA256" \
            -e GGML_REPO="$GGML_REPO" \
            -e GGML_COMMIT="$GGML_COMMIT" \
            -e GGML_TREE="$GGML_TREE" \
            -e CUDA_IMAGE="$CUDA_IMAGE" \
            "$CUDA_IMAGE" \
            bash "${{ github.workspace }}/.github/scripts/thunder-cuda-compile.sh"

      - name: Upload bounded structured compile evidence (success or failure)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: thunder-cuda-compile-evidence
          path: work/pc-worker/thunder-cuda-compile-evidence/
          if-no-files-found: error
          retention-days: 3

      - name: Validate install closure size (< 512 MiB)
        if: success()
        run: |
          set -euo pipefail
          size=$(du -sk work/pc-worker/thunder-cuda-compile/install | awk '{print $1}')
          cap=$((512 * 1024))   # 512 MiB in KiB
          if [ "$size" -gt "$cap" ]; then
            echo "FAIL: install closure size ${size}KiB exceeds 512MiB cap"
            exit 1
          fi
          echo "install closure size ok: ${size}KiB"

      # Complete isolated candidate install closure (engine, worker, 4 helper/lock files, notices,
      # receipt) only after a real successful build. GPU/driver/model remain NOT RUN; no models/
      # whole-repo/.git/auth upload. Size capped above; inventory written by the driver.
      - name: Upload isolated install closure
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: thunder-cuda-compile-install-closure
          path: work/pc-worker/thunder-cuda-compile/install/
          if-no-files-found: error
          retention-days: 3

  # Manual, read-only artifact-audit of a prior CUDA compile/install closure. Explicitly gated to the
  # `thunder-artifact-audit` pipeline; never runs for default `validate` or the compile pipeline. It
  # does NOT recompile, download models, touch GPU/driver, or claim runtime readiness. It binds the
  # prior build run/head to explicit expected inputs (NOT the current github.sha) and fetches both
  # prior artifacts into fresh scoped runner folders via actions/download-artifact@v4. The audit
  # script itself is stdlib + static readelf only and never executes engine/relay/DSO/ldd/CUDA.
  thunder-artifact-audit:
    if: github.event.inputs.pipeline == 'thunder-artifact-audit'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    env:
      PIPELINE: thunder-artifact-audit
      # Read-only job token for the audit script's private-repo API preflight. Never printed.
      GITHUB_TOKEN: ${{ github.token }}
      # User-supplied audit inputs reach the script only via env; they are strictly validated inside
      # the script (decimal IDs, 40-hex SHA) before any API call. Never interpolated into shell.
      AUDIT_BUILD_RUN_ID: ${{ github.event.inputs.audit_build_run_id }}
      AUDIT_EVIDENCE_ARTIFACT_ID: ${{ github.event.inputs.audit_evidence_artifact_id }}
      AUDIT_INSTALL_ARTIFACT_ID: ${{ github.event.inputs.audit_install_artifact_id }}
      AUDIT_EXPECTED_HEAD_SHA: ${{ github.event.inputs.audit_expected_head_sha }}
      CANDIDATE_LOCK: 9to1 Models/Dulche Alpha/InferenceEngines/NativeStrata/prep/strata-v0.2.2-lock.candidate.json
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Validate inputs + read-only GitHub metadata (same repo/run/head, run SUCCESS, artifacts not
      # expired/names exact/under cap) + runner disk/memory budget. Fails before any fetch.
      - name: Preflight inputs + metadata + runner budget
        run: python3 .github/scripts/thunder-artifact-audit.py --preflight

      # Fetch by the VALIDATED artifact ids (not by name) from the same build run. The script's
      # preflight already proved these ids map to the exact artifacts on the exact run/head.
      - name: Fetch prior evidence artifact by id (same build run)
        uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ github.event.inputs.audit_evidence_artifact_id }}
          run-id: ${{ github.event.inputs.audit_build_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          # Single prevalidated id; merge-multiple puts the artifact's files directly in `path`
          # (otherwise the action nests them under an artifact-named subdir, which the audit
          # script's direct-root layout does not expect).
          merge-multiple: true
          path: work/pc-worker/thunder-artifact-audit/evidence

      - name: Fetch prior install-closure artifact by id (same build run)
        uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ github.event.inputs.audit_install_artifact_id }}
          run-id: ${{ github.event.inputs.audit_build_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          merge-multiple: true
          path: work/pc-worker/thunder-artifact-audit/install

      - name: Audit closure + receipt + static ELF dependency inventory (bounded)
        run: python3 .github/scripts/thunder-artifact-audit.py --audit

      - name: Upload bounded structured audit report (success or failure)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: thunder-artifact-audit-report
          path: work/pc-worker/thunder-artifact-audit-report/
          if-no-files-found: error
          retention-days: 3
