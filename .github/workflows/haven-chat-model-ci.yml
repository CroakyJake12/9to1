        with:
          name: astra-linux-native-owning-bundle-00-${{ github.sha }}
          path: artifacts/files-owning-parts/bundle-00.zip
          compression-level: 0
          if-no-files-found: error
          retention-days: 14
      - name: Retain independently bounded evidence bundle 01
