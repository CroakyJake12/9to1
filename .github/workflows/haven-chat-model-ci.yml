name: Recover exact original Maps13 failed owning artifact
on:
  workflow_dispatch:
    inputs:
      expected_commit:
        required: true
        type: string
      cut_manifest_sha256:
        required: true
        type: string
permissions:
  contents: read
  actions: read
jobs:
  recover:
    if: startsWith(github.ref, 'refs/heads/validation/astra-maps13-artifact-recovery')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
          persist-credentials: false
      - name: Fetch and validate only exact existing original artifact
        env:
          EXPECTED_COMMIT: ${{ inputs.expected_commit }}
          EXPECTED_MANIFEST_SHA: ${{ inputs.cut_manifest_sha256 }}
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/astra-maps13-original-artifact-recovery.py --expected-commit "$EXPECTED_COMMIT" --manifest .github/validation/astra-maps13-artifact-recovery-cut.json --manifest-sha "$EXPECTED_MANIFEST_SHA"
      - name: Retain small original inner logs and verified reconstruction metadata
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: astra-maps13-original-small-${{ github.sha }}
          path: |
            artifacts/maps-artifact-recovery/*.json
            artifacts/maps-artifact-recovery/*.log
            artifacts/maps-artifact-recovery/*.trx
          if-no-files-found: error
          retention-days: 14
      - name: Retain exact original ZIP part 000 independently
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: astra-maps13-original-part-000-${{ github.sha }}
          path: artifacts/maps-artifact-recovery/original-artifact.part-000.bin
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
      - name: Retain exact original ZIP part 001 independently
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: astra-maps13-original-part-001-${{ github.sha }}
          path: artifacts/maps-artifact-recovery/original-artifact.part-001.bin
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
      - name: Retain exact original ZIP part 002 independently
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: astra-maps13-original-part-002-${{ github.sha }}
          path: artifacts/maps-artifact-recovery/original-artifact.part-002.bin
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
