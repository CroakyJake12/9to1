name: Astra Canvas49 complete native owning regression resource
on:
  workflow_dispatch:
    inputs:
      expected_commit:
        required: true
        type: string
      cut_manifest_sha256:
        required: true
        type: string
permissions:
  contents: read
jobs:
  validate:
    if: startsWith(github.ref, 'refs/heads/validation/astra-canvas65-current22-')
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        cohort: [owning, regression, resource]
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_CLI_DO_NOT_USE_MSBUILD_SERVER: '1'
      DOTNET_CLI_USE_MSBUILD_SERVER: '0'
      MSBUILDDISABLENODEREUSE: '1'
      AVALONIA_TELEMETRY_OPTOUT: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
          persist-credentials: false
      - name: Materialize exact three managed dependencies
        run: |
          set -euo pipefail
          git submodule update --init --recursive -- "framework/CUI/vendor/Avalonia/external/XamlX" "framework/CUI/vendor/Avalonia/external/Avalonia.DBus" "9to1 Workspace/Terminal/Source/libvterm"
          bash "9to1 Workspace/shared/eng/prepare-cui-source.sh" --check
      - name: Materialize exact Rnote donor
        if: matrix.cohort == 'owning'
        run: git submodule update --init --depth=1 -- "9to1 Workspace/Canvas/Source/Rnote"
      - uses: dtolnay/rust-toolchain@1.98.1
        if: matrix.cohort == 'owning'
      - name: Install maintained native headless producers
        if: matrix.cohort == 'owning'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential cmake pkg-config libglib2.0-dev libcairo2-dev libpango1.0-dev librsvg2-dev xvfb xauth
          mkdir -p artifacts/canvas65-managed
          dpkg-query -W > artifacts/canvas65-managed/native-hosted-packages.txt
      - uses: actions/setup-dotnet@v4
        if: matrix.cohort != 'owning'
        with:
          global-json-file: global.json
      - name: Install and retain exact official SDK archive without executing SDK
        if: matrix.cohort == 'owning'
        run: |
          set -euo pipefail
          sdk_root="/opt/astra-canvas-sdk-10.0.301-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          sdk_archive="$RUNNER_TEMP/astra-canvas-sdk-10.0.301.tar.gz"
          test ! -e "$sdk_root"
          test ! -e "$sdk_archive"
          curl --fail --location --proto '=https' --tlsv1.2 --max-time 300 'https://builds.dotnet.microsoft.com/dotnet/Sdk/10.0.301/dotnet-sdk-10.0.301-linux-x64.tar.gz' --output "$sdk_archive"
          printf '%s  %s\n' 'cfbeec3a3a1d3ad3e168e37a77c4cc26c23125acd84a86d014047da3ecffce4c368a9acac4d7c950a047fa3d98989ce8aea69f8e5842cb6d330e8911e1c335a7' "$sdk_archive" | sha512sum --check --strict
          sudo -n mkdir "$sdk_root"
          sudo -n tar --extract --gzip --file "$sdk_archive" --directory "$sdk_root" --same-permissions --no-same-owner
          test ! -w "$sdk_root"
          echo "ASTRA_CANVAS_OFFICIAL_SDK_ROOT=$sdk_root" >> "$GITHUB_ENV"
          echo "ASTRA_CANVAS_OFFICIAL_SDK_ARCHIVE=$sdk_archive" >> "$GITHUB_ENV"
          echo "DOTNET_ROOT=$sdk_root" >> "$GITHUB_ENV"
          echo "DOTNET_MULTILEVEL_LOOKUP=0" >> "$GITHUB_ENV"
          echo "$sdk_root" >> "$GITHUB_PATH"
          mkdir -p artifacts/canvas-sdk-original
          cp "$sdk_archive" artifacts/canvas-sdk-original/official-sdk-10.0.301-linux-x64.tar.gz
      - name: Execute complete immutable cohorts
        env:
          COHORT: ${{ matrix.cohort }}
          EXPECTED_COMMIT: ${{ inputs.expected_commit }}
          EXPECTED_MANIFEST_SHA: ${{ inputs.cut_manifest_sha256 }}
        run: |
          set -euo pipefail
          if [ "$COHORT" = owning ]; then
            xvfb-run --auto-servernum --server-args="-screen 0 1280x1024x24 -nolisten tcp" python3 .github/scripts/astra-canvas65-hosted-managed.py --expected-commit "$EXPECTED_COMMIT" --manifest .github/validation/astra-canvas65-cut.json --manifest-sha "$EXPECTED_MANIFEST_SHA"
          else
            python3 ".github/scripts/astra-desktop-visible-${COHORT}.py" --expected-commit "$EXPECTED_COMMIT" --manifest .github/validation/astra-canvas65-cut.json --manifest-sha "$EXPECTED_MANIFEST_SHA"
          fi
      - name: Retain full regression/resource proof including failures
        if: ${{ always() && matrix.cohort != 'owning' }}
        uses: actions/upload-artifact@v4
        with:
          name: astra-canvas49-${{ matrix.cohort }}-${{ github.sha }}
          path: artifacts/desktop-visible-${{ matrix.cohort }}/
          if-no-files-found: error
          retention-days: 14
      - name: Bound complete native proof and complete original SDK archive separately
        if: ${{ always() && matrix.cohort == 'owning' }}
        id: nativebundles
        run: python3 .github/scripts/astra-canvas65-artifact-parts.py --input artifacts/canvas65-managed --output artifacts/canvas65-parts
      - name: Bound full official SDK originals separately
        if: ${{ always() && matrix.cohort == 'owning' }}
        id: sdkbundles
        run: python3 .github/scripts/astra-canvas65-artifact-parts.py --input artifacts/canvas-sdk-original --output artifacts/canvas-sdk-parts
      - name: Retain canvas65 complete original manifest
        if: ${{ always() && matrix.cohort == 'owning' }}
        uses: actions/upload-artifact@v4
        with:
          name: astra-canvas65-manifest-${{ github.sha }}
          path: artifacts/canvas65-parts/manifest.json
          if-no-files-found: error
          retention-days: 14
      - name: Retain bounded canvas65 part00
        if: ${{ always() && matrix.cohort == 'owning' && steps.nativebundles.outputs.count != '' && fromJSON(steps.nativebundles.outputs.count) > 0 }}
        uses: actions/upload-artifact@v4
        with:
          name: astra-canvas65-bundle-00-${{ github.sha }}
          path: artifacts/canvas65-parts/bundle-00.zip
          compression-level: 0
          if-no-files-found: error
          retention-days: 14
      - name: Retain bounded canvas65 part01
        if: ${{ always() && matrix.cohort == 'owning' && steps.nativebundles.outputs.count != '' && fromJSON(steps.nativebundles.outputs.count) > 1 }}
