      - name: Retain independently bounded evidence bundle 05
        if: ${{ always() && matrix.cohort == 'owning' && steps.bundles.outputs.count != '' && fromJSON(steps.bundles.outputs.count) > 5 }}
        uses: actions/upload-artifact@v4
        with:
          name: astra-files-owning-bundle-05-${{ github.sha }}
