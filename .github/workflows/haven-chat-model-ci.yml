name: Astra whole Models Vision Voice Root17 owning regression
on:
  workflow_dispatch:
    inputs:
      expected_commit:
        required: true
        type: string
      cut_manifest_sha256:
        required: true
        type: string
permissions:
  contents: read
jobs:
  validate:
    if: startsWith(github.ref, 'refs/heads/validation/astra-models-vision-')
    strategy:
      fail-fast: false
      matrix:
        cohort: [owning, regression, resource]
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    env:
      AVALONIA_TELEMETRY_OPTOUT: '1'
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_CLI_USE_MSBUILD_SERVER: '0'
      DOTNET_CLI_DO_NOT_USE_MSBUILD_SERVER: '1'
      MSBUILDDISABLENODEREUSE: '1'
      DOTNET_SKIP_FIRST_TIME_EXPERIENCE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
          persist-credentials: false
      - name: Materialize only three exact source dependencies
        run: |
          set -euo pipefail
          git submodule update --init --recursive -- "framework/CUI/vendor/Avalonia/external/XamlX" "framework/CUI/vendor/Avalonia/external/Avalonia.DBus" "9to1 Workspace/Terminal/Source/libvterm"
          bash "9to1 Workspace/shared/eng/prepare-cui-source.sh" --check
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Validate whole immutable source tree
        env:
          EXPECTED_COMMIT: ${{ inputs.expected_commit }}
          EXPECTED_MANIFEST_SHA: ${{ inputs.cut_manifest_sha256 }}
          COHORT: ${{ matrix.cohort }}
        run: python3 ".github/scripts/astra-models-vision-${COHORT}.py" --expected-commit "$EXPECTED_COMMIT" --manifest .github/validation/astra-models-vision-cut.json --manifest-sha "$EXPECTED_MANIFEST_SHA"
      - name: Retain complete original evidence including failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: astra-models-vision-${{ matrix.cohort }}-${{ github.sha }}
          path: artifacts/models-vision-${{ matrix.cohort }}
          if-no-files-found: error
          retention-days: 14

  windows-owning:
    if: startsWith(github.ref, 'refs/heads/validation/astra-monologue-windows-')
    runs-on: windows-2025
    timeout-minutes: 100
    env:
      COHORT: owning
      AVALONIA_TELEMETRY_OPTOUT: '1'
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_CLI_USE_MSBUILD_SERVER: '0'
      DOTNET_CLI_DO_NOT_USE_MSBUILD_SERVER: '1'
      MSBUILDDISABLENODEREUSE: '1'
      DOTNET_SKIP_FIRST_TIME_EXPERIENCE: '1'
    steps:
      - name: Preserve exact Git source and cut bytes on this disposable Windows runner
        shell: pwsh
        run: |
          git config --global core.autocrlf false
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git config --global core.eol lf
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git config --global --get core.autocrlf
          git config --global --get core.eol
      - uses: actions/checkout@v4
        with:
          submodules: false
          persist-credentials: false
      - name: Retain actual checkout byte contract before immutable runner admission
        shell: pwsh
        env:
          EXPECTED_MANIFEST_SHA: ${{ inputs.cut_manifest_sha256 }}
        run: |
          New-Item -ItemType Directory -Force -Path artifacts/models-vision-windows-owning | Out-Null
          $actual = (Get-FileHash -Algorithm SHA256 .github/validation/astra-models-vision-cut.json).Hash.ToLowerInvariant()
          $blob = git rev-parse HEAD:.github/validation/astra-models-vision-cut.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          @{ expectedSha256=$env:EXPECTED_MANIFEST_SHA; actualSha256=$actual; gitBlob=$blob; coreAutocrlf=(git config --get core.autocrlf); coreEol=(git config --get core.eol) } | ConvertTo-Json | Set-Content -Encoding utf8 artifacts/models-vision-windows-owning/checkout-byte-contract.json
      - name: Materialize exact three maintained source dependencies
        shell: bash
        run: |
          set -euo pipefail
          git submodule update --init --recursive -- "framework/CUI/vendor/Avalonia/external/XamlX" "framework/CUI/vendor/Avalonia/external/Avalonia.DBus" "9to1 Workspace/Terminal/Source/libvterm"
          bash "9to1 Workspace/shared/eng/prepare-cui-source.sh" --check
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Validate genuine Windows SDK voice and full owning cohorts
        shell: pwsh
        env:
          EXPECTED_COMMIT: ${{ inputs.expected_commit }}
          EXPECTED_MANIFEST_SHA: ${{ inputs.cut_manifest_sha256 }}
        run: python ".github/scripts/astra-monologue-windows-owning.py" --expected-commit "$env:EXPECTED_COMMIT" --manifest .github/validation/astra-models-vision-cut.json --manifest-sha "$env:EXPECTED_MANIFEST_SHA"
      - name: Preserve bounded exact original Windows artifact parts
        if: always()
        id: windows-bundles
        shell: pwsh
        run: python .github/scripts/astra-monologue-windows-artifact-parts.py --input artifacts/models-vision-windows-owning --output artifacts/monologue-windows-owning-parts
      - name: Retain full original Windows part manifest
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: astra-monologue-windows-owning-index-${{ github.sha }}
          path: artifacts/monologue-windows-owning-parts/manifest.json
          if-no-files-found: error
          retention-days: 14
      - name: Retain bounded original Windows bundle 00
        if: ${{ always() && steps.windows-bundles.outputs.count != '' && fromJSON(steps.windows-bundles.outputs.count) > 0 }}
        uses: actions/upload-artifact@v4
        with:
          name: astra-monologue-windows-owning-part-00-${{ github.sha }}
          path: artifacts/monologue-windows-owning-parts/bundle-00.zip
          compression-level: 0
          if-no-files-found: error
          retention-days: 14
      - name: Retain bounded original Windows bundle 01
