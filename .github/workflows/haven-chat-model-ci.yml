name: Astra immutable managed follow-up
on:
  workflow_dispatch:
    inputs:
      expected_commit:
        required: true
        type: string
      cut_manifest_sha256:
        required: true
        type: string
permissions:
  contents: read
jobs:
  validate:
    if: startsWith(github.ref, 'refs/heads/validation/astra-canvas65-')
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      AVALONIA_TELEMETRY_OPTOUT: '1'
      DOTNET_CLI_DO_NOT_USE_MSBUILD_SERVER: '1'
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_CLI_USE_MSBUILD_SERVER: '0'
      MSBUILDDISABLENODEREUSE: '1'
      DOTNET_SKIP_FIRST_TIME_EXPERIENCE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
          persist-credentials: false
      - name: Materialize only three pinned managed source dependencies
        shell: bash
        run: |
          set -euo pipefail
          git submodule update --init --recursive -- \
            "framework/CUI/vendor/Avalonia/external/XamlX" \
            "framework/CUI/vendor/Avalonia/external/Avalonia.DBus" \
            "9to1 Workspace/Terminal/Source/libvterm"
          bash "9to1 Workspace/shared/eng/prepare-cui-source.sh" --check
      - name: Materialize separately approved exact Rnote donor
        run: git submodule update --init --depth=1 -- "9to1 Workspace/Canvas/Source/Rnote"
      - uses: dtolnay/rust-toolchain@1.98.1
      - name: Install existing native headless donor dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential cmake pkg-config libglib2.0-dev libcairo2-dev libpango1.0-dev librsvg2-dev
          dpkg-query -W > native-hosted-packages.txt
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Verify immutable source and run bounded managed suites
        env:
          EXPECTED_COMMIT: ${{ inputs.expected_commit }}
          EXPECTED_MANIFEST_SHA: ${{ inputs.cut_manifest_sha256 }}
        run: python3 .github/scripts/astra-canvas65-hosted-managed.py --expected-commit "$EXPECTED_COMMIT" --manifest .github/validation/astra-canvas65-cut.json --manifest-sha "$EXPECTED_MANIFEST_SHA"
      - name: Freeze bounded independently verifiable evidence bundles
        id: bundles
        if: always()
        run: |
          test ! -f native-hosted-packages.txt || cp native-hosted-packages.txt artifacts/canvas65-managed/
          python3 .github/scripts/astra-canvas65-artifact-parts.py --input artifacts/canvas65-managed --output artifacts/canvas65-parts
      - name: Retain fullfile and independent bundle manifest
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: astra-canvas65-manifest-${{ github.sha }}
          path: artifacts/canvas65-parts/manifest.json
          if-no-files-found: error
          retention-days: 14
      - name: Retain independently bounded evidence bundle 00
        if: ${{ always() && steps.bundles.outputs.count != '' && fromJSON(steps.bundles.outputs.count) > 0 }}
        uses: actions/upload-artifact@v4
        with:
          name: astra-canvas65-bundle-00-${{ github.sha }}
          path: artifacts/canvas65-parts/bundle-00.zip
          compression-level: 0
          if-no-files-found: error
          retention-days: 14
      - name: Retain independently bounded evidence bundle 01
        if: ${{ always() && steps.bundles.outputs.count != '' && fromJSON(steps.bundles.outputs.count) > 1 }}
        uses: actions/upload-artifact@v4
        with:
          name: astra-canvas65-bundle-01-${{ github.sha }}
          path: artifacts/canvas65-parts/bundle-01.zip
          compression-level: 0
          if-no-files-found: error
          retention-days: 14
      - name: Retain independently bounded evidence bundle 02
