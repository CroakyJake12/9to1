name: Picture isolated read-only host preconditions
on:
  workflow_dispatch:
    inputs:
      expected_commit:
        required: true
        type: string
      cut_manifest_sha256:
        required: true
        type: string
permissions:
  contents: read
jobs:
  preconditions:
    if: startsWith(github.ref, 'refs/heads/validation/astra-picture-preconditions-')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
          persist-credentials: false
      - name: Retain exact official distro prerequisites without upgrades
        run: |
          set -euo pipefail
          mkdir -p artifacts/picture-preconditions/package-provenance
          missing=()
          command -v bwrap >/dev/null || missing+=(bubblewrap)
          command -v apparmor_parser >/dev/null || missing+=(apparmor-utils)
          command -v aa-status >/dev/null || missing+=(apparmor-utils)
          sudo -n cat /sys/kernel/security/apparmor/profiles >artifacts/picture-preconditions/package-provenance/loaded-profiles-before.txt
          if (( ${#missing[@]} )); then
            sudo apt-get update >artifacts/picture-preconditions/package-provenance/apt-update.log 2>&1
            sudo apt-get install --no-upgrade --no-install-recommends -y "${missing[@]}" >artifacts/picture-preconditions/package-provenance/apt-install.log 2>&1
          fi
          sudo -n cat /sys/kernel/security/apparmor/profiles >artifacts/picture-preconditions/package-provenance/loaded-profiles-after.txt
          cmp artifacts/picture-preconditions/package-provenance/loaded-profiles-before.txt artifacts/picture-preconditions/package-provenance/loaded-profiles-after.txt
          dpkg-query -W -f='${Package} ${Version} ${Architecture}\n' bubblewrap apparmor >artifacts/picture-preconditions/package-provenance/versions.txt
          while read -r package version architecture; do
            (cd artifacts/picture-preconditions/package-provenance && apt-get download "${package}=${version}")
            apt-cache show "${package}=${version}" >>artifacts/picture-preconditions/package-provenance/official-package-index.txt
          done <artifacts/picture-preconditions/package-provenance/versions.txt
          sha256sum artifacts/picture-preconditions/package-provenance/*.deb >artifacts/picture-preconditions/package-provenance/archive-sha256.txt
          cp /usr/share/doc/bubblewrap/copyright artifacts/picture-preconditions/package-provenance/bubblewrap-copyright.txt
          cp /usr/share/doc/apparmor/copyright artifacts/picture-preconditions/package-provenance/apparmor-copyright.txt
      - name: Observe genuine host preconditions without build or policy changes
        env:
          EXPECTED_COMMIT: ${{ inputs.expected_commit }}
          EXPECTED_MANIFEST_SHA: ${{ inputs.cut_manifest_sha256 }}
        run: python3 .github/scripts/astra-picture-fast-preconditions.py --expected-commit "$EXPECTED_COMMIT" --manifest .github/validation/astra-picture-preconditions-cut.json --manifest-sha "$EXPECTED_MANIFEST_SHA"
      - name: Retain actual read-only observations including failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: astra-picture-preconditions-${{ github.sha }}
          path: artifacts/picture-preconditions
          if-no-files-found: error
          retention-days: 14
