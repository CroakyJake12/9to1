name: Astra Mail canonical Files full native owning regression resource trusted TLS
on:
  workflow_dispatch:
    inputs:
      expected_commit:
        required: true
        type: string
      cut_manifest_sha256:
        required: true
        type: string
permissions:
  contents: read
jobs:
  validate:
    if: startsWith(github.ref, 'refs/heads/validation/astra-desktop-visible-mail30-root22-') || startsWith(github.ref, 'refs/heads/validation/astra-desktop-visible-joint05-root30-')
    strategy:
      fail-fast: false
      matrix:
        cohort: [owning, regression, resource]
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    env:
      AVALONIA_TELEMETRY_OPTOUT: '1'
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_CLI_USE_MSBUILD_SERVER: '0'
      DOTNET_CLI_DO_NOT_USE_MSBUILD_SERVER: '1'
      MSBUILDDISABLENODEREUSE: '1'
      DOTNET_SKIP_FIRST_TIME_EXPERIENCE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
          persist-credentials: false
      - name: Materialize only three exact source dependencies
        run: |
          set -euo pipefail
          git submodule update --init --recursive -- "framework/CUI/vendor/Avalonia/external/XamlX" "framework/CUI/vendor/Avalonia/external/Avalonia.DBus" "9to1 Workspace/Terminal/Source/libvterm"
          bash "9to1 Workspace/shared/eng/prepare-cui-source.sh" --check
      - name: Materialize exact original Canvas and Picture renderer donors for owning journeys
        if: matrix.cohort == 'owning'
        run: git submodule update --init --depth=1 -- "9to1 Workspace/Canvas/Source/Rnote" "9to1 Workspace/Picture/Source/glycin"
      - uses: dtolnay/rust-toolchain@1.98.1
        if: matrix.cohort == 'owning'
      - name: Provision maintained headless native renderer prerequisites only
        if: matrix.cohort == 'owning'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential cmake pkg-config libglib2.0-dev libcairo2-dev libpango1.0-dev librsvg2-dev libseccomp-dev liblcms2-dev libxml2-dev libfontconfig1-dev bubblewrap apparmor-utils fonts-dejavu-core xvfb xauth openssl ca-certificates openjdk-21-jre-headless libwebkit2gtk-4.1-0
          mkdir -p artifacts/desktop-visible-owning
          dpkg-query -W > artifacts/desktop-visible-owning/native-hosted-packages.txt
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Validate identical joined program
        env:
          EXPECTED_COMMIT: ${{ inputs.expected_commit }}
          EXPECTED_MANIFEST_SHA: ${{ inputs.cut_manifest_sha256 }}
          COHORT: ${{ matrix.cohort }}
        run: |
          set -euo pipefail
          if [ "${{ matrix.cohort }}" = "owning" ]; then
            python3 .github/scripts/astra-mail-trusted-tls.py -- xvfb-run --auto-servernum --server-args="-screen 0 1280x1024x24 -nolisten tcp" python3 .github/scripts/astra-files-ephemeral-profile.py --expected-commit "$EXPECTED_COMMIT" --manifest .github/validation/astra-desktop-visible-cut.json --manifest-sha "$EXPECTED_MANIFEST_SHA"
          else
            python3 ".github/scripts/astra-desktop-visible-${COHORT}.py" --expected-commit "$EXPECTED_COMMIT" --manifest .github/validation/astra-desktop-visible-cut.json --manifest-sha "$EXPECTED_MANIFEST_SHA"
          fi
      - name: Retain ordinary regression/resource evidence including failure
        if: ${{ always() && matrix.cohort != 'owning' }}
        uses: actions/upload-artifact@v4
        with:
          name: astra-desktop-visible-${{ matrix.cohort }}-${{ github.sha }}
          path: artifacts/desktop-visible-${{ matrix.cohort }}
          if-no-files-found: error
          retention-days: 14

      - name: Freeze bounded independently verifiable evidence bundles
        id: bundles
        if: ${{ always() && matrix.cohort == 'owning' }}
        run: |
          test ! -f native-hosted-packages.txt || cp native-hosted-packages.txt artifacts/desktop-visible-owning/
          python3 .github/scripts/astra-files-artifact-parts.py --input artifacts/desktop-visible-owning --output artifacts/files-owning-parts
      - name: Retain fullfile and independent bundle manifest
        if: ${{ always() && matrix.cohort == 'owning' }}
        uses: actions/upload-artifact@v4
        with:
          name: astra-files-owning-manifest-${{ github.sha }}
          path: artifacts/files-owning-parts/manifest.json
          if-no-files-found: error
          retention-days: 14
      - name: Retain independently bounded evidence bundle 00
        if: ${{ always() && matrix.cohort == 'owning' && steps.bundles.outputs.count != '' && fromJSON(steps.bundles.outputs.count) > 0 }}
        uses: actions/upload-artifact@v4
        with:
          name: astra-files-owning-bundle-00-${{ github.sha }}
          path: artifacts/files-owning-parts/bundle-00.zip
          compression-level: 0
          if-no-files-found: error
          retention-days: 14
      - name: Retain independently bounded evidence bundle 01
        if: ${{ always() && matrix.cohort == 'owning' && steps.bundles.outputs.count != '' && fromJSON(steps.bundles.outputs.count) > 1 }}
        uses: actions/upload-artifact@v4
        with:
          name: astra-files-owning-bundle-01-${{ github.sha }}
          path: artifacts/files-owning-parts/bundle-01.zip
          compression-level: 0
          if-no-files-found: error
          retention-days: 14
      - name: Retain independently bounded evidence bundle 02
        if: ${{ always() && matrix.cohort == 'owning' && steps.bundles.outputs.count != '' && fromJSON(steps.bundles.outputs.count) > 2 }}
        uses: actions/upload-artifact@v4
        with:
          name: astra-files-owning-bundle-02-${{ github.sha }}
          path: artifacts/files-owning-parts/bundle-02.zip
          compression-level: 0
          if-no-files-found: error
          retention-days: 14
      - name: Retain independently bounded evidence bundle 03
        if: ${{ always() && matrix.cohort == 'owning' && steps.bundles.outputs.count != '' && fromJSON(steps.bundles.outputs.count) > 3 }}
        uses: actions/upload-artifact@v4
        with:
          name: astra-files-owning-bundle-03-${{ github.sha }}
          path: artifacts/files-owning-parts/bundle-03.zip
          compression-level: 0
          if-no-files-found: error
          retention-days: 14
      - name: Retain independently bounded evidence bundle 04
        if: ${{ always() && matrix.cohort == 'owning' && steps.bundles.outputs.count != '' && fromJSON(steps.bundles.outputs.count) > 4 }}
        uses: actions/upload-artifact@v4
