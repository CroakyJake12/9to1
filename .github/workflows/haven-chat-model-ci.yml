# FILE DOCUMENTATION
# Where: .github/workflows/haven-chat-model-ci.yml in the GitHub automation configuration used by continuous integration.
# What: This file automates or configures the repository operation described by its commands and keys.
# How: Read from top to bottom: inputs and environment first, validation/processing next, and explicit success or failure output last.
# Why: The file keeps one cohesive responsibility in a predictable location so callers can find and replace it without unrelated changes.
name: Haven Chat and Model Pass

on:
  workflow_dispatch:
    inputs:
      expected_commit:
        description: Exact validation commit (local runtime job only)
        required: false
        default: ''
        type: string
      cut_manifest_sha256:
        description: Exact immutable validation cut SHA256 (local runtime job only)
        required: false
        default: ''
        type: string

permissions:
  contents: read

jobs:
  validate:
    if: ${{ !contains(github.ref, 'refs/heads/validation/astra-cake-id-local-runtime') }}
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore "9to1 Workspace/shared/Haven.sln"

      - name: Build Debug
        run: dotnet build "9to1 Workspace/shared/Haven.sln" -c Debug --no-restore

      - name: Test Debug
        run: dotnet test "9to1 Workspace/shared/Haven.sln" -c Debug --no-build

      - name: Build automation worker
        run: dotnet build "9to1 Workspace/shared/src/Haven.AutomationWorker/Haven.AutomationWorker.csproj" -c Debug --no-restore

      - name: Upload source snapshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: haven-source-snapshot
          path: |
            .
            !**/bin/**
            !**/obj/**
            !.git/**
          include-hidden-files: true
          retention-days: 3

  cake-id-local-runtime:
    if: startsWith(github.ref, 'refs/heads/validation/astra-cake-id-local-runtime')
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Actual maintained local-only Worker and D1 runtime
        env:
          WRANGLER_SEND_METRICS: 'false'
          EXPECTED_COMMIT: ${{ inputs.expected_commit }}
          CUT_MANIFEST_SHA256: ${{ inputs.cut_manifest_sha256 }}
        run: python3 .github/scripts/astra-cake-id-local-runtime.py
      - name: Retain bounded source and command evidence only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cake-id-local-runtime-evidence
          path: artifacts/cake-id-local-runtime
          if-no-files-found: error
