name: Recover exact existing ARM provider without engine compilation
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: recover-pinned-arm-provider-39698883180
  cancel-in-progress: false
jobs:
  recover:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4, verified 2026-10-22
        with:
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /.github/scripts/native16-arm64/
            /9to1 Workspace/Home/Source/Dulche/bundle/arm64-runtime-bundle-spec.json
      - name: Data-only recovery regressions
        run: python3 -m unittest discover -s .github/scripts/native16-arm64 -p test_provider_recovery.py -v
      - name: Recover only exact pinned engine, notices and provenance from original immutable package
        id: recover
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/native16-arm64/recover-pinned-provider.py --output "${{ runner.temp }}/recovered-arm-provider"
      - name: Retain verified data-only provider behind existing authenticated Actions access
        if: ${{ success() && steps.recover.outcome == 'success' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4, verified 2026-10-22
        with:
          name: 9to1-recovered-b10809-arm64-bookworm-provider
          path: ${{ runner.temp }}/recovered-arm-provider/provider/
          retention-days: 14
          if-no-files-found: error
      - name: Preserve bounded recovery diagnostics even on failure
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4, verified 2026-10-22
        with:
          name: 9to1-recovered-provider-evidence
          path: |
            ${{ runner.temp }}/recovered-arm-provider/deb-read.stderr.log
            ${{ runner.temp }}/recovered-arm-provider/provider/provider-recovery.json
            ${{ runner.temp }}/recovered-arm-provider/provider/SHA256SUMS
          retention-days: 14
          if-no-files-found: warn
