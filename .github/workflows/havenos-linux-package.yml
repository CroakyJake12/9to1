# Private review proposal: replace this EXISTING dispatchable workflow only on
# a dedicated preview branch, preserving main. No 9to1 application/vendor build.
name: 9to1 pinned CPU engine ARM64 compatibility
on:
  workflow_dispatch:
    inputs:
      debian_base:
        description: Older native build ABI; use bookworm only if actual bullseye compiler fails or target permits2.36
        type: choice
        required: true
        default: bookworm
        options:
          - bullseye
          - bookworm
permissions:
  contents: read
jobs:
  pinned-engine-native-arm64:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 45
    container:
      image: ${{ inputs.debian_base == 'bookworm' && 'debian@sha256:991827bb788d78bbc130dcb851913beecff43296360f48838aca7cbdfae4375c' || 'debian@sha256:29e60bc6b8355ce47307cecadb843f25c9a1ee332ed8458039cc435262677bdc' }}
    env:
      DEBIAN_FRONTEND: noninteractive
      PREVIEW_DEBIAN_BASE: ${{ inputs.debian_base }}
    steps:
      - name: Install native build tools in disposable older Debian
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -m)" = aarch64
          test "$(dpkg --print-architecture)" = arm64
          apt-get update
          apt-get install -y --no-install-recommends build-essential cmake ninja-build git ca-certificates python3 binutils curl
      - name: Checkout ONLY reviewed infra scripts (no application/vendor dependency)
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: eng/preview-arm64
          sparse-checkout-cone-mode: true
          fetch-depth: 1
      - name: Build exact official CPU source, inspect closure, real local HTTP smoke
        shell: bash
        run: bash eng/preview-arm64/build-pinned-engine.sh
      - name: Retain binary, exact source/model/licence/build/HTTP evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: 9to1-llamacpp-b10809-arm64-${{ inputs.debian_base }}
          path: engine-artifact/
          if-no-files-found: error
          retention-days: 1

  official-prebuilt-native-arm64-baseline:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    steps:
      - name: Checkout bounded smoke scripts only
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: eng/preview-arm64
          sparse-checkout-cone-mode: true
          fetch-depth: 1
      - name: Official exact-pin ARM CPU baseline, genuine prompt/stream/cancel
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -m)" = aarch64
          mkdir -p engine-artifact/evidence
          python3 eng/preview-arm64/prebuilt-baseline.py
      - name: Retain actual official-baseline evidence only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: 9to1-official-b10809-native-arm64-baseline
          path: engine-artifact/
          if-no-files-found: error
          retention-days: 1
