# Proposal only: Root reviews, pushes and dispatches. No engine rebuild or HTTP fallback.
name: Dulche exact Bookworm ARM64 AF_UNIX engine check
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  native-afunix:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          submodules: false
          persist-credentials: false
      - name: Require native ARM and identify exact source
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -m)" = aarch64
          test "$(dpkg --print-architecture)" = arm64
          mkdir -p evidence
          git rev-parse HEAD > evidence/workflow-source-commit.txt
          uname -a > evidence/platform.txt
          getconf GNU_LIBC_VERSION >> evidence/platform.txt
      - name: Identify verified artifact (no substitution or rebuild)
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh api repos/CroakyJake12/9to1/actions/artifacts/12328502225 > evidence/source-artifact.json
          python3 - <<'PY'
          import json
          x=json.load(open('evidence/source-artifact.json'))
          assert x['id']==12328502225 and x['name']=='9to1-llamacpp-b10809-arm64-bookworm'
          assert not x['expired'] and x['workflow_run']['id']==39562111673
          assert x['digest']=='sha256:b596f767158d3a53de226bed35cf498d07f485e00da0cd4649331db988affa18'
          PY
      - uses: actions/download-artifact@v4
        with:
          name: 9to1-llamacpp-b10809-arm64-bookworm
          path: verified-bookworm-artifact
          github-token: ${{ github.token }}
          repository: CroakyJake12/9to1
          run-id: 39562111673
      - name: Actual AF_UNIX peer/model/readiness and product-equivalent probes
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/dulche-afunix/smoke-afunix.py --artifact verified-bookworm-artifact --output evidence/afunix
      - name: Retain bounded actual evidence (no model weights or second binary copy)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dulche-bookworm-arm64-afunix-evidence
          path: |
            evidence/
            !evidence/afunix/*.gguf
            !evidence/afunix/engine/
          if-no-files-found: error
          retention-days: 1
