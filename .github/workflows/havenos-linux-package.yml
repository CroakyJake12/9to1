# Root-reviewed isolated source-only preview branch; never merges to main.
name: 9to1 lesson ARM64 owned startup and real Home acceptance
on:
  workflow_dispatch:
    inputs:
      upload_draft_asset:
        description: Also upload NEW native package to existing INTERNAL unpublished draft
        type: boolean
        required: true
        default: false
permissions:
  contents: read
concurrency:
  group: arm64-candidate-${{ github.sha }}
  cancel-in-progress: false
jobs:
  native-arm64:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 90
    # Needed only for the explicit optional same-repo unpublished draft asset upload.
    permissions:
      contents: write
      actions: read
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_SKIP_FIRST_TIME_EXPERIENCE: '1'
      NATIVE_DOTNET_VERSION: '10.0.301'
      PREVIEW_INPUT_CACHE: ${{ runner.temp }}/9to1-pinned-inputs
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4, verified 2026-10-22
        with:
          fetch-depth: 16
          submodules: false
          persist-credentials: false
      - name: Initialize only exact approved source dependencies
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -m)" = aarch64
          test "$(dpkg --print-architecture)" = arm64
          mkdir evidence
          echo "NUGET_PACKAGES=$RUNNER_TEMP/9to1-native16-nuget" >> "$GITHUB_ENV"
          uname -a > evidence/native-platform.txt
          cat /etc/os-release >> evidence/native-platform.txt
          getconf GNU_LIBC_VERSION >> evidence/native-platform.txt
          git submodule update --init --recursive --depth 1 -- framework/CUI/vendor/Avalonia/external/XamlX framework/CUI/vendor/Avalonia/external/Avalonia.DBus
          git submodule status --recursive -- framework/CUI/vendor/Avalonia/external/XamlX framework/CUI/vendor/Avalonia/external/Avalonia.DBus > evidence/source-submodule-pins.txt
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4, verified 2026-10-22
        with:
          dotnet-version: ${{ env.NATIVE_DOTNET_VERSION }}
      - name: Install native runtime and display dependencies on disposable runner
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends binutils file gnupg ubuntu-keyring libfontconfig1 libfreetype6 libx11-6 libxext6 libxrandr2 libxi6 libxcursor1 libice6 libsm6 libgl1 libegl1 libdbus-1-3 libgomp1 libicu74 libssl3t64 zlib1g xvfb openbox wmctrl xdotool x11-utils imagemagick dbus-x11 at-spi2-core python3-pyatspi python3-yaml tesseract-ocr fonts-dejavu-core
          dotnet --info > evidence/dotnet-info.txt
          dpkg-query -W -f='${Package} ${Version} ${Architecture}\n' > evidence/runner-package-versions.txt
      - name: Fail early on incomplete native runner or stale source inputs
        run: python3 .github/scripts/native16-arm64/pipeline-preflight.py
      - name: Fast pipeline regressions before acquisition or normal product build
        shell: bash
        run: |
          set -euo pipefail
          /usr/bin/python3 -m unittest discover -s .github/scripts/native16-arm64 -p 'test*.py' -v > evidence/pipeline-unit-tests.log 2>&1
          /usr/bin/python3 -m unittest discover -s .github/scripts/native16-arm64 -p '*_test.py' -v > evidence/browser-preflight-unit-tests.log 2>&1
          /usr/bin/python3 -m unittest discover -s .github/scripts/native16-arm64/chromium-native -p 'test*.py' -v > evidence/chromium-supplier-unit-tests.log 2>&1
      - name: Restore immutable package for this exact source, SDK and native environment
        id: package-cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4, verified 2026-10-22
        with:
          path: ${{ runner.temp }}/9to1-native16-arm64-source/package
          key: arm64-package-v1-${{ github.sha }}-${{ env.NATIVE_DOTNET_VERSION }}-${{ env.PIPELINE_ENVIRONMENT_SHA }}
      - name: Independently recheck cached package byte identity and original input provenance
        if: ${{ steps.package-cache.outputs.cache-hit == 'true' }}
        run: >-
          python3 .github/scripts/native16-arm64/immutable-package-cache.py
          --mode restore --directory "${{ runner.temp }}/9to1-native16-arm64-source/package"
      - name: Restore NuGet inputs for this SDK and dependency graph
        if: ${{ steps.package-cache.outputs.cache-hit != 'true' }}
        id: nuget-cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4, verified 2026-10-22
        with:
          path: ${{ env.NUGET_PACKAGES }}
          key: arm64-nuget-10.0.301-${{ hashFiles('global.json', 'Directory.Build.*', '**/*.csproj', '**/packages.lock.json', '**/NuGet.Config', '**/NuGet.config') }}
      - name: Restore byte-pinned engine, model and license inputs
        id: inference-cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4, verified 2026-10-22
        with:
          path: ${{ env.PREVIEW_INPUT_CACHE }}
          key: arm64-inputs-v1-b596f767158d3a53de226bed35cf498d07f485e00da0cd4649331db988affa18-1c15a88244c9e852516e5ba0e394fc97f2182f1f2757413fb99fe6a9214c033b-832dd9e00a68dd83b3c3fb9f5588dad7dcf337a0db50f7d9483f310cd292e92e
      - name: Export exact corresponding source (before generated outputs)
        run: python3 .github/scripts/native16-arm64/export-corresponding-source.py
      - name: Validate exact same-repository Bookworm artifact identity
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          python3 .github/scripts/native16-arm64/inference_stage.py
          --validate-artifact-only evidence/bookworm-artifact-metadata.json
          --provider-zip "${{ runner.temp }}/9to1-pinned-bookworm-provider.zip"
          --provider-cache "${{ env.PREVIEW_INPUT_CACHE }}/bookworm"
      - name: Extract the exact verified provider ZIP without downloading it a second time
        run: >-
          python3 .github/scripts/native16-arm64/inference_stage.py
          --extract-provider-zip "${{ runner.temp }}/9to1-pinned-bookworm-provider.zip"
          --artifact-root "${{ runner.temp }}/9to1-pinned-bookworm-artifact"
      - name: Verify pinned engine and model then prepare canonical data-only package stage
        run: >-
          python3 .github/scripts/native16-arm64/inference_stage.py
          --artifact-root "${{ runner.temp }}/9to1-pinned-bookworm-artifact"
          --artifact-metadata evidence/bookworm-artifact-metadata.json
          --output-root "${{ runner.temp }}/9to1-preview-inference"
      - name: Save only successfully verified immutable inference inputs before product tests
        if: ${{ steps.inference-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4, verified 2026-10-22
        with:
          path: ${{ env.PREVIEW_INPUT_CACHE }}
          key: ${{ steps.inference-cache.outputs.cache-primary-key }}
      - name: Restore browser source and package inputs for the exact reviewed pins
        id: browser-cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4, verified 2026-10-22
        with:
          path: |
            ${{ runner.temp }}/9to1-browser-evidence/source
            ${{ runner.temp }}/9to1-browser-evidence/chromium-debs
            ${{ runner.temp }}/9to1-browser-evidence/providers
          key: arm64-noble-browser-inputs-${{ hashFiles('.github/scripts/native16-arm64/chromium-native/chromium-pinned-manifest.json', '.github/scripts/native16-arm64/chromium-native/source-pins.json', '.github/scripts/native16-arm64/chromium-native/chromium-soname-resolution.json') }}
      - name: Provision authenticated Ubuntu trust anchor for browser provider proof
        shell: bash
        run: |
          set -euo pipefail
          d="${{ runner.temp }}/9to1-browser-ubuntu"
          mkdir -p "$d"
          curl -fsSL https://ports.ubuntu.com/ubuntu-ports/dists/noble/InRelease -o "$d/InRelease"
          cp /usr/share/keyrings/ubuntu-archive-keyring.gpg "$d/ubuntu-archive-keyring.gpg"
          test -s "$d/InRelease"
          echo "BROWSER_INRELEASE=$d/InRelease" >> "$GITHUB_ENV"
          echo "BROWSER_KEYRING=$d/ubuntu-archive-keyring.gpg" >> "$GITHUB_ENV"
      - name: Acquire, stage and statically verify bundled Chromium browser supply
        shell: bash
        run: |
          set -euo pipefail
          e="${{ runner.temp }}/9to1-browser-evidence"
          python3 .github/scripts/native16-arm64/browser-supply-ci.py \
            --evidence-dir "$e" \
            --stage-out "${{ runner.temp }}/9to1-browser-stage" \
            --provider-cache "$e/providers" \
            --inrelease "$BROWSER_INRELEASE" \
            --keyring "$BROWSER_KEYRING" \
            --sidecar "${{ runner.temp }}/9to1-browser-sidecar" \
            --env-file "$GITHUB_ENV"
      - name: Save browser inputs only after signed acquisition and full ABI verification
        if: ${{ steps.browser-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4, verified 2026-10-22
        with:
          path: |
            ${{ runner.temp }}/9to1-browser-evidence/source
            ${{ runner.temp }}/9to1-browser-evidence/chromium-debs
            ${{ runner.temp }}/9to1-browser-evidence/providers
          key: ${{ steps.browser-cache.outputs.cache-primary-key }}
      - name: Build host tools and full normal ARM product graph then assemble NEW internal package
        if: ${{ steps.package-cache.outputs.cache-hit != 'true' }}
        run: python3 .github/scripts/native16-arm64/build-native-arm64.py
      - name: Save NuGet downloads after normal graph build and before native acceptance
        if: ${{ steps.package-cache.outputs.cache-hit != 'true' && steps.nuget-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4, verified 2026-10-22
        with:
          path: ${{ env.NUGET_PACKAGES }}
          key: ${{ steps.nuget-cache.outputs.cache-primary-key }}
      - name: Install exact newly built package
        shell: bash
        run: |
          set -euo pipefail
          test "$(dpkg-deb --field "$PREVIEW_DEB" Architecture)" = arm64
          sha256sum "$PREVIEW_DEB" > evidence/native-package.sha256
          python3 - <<'PYVERIFY'
          import os,json,pathlib,hashlib
          package=pathlib.Path(os.environ['PREVIEW_DEB'])
          receipt=json.loads((pathlib.Path(os.environ['PREVIEW_PACKAGE_DIR'])/'package-receipt.json').read_text())
          with package.open('rb') as stream:
              digest=hashlib.file_digest(stream,'sha256').hexdigest()
          assert digest==receipt['sha256'] and package.stat().st_size==receipt['bytes']
          assert receipt['source_head']==os.environ['GITHUB_SHA'] and receipt['architecture']=='arm64'
          pathlib.Path('evidence/new-package-identity-verified.json').write_text(json.dumps({'source_head':receipt['source_head'],'package_sha256':digest,'bytes':package.stat().st_size,'architecture':'arm64'},indent=2))
          PYVERIFY
          sudo apt-get install -y --no-install-recommends "$PREVIEW_DEB"
          file /opt/9to1-preview/Haven > evidence/apphost-file.txt
          ldd /opt/9to1-preview/Haven > evidence/apphost-ldd.txt
          ! grep -F 'not found' evidence/apphost-ldd.txt
      - name: Record original package inputs after actual installation, before native acceptance
        if: ${{ steps.package-cache.outputs.cache-hit != 'true' }}
        run: >-
          python3 .github/scripts/native16-arm64/immutable-package-cache.py
          --mode record --directory "${{ runner.temp }}/9to1-native16-arm64-source/package"
      - name: Save verified build and installation artifact without implying native acceptance
        if: ${{ steps.package-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4, verified 2026-10-22
        with:
          path: ${{ runner.temp }}/9to1-native16-arm64-source/package
          key: ${{ steps.package-cache.outputs.cache-primary-key }}
      - name: Fresh-profile native welcome setup, Home and normal close
        id: startup
        continue-on-error: true
        timeout-minutes: 10
        shell: bash
        run: |
          set -euo pipefail
          dbus-run-session -- xvfb-run -a -s '-screen 0 1280x900x24' python3 .github/scripts/native16-arm64/native-window-smoke.py
      - name: Independent installed-package welcome, local-text chat and persistence
        id: chat
        if: ${{ !cancelled() && steps.startup.outcome != 'skipped' }}
        continue-on-error: true
        timeout-minutes: 12
        shell: bash
        run: |
          set -euo pipefail
          dbus-run-session -- xvfb-run -a -s '-screen 0 1280x900x24' /usr/bin/python3 .github/scripts/native16-arm64/package-ui-journey.py
      - name: Independent installed-package real Chromium browser journey
        id: browser
        if: ${{ !cancelled() && steps.startup.outcome != 'skipped' }}
        continue-on-error: true
        timeout-minutes: 15
        shell: bash
        run: |
          set -euo pipefail
          dbus-run-session -- xvfb-run -a -s '-screen 0 1280x900x24' /usr/bin/python3 .github/scripts/native16-arm64/package-browser-journey.py
      - name: Remove only this CI candidate and verify profile data preservation
        id: removal
        if: ${{ always() && env.PREVIEW_DEB != '' }}
        continue-on-error: true
        timeout-minutes: 3
        run: python3 .github/scripts/native16-arm64/package-removal-check.py
      - name: Aggregate actual raw setup/Home/chat/browser/removal receipts without hiding any failed close
        if: always()
        env:
          STARTUP_OUTCOME: ${{ steps.startup.outcome }}
          CHAT_OUTCOME: ${{ steps.chat.outcome }}
          BROWSER_OUTCOME: ${{ steps.browser.outcome }}
          REMOVAL_OUTCOME: ${{ steps.removal.outcome }}
        run: python3 .github/scripts/native16-arm64/aggregate-package-journeys.py
      - name: Optional same-repository INTERNAL draft asset upload (never publishes release)
        if: ${{ success() && inputs.upload_draft_asset }}
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh api repos/CroakyJake12/9to1/releases/419289496 > evidence/internal-draft-before.json
          python3 - <<'PY'
          import json
          x=json.load(open('evidence/internal-draft-before.json'))
          assert x['id']==419289496 and x['draft'] is True and x['published_at'] is None
          assert x['tag_name']=='internal-native16-arm64-20261021'
          PY
          # Ephemeral workflow token, standard GitHub upload. No owner credential extraction,
          # clobber, public promotion or retry bypass. A failure remains a failure.
          gh release upload internal-native16-arm64-20261021 "$PREVIEW_DEB" --repo CroakyJake12/9to1
          gh api repos/CroakyJake12/9to1/releases/419289496 > evidence/internal-draft-after.json
          python3 - <<'PY'
          import json
          x=json.load(open('evidence/internal-draft-after.json'))
          assert x['draft'] is True and x['published_at'] is None
          PY
      - name: Upload actual package plus SHA/provenance (no profile/database)
        if: ${{ always() && env.PREVIEW_PACKAGE_DIR != '' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4, verified 2026-10-22
        with:
          name: 9to1-native16-arm64-internal-package
          path: |
            ${{ env.PREVIEW_PACKAGE_DIR }}/*.deb
            ${{ env.PREVIEW_PACKAGE_DIR }}/SHA256SUMS
            ${{ env.PREVIEW_PACKAGE_DIR }}/package-receipt.json
          retention-days: 14
          if-no-files-found: error
      - name: Upload bundled Chromium source/provenance sidecar
        if: ${{ always() && env.BROWSER_SIDECAR != '' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4, verified 2026-10-22
        with:
          name: 9to1-browser-source-sidecar
          path: ${{ env.BROWSER_SIDECAR }}
          retention-days: 14
          if-no-files-found: error
      - name: Upload unchanged corresponding upstream engine source (no inference executable or weights)
        if: ${{ always() && env.PREVIEW_INFERENCE_SOURCE != '' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4, verified 2026-10-22
        with:
          name: 9to1-pinned-llamacpp-upstream-source
          path: ${{ env.PREVIEW_INFERENCE_SOURCE }}
          retention-days: 14
          if-no-files-found: error
      - name: Preserve inference acquisition and data-stage identity evidence
        if: ${{ always() && env.PREVIEW_INFERENCE_RECEIPT != '' }}
        shell: bash
        run: cp "$PREVIEW_INFERENCE_RECEIPT" evidence/inference-stage-receipt.json
      - name: Retain bounded browser supplier diagnostics even when sidecar skipped
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/native16-arm64/retain-browser-supply-evidence.py \
            --source "${RUNNER_TEMP}/9to1-browser-evidence" \
            --dest "${GITHUB_WORKSPACE}/evidence/browser-supply"
      - name: Upload bounded evidence and exact source archive
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4, verified 2026-10-22
        with:
          name: 9to1-native16-arm64-source-and-startup-evidence
          path: evidence/
          retention-days: 14
          if-no-files-found: error
