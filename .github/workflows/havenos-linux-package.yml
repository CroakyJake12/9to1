name: 9to1 exact ARM64 package independent diagnostics (no rebuild)
on:
  workflow_dispatch:
    inputs:
      upload_draft_asset:
        description: Must remain false; diagnostic package is not a new shipping candidate
        type: boolean
        required: true
        default: false
permissions:
  contents: read
  actions: read
env:
  EXPECTED_SOURCE_HEAD: 5893fc7d63715898ad6024d8d84ac5edb125252a
jobs:
  exact-package-ui:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    steps:
      - name: Checkout only reviewed diagnostic tools
        uses: actions/checkout@v4
        with:
          path: acceptance-tools
          persist-credentials: false
          sparse-checkout: .github/scripts/lesson-chat-package-acceptance
      - name: Checkout exact packaged application CLI metadata and external observer (no build)
        uses: actions/checkout@v4
        with:
          ref: 5893fc7d63715898ad6024d8d84ac5edb125252a
          path: exact-source
          persist-credentials: false
          sparse-checkout: .github/scripts/native16-arm64
      - name: Record real platform and distinct tool versus packaged-source identities
        shell: bash
        run: |
          set -euo pipefail
          test "${{ inputs.upload_draft_asset }}" = false
          test "$(uname -m)" = aarch64
          test "$(dpkg --print-architecture)" = arm64
          test "$(id -u)" != 0
          mkdir evidence
          uname -a > evidence/native-platform.txt
          cat /etc/os-release >> evidence/native-platform.txt
          git -C acceptance-tools rev-parse HEAD > evidence/acceptance-tools-commit.txt
          git -C exact-source rev-parse HEAD > evidence/exact-app-source-commit.txt
          test "$(cat evidence/exact-app-source-commit.txt)" = "$EXPECTED_SOURCE_HEAD"
          cp exact-source/.github/scripts/native16-arm64/native16-source-identity.json evidence/exact-app-source-identity.json
          echo "EXACT_OBSERVER_DIRECTORY=$GITHUB_WORKSPACE/exact-source/.github/scripts/native16-arm64" >> "$GITHUB_ENV"
      - name: Download and strictly verify same actual package plus retain prior failed gate
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 acceptance-tools/.github/scripts/lesson-chat-package-acceptance/download-exact-package.py
      - name: Install exact package and display dependencies on disposable ARM runner
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends xvfb openbox wmctrl xdotool x11-utils imagemagick dbus-x11 at-spi2-core python3-pyatspi tesseract-ocr fonts-dejavu-core
          sudo apt-get install -y --no-install-recommends "$EXACT_PREVIEW_DEB"
          dpkg-query -W 9to1-preview > evidence/installed-package.txt
          sha256sum "$EXACT_PREVIEW_DEB" > evidence/installed-deb.sha256
          cp /usr/share/doc/9to1-preview/source-and-build.json evidence/installed-source-and-build.json
      - name: Independently observe fresh actual Home readiness and normal close
        id: home
        continue-on-error: true
        timeout-minutes: 6
        run: dbus-run-session -- xvfb-run -a -s '-screen 0 1280x900x24' /usr/bin/python3 acceptance-tools/.github/scripts/lesson-chat-package-acceptance/fresh-home-diagnostic.py
      - name: Independently attempt fresh actual UI chat despite separate Home close failure
        id: chat
        if: ${{ !cancelled() && steps.home.outcome != 'skipped' }}
        continue-on-error: true
        timeout-minutes: 9
        run: dbus-run-session -- xvfb-run -a -s '-screen 0 1280x900x24' /usr/bin/python3 acceptance-tools/.github/scripts/lesson-chat-package-acceptance/package-ui-journey.py
      - name: Preserve every gate and aggregate truthful failure after independent observations
        if: always()
        env:
          HOME_OUTCOME: ${{ steps.home.outcome }}
          CHAT_OUTCOME: ${{ steps.chat.outcome }}
        shell: python
        run: |
          from pathlib import Path
          import json,os,sys,datetime
          out=Path('evidence');out.mkdir(exist_ok=True)
          old=out/'retained-prior-failure.json'
          prior=json.loads(old.read_text()) if old.exists() else {'status':'NOT VERIFIED'}
          result={'at':datetime.datetime.now(datetime.timezone.utc).isoformat(),'source_head':os.environ['EXPECTED_SOURCE_HEAD'],'tool_commit':os.environ['GITHUB_SHA'],'same_existing_package':True,'prior_early_close':prior,'fresh_Home_step':os.environ['HOME_OUTCOME'],'independent_fresh_chat_step':os.environ['CHAT_OUTCOME'],'status':'FAIL_KNOWN_EARLY_CLOSE_NOT_WAIVED','owner_laptop':'NOT RUN','welcome_setup':'NOT INCLUDED_IN_THIS_OLD_DIAGNOSTIC_PACKAGE','independent_screenshot_review':'REQUIRED','new_shipping_acceptance':False}
          (out/'combined-diagnostic-receipt.json').write_text(json.dumps(result,indent=2)+'\n')
          sys.exit(1)
      - name: Preserve bounded raw evidence despite known failure (no raw profiles/databases/package)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: 9to1-arm64-same-package-independent-home-chat-diagnostics
          path: evidence/
          retention-days: 1
          if-no-files-found: error
