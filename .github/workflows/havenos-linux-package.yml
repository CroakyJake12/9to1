name: 9to1 exact ab7 ARM64 package isolation experiment (no rebuild)
on:
  workflow_dispatch:
    inputs:
      upload_draft_asset:
        description: Must remain false; this package-only experiment never publishes
        type: boolean
        required: true
        default: false
permissions:
  contents: read
  actions: read
env:
  EXPECTED_SOURCE_HEAD: ab7bc6b8b2d72a0c97d3b56423d93e0f4f5a466a
jobs:
  exact-package-isolation:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 22
    steps:
      - name: Checkout reviewed acceptance tools only
        uses: actions/checkout@v4
        with:
          path: acceptance-tools
          persist-credentials: false
          sparse-checkout: .github/scripts/native16-arm64
      - name: Checkout immutable actual package source metadata (no build)
        uses: actions/checkout@v4
        with:
          ref: ab7bc6b8b2d72a0c97d3b56423d93e0f4f5a466a
          path: exact-source
          persist-credentials: false
          sparse-checkout: .github/scripts/native16-arm64
      - name: Record normal native platform, both identities and unchanged authored UI driver
        shell: bash
        run: |
          set -euo pipefail
          test "${{ inputs.upload_draft_asset }}" = false
          test "$(uname -m)" = aarch64
          test "$(dpkg --print-architecture)" = arm64
          test "$(id -u)" != 0
          mkdir evidence
          uname -a > evidence/native-platform.txt
          cat /etc/os-release >> evidence/native-platform.txt
          git -C acceptance-tools rev-parse HEAD > evidence/acceptance-tools-commit.txt
          git -C exact-source rev-parse HEAD > evidence/exact-app-source-commit.txt
          test "$(cat evidence/exact-app-source-commit.txt)" = "$EXPECTED_SOURCE_HEAD"
          cmp acceptance-tools/.github/scripts/native16-arm64/onboarding-driver.py exact-source/.github/scripts/native16-arm64/onboarding-driver.py
          cmp acceptance-tools/.github/scripts/native16-arm64/desktop-observe.py exact-source/.github/scripts/native16-arm64/desktop-observe.py
          cp exact-source/.github/scripts/native16-arm64/native16-source-identity.json evidence/exact-app-source-identity.json
          cp acceptance-tools/.github/scripts/native16-arm64/prior-ab7-required-phase-failures.json evidence/
      - name: Download exact existing package once and verify provider ZIP plus inner package
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 acceptance-tools/.github/scripts/native16-arm64/download-exact-package.py
      - name: Install exact existing package and ordinary UI tools on disposable runner
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends xvfb openbox wmctrl xdotool x11-utils imagemagick dbus-x11 at-spi2-core python3-pyatspi fonts-dejavu-core tesseract-ocr
          sudo apt-get install -y --no-install-recommends "$EXACT_PREVIEW_DEB"
          dpkg-query -W 9to1-preview > evidence/installed-package.txt
          sha256sum "$EXACT_PREVIEW_DEB" > evidence/installed-deb.sha256
          cp /usr/share/doc/9to1-preview/source-and-build.json evidence/installed-source-and-build.json
      - name: Original native early-close, real Welcome Home and same-profile restart gates in separate XDG contexts
        id: startup
        continue-on-error: true
        run: dbus-run-session -- xvfb-run -a -s '-screen 0 1280x900x24' /usr/bin/python3 acceptance-tools/.github/scripts/native16-arm64/native-window-smoke.py
      - name: Independent original real UI prompt response and read-only persistence journey
        id: chat
        if: ${{ !cancelled() && steps.startup.outcome != 'skipped' }}
        continue-on-error: true
        run: dbus-run-session -- xvfb-run -a -s '-screen 0 1280x900x24' /usr/bin/python3 acceptance-tools/.github/scripts/native16-arm64/package-ui-journey.py
      - name: Retain underlying outcomes and every required gate failure
        if: ${{ always() }}
        env:
          STARTUP_OUTCOME: ${{ steps.startup.outcome }}
          CHAT_OUTCOME: ${{ steps.chat.outcome }}
        shell: bash
        run: |
          /usr/bin/python3 - <<'PY'
          import os,json,pathlib,sys,datetime
          out=pathlib.Path('evidence');out.mkdir(exist_ok=True)
          raw={}
          for name in ('native-startup-receipt.json','package-ui-journey-receipt.json'):
              p=out/name
              raw[name]=json.loads(p.read_text()) if p.is_file() else {'status':'NOT RUN_OR_NO_RECEIPT'}
          startup=raw['native-startup-receipt.json'];chat=raw['package-ui-journey-receipt.json']
          passed=(os.environ['STARTUP_OUTCOME']=='success' and os.environ['CHAT_OUTCOME']=='success'
                  and startup.get('status','').startswith('PASS_BOUNDED_')
                  and chat.get('status')=='CHECKPOINT_ACTUAL_UI_JOURNEY_REQUIRES_INDEPENDENT_SCREENSHOT_REVIEW'
                  and not startup.get('required_phase_failures') and not chat.get('required_phase_failures'))
          result={'at':datetime.datetime.now(datetime.timezone.utc).isoformat(),'package_source_head':os.environ['EXPECTED_SOURCE_HEAD'],
                  'acceptance_tools_head':os.environ['GITHUB_SHA'],'startup_underlying_outcome':os.environ['STARTUP_OUTCOME'],
                  'chat_underlying_outcome':os.environ['CHAT_OUTCOME'],'raw_receipts':raw,
                  'status':'CHECKPOINT_REQUIRES_INDEPENDENT_SCREENSHOT_REVIEW' if passed else 'FAIL_OR_BLOCKED',
                  'hypothesis':'Shared XDG/socket/orphan contamination remains unproven until physical comparison.',
                  'owner_laptop':'NOT RUN','full_app_acceptance':'NOT CLAIMED','rebuild':False}
          (out/'combined-isolation-experiment-receipt.json').write_text(json.dumps(result,indent=2)+'\n')
          sys.exit(0 if passed else 1)
          PY
      - name: Preserve bounded raw evidence even on failure (no package profiles databases weights or credentials)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: 9to1-ab7-arm64-package-isolation-evidence
          path: evidence/
          retention-days: 1
          if-no-files-found: error
