name: 9to1 exact ARM64 package UI acceptance (no rebuild)
on:
  workflow_dispatch:
    inputs:
      upload_draft_asset:
        description: Must remain false; package-only acceptance does not publish or upload releases
        type: boolean
        required: true
        default: false
permissions:
  contents: read
  actions: read
jobs:
  exact-package-ui:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    steps:
      - name: Checkout only reviewed acceptance tools
        uses: actions/checkout@v4
        with:
          path: acceptance-tools
          persist-credentials: false
          sparse-checkout: .github/scripts/lesson-chat-package-acceptance
      - name: Checkout exact application source CLI metadata (no build)
        uses: actions/checkout@v4
        with:
          ref: 057515059da6f3b2a2e8d979d080404689c076af
          path: exact-source
          persist-credentials: false
          sparse-checkout: |
            .github/scripts/native16-arm64
            docs/specification
      - name: Record native platform and both exact source identities
        shell: bash
        run: |
          set -euo pipefail
          test "${{ inputs.upload_draft_asset }}" = false
          test "$(uname -m)" = aarch64
          test "$(dpkg --print-architecture)" = arm64
          test "$(id -u)" != 0
          mkdir evidence
          uname -a > evidence/native-platform.txt
          cat /etc/os-release >> evidence/native-platform.txt
          git -C acceptance-tools rev-parse HEAD > evidence/acceptance-tools-commit.txt
          git -C exact-source rev-parse HEAD > evidence/exact-app-source-commit.txt
          test "$(cat evidence/exact-app-source-commit.txt)" = 057515059da6f3b2a2e8d979d080404689c076af
          cp exact-source/.github/scripts/native16-arm64/native16-source-identity.json evidence/exact-app-source-identity.json
      - name: Download exact actual package artifact once and verify provider ZIP plus inner package
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 acceptance-tools/.github/scripts/lesson-chat-package-acceptance/download-exact-package.py
      - name: Install native display/accessibility dependencies and exact package on disposable runner
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends xvfb openbox wmctrl xdotool x11-utils imagemagick dbus-x11 at-spi2-core python3-pyatspi fonts-dejavu-core
          sudo apt-get install -y --no-install-recommends "$EXACT_PREVIEW_DEB"
          dpkg-query -W 9to1-preview > evidence/installed-package.txt
          sha256sum "$EXACT_PREVIEW_DEB" > evidence/installed-deb.sha256
          cp /usr/share/doc/9to1-preview/source-and-build.json evidence/installed-source-and-build.json
      - name: Actual fresh normal-user startup, UI prompt and persistence journey
        shell: bash
        run: |
          set -euo pipefail
          dbus-run-session -- xvfb-run -a -s '-screen 0 1280x900x24' /usr/bin/python3 acceptance-tools/.github/scripts/lesson-chat-package-acceptance/package-ui-journey.py
      - name: Preserve only bounded actual evidence (no package/profile/database/model/key)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: 9to1-arm64-exact-package-ui-acceptance
          path: evidence/
          retention-days: 1
          if-no-files-found: error
