name: 9to1 exact ab7 engine retained-socket double-start (no rebuild)
on:
  workflow_dispatch:
    inputs:
      upload_draft_asset:
        description: Must remain false; this package-only experiment never publishes
        type: boolean
        required: true
        default: false
permissions:
  contents: read
  actions: read
env:
  EXPECTED_SOURCE_HEAD: ab7bc6b8b2d72a0c97d3b56423d93e0f4f5a466a
jobs:
  exact-package-isolation:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 8
    steps:
      - name: Checkout reviewed acceptance tools only
        uses: actions/checkout@v4
        with:
          path: acceptance-tools
          persist-credentials: false
          sparse-checkout: .github/scripts/native16-arm64
      - name: Checkout immutable actual package source metadata (no build)
        uses: actions/checkout@v4
        with:
          ref: ab7bc6b8b2d72a0c97d3b56423d93e0f4f5a466a
          path: exact-source
          persist-credentials: false
          sparse-checkout: .github/scripts/native16-arm64
      - name: Record normal native platform, both identities and unchanged authored UI driver
        shell: bash
        run: |
          set -euo pipefail
          test "${{ inputs.upload_draft_asset }}" = false
          test "$(uname -m)" = aarch64
          test "$(dpkg --print-architecture)" = arm64
          test "$(id -u)" != 0
          mkdir evidence
          uname -a > evidence/native-platform.txt
          cat /etc/os-release >> evidence/native-platform.txt
          git -C acceptance-tools rev-parse HEAD > evidence/acceptance-tools-commit.txt
          git -C exact-source rev-parse HEAD > evidence/exact-app-source-commit.txt
          test "$(cat evidence/exact-app-source-commit.txt)" = "$EXPECTED_SOURCE_HEAD"
          cmp acceptance-tools/.github/scripts/native16-arm64/onboarding-driver.py exact-source/.github/scripts/native16-arm64/onboarding-driver.py
          cmp acceptance-tools/.github/scripts/native16-arm64/desktop-observe.py exact-source/.github/scripts/native16-arm64/desktop-observe.py
          cp exact-source/.github/scripts/native16-arm64/native16-source-identity.json evidence/exact-app-source-identity.json
          cp acceptance-tools/.github/scripts/native16-arm64/prior-ab7-required-phase-failures.json evidence/
      - name: Download exact existing package once and verify provider ZIP plus inner package
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 acceptance-tools/.github/scripts/native16-arm64/download-exact-package.py
      - name: Install exact existing package and ordinary UI tools on disposable runner
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends xvfb openbox wmctrl xdotool x11-utils imagemagick dbus-x11 at-spi2-core python3-pyatspi fonts-dejavu-core tesseract-ocr
          sudo apt-get install -y --no-install-recommends "$EXACT_PREVIEW_DEB"
          dpkg-query -W 9to1-preview > evidence/installed-package.txt
          sha256sum "$EXACT_PREVIEW_DEB" > evidence/installed-deb.sha256
          cp /usr/share/doc/9to1-preview/source-and-build.json evidence/installed-source-and-build.json
      - name: Exact installed engine double-start with retained socket and live same-peer health
        id: double_start
        run: /usr/bin/python3 acceptance-tools/.github/scripts/native16-arm64/engine-double-start.py --diagnostic-logging
      - name: Preserve bounded raw evidence even on failure (no package profiles databases weights or credentials)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: 9to1-ab7-arm64-engine-double-start-evidence
          path: evidence/
          retention-days: 1
          if-no-files-found: error
