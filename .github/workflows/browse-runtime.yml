name: Browse - donor runtime integration
on:
  push:
    branches: [feat/browse-donor-runtime]
    paths: ['9to1 Workspace/Browse/**', '9to1 Workspace/shared/**', '.github/workflows/browse-runtime.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: browse-runtime-${{ github.ref }}
  cancel-in-progress: false
jobs:
  runtime-baseline:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 1
          submodules: false
          persist-credentials: false
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with:
          dotnet-version: 10.0.301
      - name: Acquire exact-revision upstream Chromium binary (not a local donor build)
        run: python3 '9to1 Workspace/Browse/Runtime/acquire_snapshot.py' --output "$RUNNER_TEMP/browse-chromium" --evidence artifacts/chromium-binary-acquisition.json
      - name: Configure upstream sandbox helper on the isolated test runner
        run: |
          set -euo pipefail
          helper="$(dirname "$BROWSE_CHROMIUM_EXE")/chrome_sandbox"
          test -f "$helper"
          sudo chown root:root "$helper"
          sudo chmod 4755 "$helper"
          echo "CHROME_DEVEL_SANDBOX=$helper" >> "$GITHUB_ENV"
      - name: Compile and run Browse regression and real native tests
        if: always()
        env:
          BROWSE_RUNTIME_EVIDENCE: ${{ github.workspace }}/artifacts/native
        run: |
          set -euo pipefail
          mkdir -p artifacts
          git rev-parse HEAD > artifacts/SOURCE_COMMIT
          dotnet test '9to1 Workspace/Browse/Tests/HavenOS.Apps.Browse.Tests.csproj' --configuration Release --logger 'trx;LogFileName=browse.trx' --results-directory "$GITHUB_WORKSPACE/artifacts" 2>&1 | tee artifacts/dotnet-tests.log
      - name: Publish observed build, test and binary acquisition evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: browse-runtime-evidence-${{ github.sha }}
          path: artifacts/
          if-no-files-found: error
          retention-days: 14
