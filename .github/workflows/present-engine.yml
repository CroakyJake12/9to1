name: Present engine

on:
  pull_request:
    paths:
      - "apps/present-engine/**"
      - ".github/workflows/present-engine.yml"
  push:
    branches:
      - "migration/present-libreoffice-foundation"
    paths:
      - "apps/present-engine/**"
      - ".github/workflows/present-engine.yml"

permissions:
  contents: read

jobs:
  compatibility-24-04:
    name: Ubuntu 24.04 compile compatibility
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Check out CakeOS
        uses: actions/checkout@v4

      - name: Install LibreOfficeKit compatibility headers
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            libreofficekit-dev \
            libreoffice-impress-nogui \
            nlohmann-json3-dev

      - name: Configure
        run: cmake -S apps/present-engine -B build/present-engine -DCMAKE_BUILD_TYPE=Release

      - name: Build with warnings as errors
        run: cmake --build build/present-engine --parallel 2

      - name: Run contract tests
        run: ctest --test-dir build/present-engine --output-on-failure

      - name: Record compatibility versions
        if: always()
        run: |
          dpkg-query -W -f='${Package} ${Version}\n' libreofficekit-dev libreoffice-impress-nogui libreoffice-core-nogui nlohmann-json3-dev || true
          /usr/lib/libreoffice/program/soffice --version || true

  runtime-26-04:
    name: Ubuntu 26.04 LibreOfficeKit runtime proof
    runs-on: ubuntu-26.04
    timeout-minutes: 15

    steps:
      - name: Check out CakeOS
        uses: actions/checkout@v4

      - name: Install no-GUI LibreOfficeKit dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            libreofficekit-dev \
            libreoffice-impress-nogui \
            nlohmann-json3-dev

      - name: Configure
        run: cmake -S apps/present-engine -B build/present-engine -DCMAKE_BUILD_TYPE=Release

      - name: Build with warnings as errors
        run: cmake --build build/present-engine --parallel 2

      - name: Run contract tests
        run: ctest --test-dir build/present-engine --output-on-failure

      - name: Create deterministic ODP fixtures
        run: |
          python3 apps/present-engine/tests/make_smoke_fixture.py /tmp/cakeos-present-source.odp
          python3 apps/present-engine/tests/make_reorder_fixture.py /tmp/cakeos-present-reorder-source.odp

      - name: Normalize fixtures through LibreOffice Impress
        run: |
          mkdir -p /tmp/cakeos-present-normalized
          /usr/lib/libreoffice/program/soffice \
            --headless \
            --convert-to odp \
            --outdir /tmp/cakeos-present-normalized \
            /tmp/cakeos-present-source.odp
          /usr/lib/libreoffice/program/soffice \
            --headless \
            --convert-to odp \
            --outdir /tmp/cakeos-present-normalized \
            /tmp/cakeos-present-reorder-source.odp
          test -s /tmp/cakeos-present-normalized/cakeos-present-source.odp
          test -s /tmp/cakeos-present-normalized/cakeos-present-reorder-source.odp

      - name: Prove exact geometry and LibreOfficeKit Impress rendering
        run: |
          build/present-engine/cakeos-present-engine-smoke \
            /tmp/cakeos-present-normalized/cakeos-present-source.odp \
            /tmp/cakeos-present-smoke.ppm | tee /tmp/present-smoke.log
          test -s /tmp/cakeos-present-smoke.ppm
          grep -q '^slides=1$' /tmp/present-smoke.log
          grep -q '^pixels=1280x720$' /tmp/present-smoke.log
          python3 - <<'PY'
          from pathlib import Path
          import re

          log = Path('/tmp/present-smoke.log').read_text()
          match = re.search(r'^extent_twips=(\d+)x(\d+)$', log, re.MULTILINE)
          if not match:
              raise SystemExit('missing extent_twips output')
          width, height = map(int, match.groups())
          if width < 1000 or height < 1000:
              raise SystemExit(f'unrealistic slide extent: {width}x{height} twips')

          data = Path('/tmp/cakeos-present-smoke.ppm').read_bytes()
          _, body = data.split(b'\n255\n', 1)
          pixels = {body[i:i+3] for i in range(0, len(body), 3)}
          if len(pixels) < 2:
              raise SystemExit('rendered slide is a uniform image')
          print(f'validated_extent_twips={width}x{height}')
          print(f'unique_rgb_values={len(pixels)}')
          PY

      - name: Prove semantic lifecycle, persistence, and PPTX round trip
        run: |
          rm -f \
            /tmp/cakeos-present-mutated.odp \
            /tmp/cakeos-present-mutated.pptx \
            /tmp/cakeos-present-pptx.ppm
          build/present-engine/cakeos-present-engine-lifecycle-smoke \
            /tmp/cakeos-present-normalized/cakeos-present-source.odp \
            /tmp/cakeos-present-mutated.odp \
            /tmp/cakeos-present-mutated.pptx | tee /tmp/present-lifecycle.log
          test -s /tmp/cakeos-present-mutated.odp
          test -s /tmp/cakeos-present-mutated.pptx
          grep -q '^semantic_lifecycle=passed$' /tmp/present-lifecycle.log
          grep -q '^saved_slides=2$' /tmp/present-lifecycle.log
          grep -q '^pptx_roundtrip=passed$' /tmp/present-lifecycle.log

          build/present-engine/cakeos-present-engine-smoke \
            /tmp/cakeos-present-mutated.pptx \
            /tmp/cakeos-present-pptx.ppm | tee /tmp/present-pptx.log
          test -s /tmp/cakeos-present-pptx.ppm
          grep -q '^slides=2$' /tmp/present-pptx.log
          grep -q '^pixels=1280x720$' /tmp/present-pptx.log
          python3 - <<'PY'
          from pathlib import Path

          data = Path('/tmp/cakeos-present-pptx.ppm').read_bytes()
          _, body = data.split(b'\n255\n', 1)
          pixels = {body[i:i+3] for i in range(0, len(body), 3)}
          if len(pixels) < 2:
              raise SystemExit('PPTX round-trip render is a uniform image')
          print(f'pptx_unique_rgb_values={len(pixels)}')
          PY

      - name: Prove slide reordering, undo-redo, and persistence
        run: |
          rm -f /tmp/cakeos-present-reordered.odp
          build/present-engine/cakeos-present-engine-reorder-smoke \
            /tmp/cakeos-present-normalized/cakeos-present-reorder-source.odp \
            /tmp/cakeos-present-reordered.odp | tee /tmp/present-reorder.log
          test -s /tmp/cakeos-present-reordered.odp
          grep -q '^slide_reorder=passed$' /tmp/present-reorder.log
          grep -q '^slide_reorder_directions=down,up$' /tmp/present-reorder.log
          grep -q '^slide_order=Beta,Gamma,Alpha$' /tmp/present-reorder.log

      - name: Prove mixed native and structural history
        run: |
          build/present-engine/cakeos-present-engine-mixed-history-smoke \
            /tmp/cakeos-present-normalized/cakeos-present-reorder-source.odp | tee /tmp/present-mixed-history.log
          grep -q '^mixed_history=passed$' /tmp/present-mixed-history.log
          grep -q '^mixed_history_redo_branch=truncated$' /tmp/present-mixed-history.log

      - name: Probe semantic slide object inventory
        run: |
          build/present-engine/cakeos-present-structure-probe \
            /tmp/cakeos-present-normalized/cakeos-present-reorder-source.odp | tee /tmp/present-structure.log
          grep -q '^structure_inventory=passed$' /tmp/present-structure.log
          grep -q '^structure_text=Alpha$' /tmp/present-structure.log

      - name: Probe semantic text transform history
        run: |
          rm -f \
            /tmp/cakeos-present-text-updated.odp \
            /tmp/cakeos-present-text-undo.odp \
            /tmp/cakeos-present-text-undo-redo.odp
          build/present-engine/cakeos-present-text-history-probe \
            /tmp/cakeos-present-normalized/cakeos-present-reorder-source.odp \
            /tmp/cakeos-present-text-updated.odp \
            /tmp/cakeos-present-text-undo.odp | tee /tmp/present-text-history.log
          grep -q '^text_transform=passed$' /tmp/present-text-history.log

      - name: Prove framed HUI worker protocol
        run: |
          rm -f \
            /tmp/cakeos-present-worker-output.odp \
            /tmp/cakeos-present-worker-output-reordered.odp
          python3 apps/present-engine/tests/worker_protocol_smoke.py \
            build/present-engine/cakeos-present-worker \
            /tmp/cakeos-present-normalized/cakeos-present-source.odp \
            /tmp/cakeos-present-worker-output.odp \
            /tmp/cakeos-present-normalized/cakeos-present-reorder-source.odp | tee /tmp/present-worker.log
          test -s /tmp/cakeos-present-worker-output.odp
          test -s /tmp/cakeos-present-worker-output-reordered.odp
          grep -q '^worker_protocol=passed$' /tmp/present-worker.log
          grep -q '^worker_events=passed$' /tmp/present-worker.log
          grep -q '^worker_element_inventory=passed$' /tmp/present-worker.log
          grep -q '^worker_element_snapshot_staleness=passed$' /tmp/present-worker.log
          grep -q '^worker_slide_reorder=passed$' /tmp/present-worker.log
          grep -q '^worker_slide_order=Beta,Gamma,Alpha$' /tmp/present-worker.log
          grep -q '^worker_saved_slides=2$' /tmp/present-worker.log

          python3 apps/present-engine/tests/worker_text_smoke.py \
            build/present-engine/cakeos-present-worker \
            /tmp/cakeos-present-normalized/cakeos-present-reorder-source.odp \
            /tmp/cakeos-present-worker-text | tee /tmp/present-worker-text.log
          grep -q '^worker_text_replace=passed$' /tmp/present-worker-text.log
          grep -q '^worker_text_history=passed$' /tmp/present-worker-text.log
          grep -q '^worker_text_persistence=passed$' /tmp/present-worker-text.log

      - name: Record runtime versions
        if: always()
        run: |
          dpkg-query -W -f='${Package} ${Version}\n' libreofficekit-dev libreoffice-impress-nogui libreoffice-core-nogui nlohmann-json3-dev || true
          /usr/lib/libreoffice/program/soffice --version || true
