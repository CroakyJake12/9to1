name: Team C separate Home permission retention two (unaccepted)

on:
  push:
    branches: [team-c/sol-happy-home-retention-two-task-isolation-20261005]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: team-c-home-retention-two-${{ github.ref }}
  cancel-in-progress: false

jobs:
  separate-retention-two:
    runs-on: windows-2022
    timeout-minutes: 60
    env:
      AVALONIA_TELEMETRY_OPTOUT: "1"
      DOTNET_NOLOGO: "1"
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_GENERATE_ASPNET_CERTIFICATE: "false"
      MSBUILDDISABLENODEREUSE: "1"
    steps:
      - name: Preserve actual reviewed source bytes
        shell: pwsh
        run: |
          git config --global core.autocrlf false
          git config --global core.longpaths true
      - name: Check out the exact selected source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Acquire only the two current source gitlinks
        shell: pwsh
        run: |
          git submodule update --init --depth 1 -- framework/CUI/vendor/Avalonia/external/XamlX framework/CUI/vendor/Avalonia/external/Avalonia.DBus
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Select the repository SDK on this disposable runner
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Run separate supplemental two in Debug and Release with isolated actual source tasks
        shell: pwsh
        env:
          HOME_RETENTION_OUTPUT: ${{ runner.temp }}/home-retention-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          & .github/scripts/home-permission-retention-standalone.ps1 -ExpectedCommit '${{ github.sha }}' -OutputDirectory $env:HOME_RETENTION_OUTPUT
          exit $LASTEXITCODE
      - name: Retain standalone permission retention diagnostics and failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: team-c-home-retention-two-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/home-retention-${{ github.run_id }}-${{ github.run_attempt }}/diagnostics
          if-no-files-found: error
          retention-days: 7
