name: Team B ordinary Web publication

on:
  push:
    branches: ["team-b/**"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    if: startsWith(github.ref, 'refs/heads/team-b/')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      DOTNET_NOLOGO: "1"
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_GENERATE_ASPNET_CERTIFICATE: "false"
      MSBUILDDISABLENODEREUSE: "1"
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Initialize only actual native build gitlinks
        run: |
          git submodule update --init --recursive --depth 1 -- \
            framework/CUI/vendor/Avalonia/external/XamlX \
            framework/CUI/vendor/Avalonia/external/Avalonia.DBus
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.401"
      - name: Build locked adapter assets and publish exact checkout
        run: >-
          python3 apps/Web/Tests/ci/run-ordinary-web-publish.py
          --expected-commit '${{ github.sha }}'
          --output "$RUNNER_TEMP/team-b-web-publication"
      - name: Upload publication diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: team-b-web-diagnostics-${{ github.sha }}
          path: ${{ runner.temp }}/team-b-web-publication/diagnostics
          if-no-files-found: warn
          retention-days: 7
      - name: Upload successful sealed public bundle
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: team-b-web-public-bundle-${{ github.sha }}
          path: ${{ runner.temp }}/team-b-web-publication/public-artifact
          if-no-files-found: error
          retention-days: 7
