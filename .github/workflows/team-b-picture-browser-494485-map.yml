name: Team B exact Picture 494485 browser map-only custody

on:
  push:
    branches: [custody/team-b-picture-browser-494485-map-20261005]
    paths:
      - .github/workflows/team-b-picture-browser-494485-map.yml
      - apps/Web/Tests/ci/export-existing-picture-494485-browser-map.py
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  exact-selected-diagnostics:
    if: github.ref == 'refs/heads/custody/team-b-picture-browser-494485-map-20261005' && github.repository == 'CroakyJake12/9to1'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out exact diagnostic source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Verify whole original and emit map-only selection eligibility
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          python3 apps/Web/Tests/ci/export-existing-picture-494485-browser-map.py
          --output "$RUNNER_TEMP/team-b-picture-browser-494485-map"
      - name: Upload bounded map-only custody diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: picture-browser-494485-map-${{ github.sha }}
          path: ${{ runner.temp }}/team-b-picture-browser-494485-map/diagnostics
          if-no-files-found: warn
          retention-days: 7
