name: Team B exact successful Write 494485 canonical storage and resource bodies

on:
  push:
    branches: [custody/team-b-write-package-494485-storage-20261005]
    paths:
      - .github/workflows/team-b-write-package-494485-storage.yml
      - apps/Web/Write/Tests/ci/export-existing-write-package-494485-storage.py
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  exact-selected-diagnostics:
    if: github.ref == 'refs/heads/custody/team-b-write-package-494485-storage-20261005' && github.repository == 'CroakyJake12/9to1'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out exact diagnostic source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Verify whole original and select three complete canonical storage and resource members
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          python3 apps/Web/Write/Tests/ci/export-existing-write-package-494485-storage.py
          --output "$RUNNER_TEMP/team-b-write-package-494485-storage"
      - name: Upload bounded selected custody diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: write-package-494485-storage-${{ github.sha }}
          path: ${{ runner.temp }}/team-b-write-package-494485-storage/diagnostics
          if-no-files-found: warn
          retention-days: 7
