name: Team C original Home Windows composition eight and shutdown (unaccepted)

on:
  push:
    branches: [team-c/sol-happy-home-namespace-repaired-original-eight-20261004]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: team-c-home-original-${{ github.ref }}
  cancel-in-progress: false

jobs:
  original-home:
    runs-on: windows-2022
    timeout-minutes: 60
    env:
      AVALONIA_TELEMETRY_OPTOUT: "1"
      DOTNET_NOLOGO: "1"
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_GENERATE_ASPNET_CERTIFICATE: "false"
      MSBUILDDISABLENODEREUSE: "1"
    steps:
      - name: Preserve actual reviewed source bytes
        shell: pwsh
        run: |
          git config --global core.autocrlf false
          git config --global core.longpaths true
      - name: Check out the exact selected source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Acquire only the two current source gitlinks
        shell: pwsh
        run: |
          git submodule update --init --depth 1 -- framework/CUI/vendor/Avalonia/external/XamlX framework/CUI/vendor/Avalonia/external/Avalonia.DBus
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Select the repository SDK on this disposable runner
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Run all original owning tests and actual native explicit quit
        id: probe
        shell: pwsh
        env:
          HOME_ORIGINAL_OUTPUT: ${{ runner.temp }}/home-original-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          & .github/scripts/home-windows-original-shutdown.ps1 -ExpectedCommit '${{ github.sha }}' -OutputDirectory $env:HOME_ORIGINAL_OUTPUT
          exit $LASTEXITCODE
      - name: Retain original diagnostics and all failed observations
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: team-c-home-original-diagnostics-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/home-original-${{ github.run_id }}-${{ github.run_attempt }}/diagnostics
          if-no-files-found: warn
          retention-days: 7
      - name: Retain the actual complete sealed package
        if: always() && steps.probe.outputs.package_ready == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: team-c-home-original-package-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/home-original-${{ github.run_id }}-${{ github.run_attempt }}/public-artifact/home-win-x64.zip
            ${{ runner.temp }}/home-original-${{ github.run_id }}-${{ github.run_attempt }}/public-artifact/publish-manifest.json
            ${{ runner.temp }}/home-original-${{ github.run_id }}-${{ github.run_attempt }}/public-artifact/seal.json
          if-no-files-found: error
          retention-days: 7
      - name: Retain exact original ZIP transport part 01
        if: always() && steps.probe.outputs.publication_ready == 'true' && fromJSON(steps.probe.outputs.part_count || '0') >= 1
        uses: actions/upload-artifact@v4
        with:
          name: team-c-home-original-part01-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/home-original-${{ github.run_id }}-${{ github.run_attempt }}/public-parts/part01
          compression-level: 0
          if-no-files-found: error
          retention-days: 7
      - name: Retain exact original ZIP transport part 02
        if: always() && steps.probe.outputs.publication_ready == 'true' && fromJSON(steps.probe.outputs.part_count || '0') >= 2
        uses: actions/upload-artifact@v4
