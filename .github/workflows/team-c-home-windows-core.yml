name: Team C current Home Windows original113 compiler validation (unaccepted)
on:
  push:
    branches: [team-c/sol-happy-c1-home-current-113-compiler-fixed-20261004]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: home-windows-core-current113-${{ github.ref }}
  cancel-in-progress: false
jobs:
  original-home:
    runs-on: windows-2022
    timeout-minutes: 45
    env:
      AVALONIA_TELEMETRY_OPTOUT: "1"
      DOTNET_NOLOGO: "1"
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_GENERATE_ASPNET_CERTIFICATE: "false"
      MSBUILDDISABLENODEREUSE: "1"
    steps:
      - name: Preserve reviewed source bytes
        shell: pwsh
        run: |
          git config --global core.autocrlf false
          git config --global core.longpaths true
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Acquire only two exact maintained source gitlinks
        shell: pwsh
        run: |
          git submodule update --init --depth 1 -- framework/CUI/vendor/Avalonia/external/XamlX framework/CUI/vendor/Avalonia/external/Avalonia.DBus
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.401'
      - name: Source-build original twelve and full unfiltered owning113 Debug and Release
        shell: pwsh
        env:
          HOME_WINDOWS_CORE_OUTPUT: ${{ runner.temp }}/home-windows-core-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          & .github/scripts/home-windows-core.ps1 -ExpectedCommit '${{ github.sha }}' -OutputDirectory $env:HOME_WINDOWS_CORE_OUTPUT
          exit $LASTEXITCODE
      - name: Retain original safe first failure and all owning source/runtime/TRX evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: home-windows-core-current113-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/home-windows-core-${{ github.run_id }}-${{ github.run_attempt }}/diagnostics
          if-no-files-found: error
          retention-days: 7
