name: Team B Wave native responsive geometry controls

on:
  push:
    branches: ["team-b/**"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-responsive:
    strategy:
      fail-fast: false
      matrix:
        variant: [original, proposed]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      DOTNET_NOLOGO: "1"
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_GENERATE_ASPNET_CERTIFICATE: "false"
      MSBUILDDISABLENODEREUSE: "1"
    steps:
      - name: Check out exact source commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Initialize pinned actual native build dependencies
        run: |
          git submodule update --init --recursive --depth 1 -- \
            framework/CUI/vendor/Avalonia/external/XamlX \
            framework/CUI/vendor/Avalonia/external/Avalonia.DBus
      - name: Set up maintained SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.401"
      - name: Execute actual native Render and font geometry checks
        run: >-
          python3 apps/Web/Tests/ci/run-wave-responsive-native.py
          --variant '${{ matrix.variant }}'
          --expected-commit '${{ github.sha }}'
          --output "$RUNNER_TEMP/team-b-wave-layout-${{ matrix.variant }}"
      - name: Upload bounded public scripted geometry diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: team-b-wave-native-layout-${{ matrix.variant }}-${{ github.sha }}
          path: ${{ runner.temp }}/team-b-wave-layout-${{ matrix.variant }}/diagnostics
          if-no-files-found: warn
          retention-days: 7
